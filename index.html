wer":"错","options":[["对","对"],["错","错"]],"note":"（按教材考点）。肺泡隔中弹性纤维对肺回缩特别重要；但肺泡隔并非完全不含胶原纤维。"},{"id":"判断题-41","type":"判断题","number":41,"question":"胰岛素是由甲细胞分泌的。（      ）","answer":"错","options":[["对","对"],["错","错"]],"note":"由B细胞分泌。"},{"id":"判断题-42","type":"判断题","number":42,"question":"小肠粘膜中的毛细血管是有孔毛细血管。（   ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-43","type":"判断题","number":43,"question":"壁细胞分泌盐酸、内因子等。（   ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-44","type":"判断题","number":44,"question":"内皮是指分布于胸膜、腹膜、心包膜的单层扁平上皮。（       ）","answer":"错","options":[["对","对"],["错","错"]],"note":"该上皮称间皮。"},{"id":"判断题-45","type":"判断题","number":45,"question":"壁细胞合成和分泌胰蛋白酶。（  ）","answer":"错","options":[["对","对"],["错","错"]],"note":"胰腺腺泡细胞分泌胰蛋白酶原。"},{"id":"判断题-46","type":"判断题","number":46,"question":"球外系膜细胞可清除沉淀在基膜上的沉积物，维持基膜的通透性。（   ）","answer":"错","options":[["对","对"],["错","错"]],"note":"此为球内系膜细胞的重要功能。"},{"id":"判断题-47","type":"判断题","number":47,"question":"疏松结缔组织中肥大细胞参与过敏反应。（    ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-48","type":"判断题","number":48,"question":"轴突、树突都不含尼氏体。（   ）","answer":"错","options":[["对","对"],["错","错"]],"note":"树突含尼氏体，轴突不含。"},{"id":"判断题-49","type":"判断题","number":49,"question":"T淋巴细胞不需抗原刺激就能杀伤某些肿瘤细胞和病毒感染细胞。（    ）","answer":"错","options":[["对","对"],["错","错"]],"note":"题干描述的是NK细胞。"},{"id":"判断题-50","type":"判断题","number":50,"question":"破骨细胞是一种多核巨细胞，由多个浆细胞融合而成。（    ）","answer":"错","options":[["对","对"],["错","错"]],"note":"由单核-巨噬细胞谱系的前体融合形成。"},{"id":"判断题-51","type":"判断题","number":51,"question":"成纤维细胞可合成三种纤维，所以常沿胶原纤维分布。 （   ）","answer":"对","options":[["对","对"],["错","错"]],"note":"基本正确。其合成的胶原蛋白、弹性蛋白等参与形成结缔组织纤维。"},{"id":"判断题-52","type":"判断题","number":52,"question":"结缔组织细胞外基质中含有纤维。 （   ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-53","type":"判断题","number":53,"question":"肾上腺皮质球状带细胞分泌的醛固酮能促进肾远曲小管和集合管排出钠和重吸收钾。（  ）","answer":"错","options":[["对","对"],["错","错"]],"note":"促进钠重吸收、钾排出。"},{"id":"判断题-54","type":"判断题","number":54,"question":"小肠绒毛是由小肠粘膜层和粘膜下层共同向肠腔突出所形成。（  ）","answer":"错","options":[["对","对"],["错","错"]],"note":"由黏膜上皮和固有层形成。"},{"id":"判断题-55","type":"判断题","number":55,"question":"脾的动脉周围淋巴淋巴鞘主要由B细胞构成。（    ）","answer":"错","options":[["对","对"],["错","错"]],"note":"主要由T细胞构成。"},{"id":"判断题-56","type":"判断题","number":56,"question":"暗带是骨骼肌纤维中完全由细肌丝构成的带。(    )","answer":"错","options":[["对","对"],["错","错"]],"note":"暗带含粗肌丝及其与细肌丝重叠的部分。"},{"id":"判断题-57","type":"判断题","number":57,"question":"破骨细胞是一种多核巨细胞，由多个单核细胞融合而成。（    ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-58","type":"判断题","number":58,"question":"浆细胞能合成和分泌免疫球蛋白","options":[["对","对"],["错","错"]],"note":"浆细胞是分泌抗体的效应B细胞。","answer":"对"},{"id":"判断题-59","type":"判断题","number":59,"question":"甲状腺滤泡旁细胞可分泌甲状腺素","options":[["对","对"],["错","错"]],"note":"滤泡旁细胞分泌降钙素；甲状腺激素由滤泡上皮细胞合成和分泌。","answer":"错"},{"id":"名词解释-1","type":"名词解释","number":1,"question":"肾小叶","answer":"每条髓放线及其周围的皮质迷路共同构成一个肾小叶。","options":[],"note":null},{"id":"名词解释-2","type":"名词解释","number":2,"question":"黄体","answer":"排卵后，残余卵泡的颗粒细胞和卵泡膜内层细胞在黄体生成素作用下分别分化为粒黄体细胞和膜黄体细胞，形成暂时性内分泌结构，主要分泌孕激素。","options":[],"note":null},{"id":"名词解释-3","type":"名词解释","number":3,"question":"窦周隙","answer":"位于肝血窦内皮与肝细胞之间的狭窄间隙，内有血浆及肝星状细胞（贮脂细胞），是肝细胞与血液进行物质交换的重要场所。","options":[],"note":null},{"id":"名词解释-4","type":"名词解释","number":4,"question":"突触","answer":"神经元之间或神经元与效应细胞之间传递信息的特化连接结构。化学突触由突触前成分、突触间隙和突触后成分组成。","options":[],"note":null},{"id":"名词解释-5","type":"名词解释","number":5,"question":"气血屏障","answer":"肺泡内气体与毛细血管血液进行气体交换所经过的薄层结构，主要包括肺泡表面液体层、Ⅰ型肺泡细胞及基膜、薄层结缔组织、毛细血管基膜及内皮。","options":[],"note":null},{"id":"名词解释-6","type":"名词解释","number":6,"question":"胚胎学","answer":"研究个体从受精卵开始，经卵裂、分化、形态发生及器官形成等发育过程及规律的科学。","options":[],"note":null},{"id":"名词解释-7","type":"名词解释","number":7,"question":"滤过膜","answer":"又称肾小球滤过屏障，由肾小球有孔毛细血管内皮、肾小球基膜和足细胞裂孔膜构成，参与血液滤过形成原尿。","options":[],"note":null},{"id":"名词解释-8","type":"名词解释","number":8,"question":"肌节","answer":"相邻两条Z线之间的一段肌原纤维，是横纹肌收缩的基本结构单位，由1/2明带、完整暗带和1/2明带组成。","options":[],"note":null},{"id":"名词解释-9","type":"名词解释","number":9,"question":"骨板","answer":"骨组织中胶原纤维按一定方向排列成层，骨盐沉积于其间而形成的板层状骨基质结构。","options":[],"note":null},{"id":"名词解释-10","type":"名词解释","number":10,"question":"胃底腺","answer":"位于胃底及胃体黏膜固有层的管状腺，主要含主细胞、壁细胞、颈黏液细胞、内分泌细胞和干细胞。主细胞分泌胃蛋白酶原，壁细胞分泌盐酸和内因子。","options":[],"note":null},{"id":"名词解释-11","type":"名词解释","number":11,"question":"哈弗斯系统","answer":"又称骨单位，由中央哈弗斯管及其周围同心圆排列的哈弗斯骨板组成，是长骨骨密质的重要结构单位。","options":[],"note":null},{"id":"名词解释-12","type":"名词解释","number":12,"question":"组织学","answer":"研究正常机体组织、器官微细结构及其相关功能的科学。","options":[],"note":null},{"id":"名词解释-13","type":"名词解释","number":13,"question":"血睾屏障","answer":"由生精小管周围毛细血管内皮及基膜、结缔组织、生精小管界膜及支持细胞间紧密连接等构成，其中支持细胞间紧密连接是关键结构。","options":[],"note":null},{"id":"名词解释-14","type":"名词解释","number":14,"question":"神经纤维","answer":"由神经元长突起及包绕它的神经胶质细胞组成，具有传导神经冲动的功能。","options":[],"note":null},{"id":"名词解释-15","type":"名词解释","number":15,"question":"肾小球旁器","answer":"又称球旁复合体，位于肾小体血管极附近，由球旁细胞、致密斑和球外系膜细胞组成，参与调节血压和水盐平衡。","options":[],"note":null},{"id":"名词解释-16","type":"名词解释","number":16,"question":"肺小叶","answer":"由一个细支气管及其各级分支和所属肺组织组成的肺结构单位。","options":[],"note":null},{"id":"名词解释-17","type":"名词解释","number":17,"question":"血脑屏障","answer":"由脑内连续毛细血管内皮及其紧密连接、基膜、周细胞和星形胶质细胞终足等共同形成，限制某些物质由血液进入脑组织。","options":[],"note":null},{"id":"名词解释-18","type":"名词解释","number":18,"question":"胃表面粘液屏障","answer":"胃黏膜表面的黏液凝胶与其中的碳酸氢根共同构成黏液-碳酸氢盐屏障，能够减轻胃酸及胃蛋白酶对胃黏膜的损伤。","options":[],"note":null},{"id":"名词解释-19","type":"名词解释","number":19,"question":"尘细胞","answer":"吞噬了吸入肺内尘粒的肺巨噬细胞，参与清除肺泡内异物。","options":[],"note":null},{"id":"名词解释-20","type":"名词解释","number":20,"question":"排卵","answer":"成熟卵泡破裂，次级卵母细胞连同透明带、放射冠等随卵泡液从卵巢排出的过程。","options":[],"note":null},{"id":"名词解释-21","type":"名词解释","number":21,"question":"组织","answer":"由形态相似、功能相关的细胞群及细胞外基质共同组成的结构。","options":[],"note":null},{"id":"名词解释-22","type":"名词解释","number":22,"question":"间皮","answer":"分布于胸膜、腹膜和心包膜等浆膜表面的单层扁平上皮。","options":[],"note":null},{"id":"名词解释-23","type":"名词解释","number":23,"question":"同源细胞群","answer":"由一个软骨细胞分裂形成的两个或多个聚集在一起的软骨细胞群。","options":[],"note":null},{"id":"名词解释-24","type":"名词解释","number":24,"question":"横纹","answer":"横纹肌中肌原纤维的明带与暗带在同一平面对应排列，形成与肌纤维长轴垂直的明暗相间条纹。","options":[],"note":null},{"id":"名词解释-25","type":"名词解释","number":25,"question":"运动终板","answer":"运动神经元轴突末梢与骨骼肌纤维形成的特化神经肌连接部位，是神经冲动传向骨骼肌的结构基础。","options":[],"note":null},{"id":"名词解释-26","type":"名词解释","number":26,"question":"肝小叶","answer":"肝脏的基本结构和功能单位，呈多角形棱柱状，主要由中央静脉、肝板、肝血窦、窦周隙和胆小管等组成。","options":[],"note":null},{"id":"名词解释-27","type":"名词解释","number":27,"question":"三联体","answer":"骨骼肌一条横小管及其两侧的终池共同组成的结构，参与兴奋-收缩耦联。","options":[],"note":null},{"id":"名词解释-28","type":"名词解释","number":28,"question":"小肠腺","answer":"位于小肠黏膜固有层、开口于肠腔的单管状腺，含吸收细胞、杯状细胞、潘氏细胞、干细胞和内分泌细胞等。","options":[],"note":null},{"id":"名词解释-29","type":"名词解释","number":29,"question":"周细胞","answer":"位于毛细血管和部分微静脉内皮外侧、通常被基膜包绕的细胞，具有支持、调节微血管功能及参与组织修复等作用。","options":[],"note":null},{"id":"名词解释-30","type":"名词解释","number":30,"question":"运动单位","answer":"一个运动神经元及其支配的全部骨骼肌纤维。","options":[],"note":null},{"id":"名词解释-31","type":"名词解释","number":31,"question":"致密斑","answer":"远端小管靠近肾小体血管极处的特殊上皮细胞群，可感受管液中NaCl浓度变化，参与球旁器调节。","options":[],"note":null},{"id":"名词解释-32","type":"名词解释","number":32,"question":"胰岛","answer":"胰腺内分泌部的细胞团，散在外分泌腺泡之间。A细胞分泌胰高血糖素，B细胞分泌胰岛素，D细胞分泌生长抑素，PP细胞分泌胰多肽等。","options":[],"note":null},{"id":"名词解释-33","type":"名词解释","number":33,"question":"软骨陷窝","answer":"软骨细胞在软骨基质中所占据的空间。","options":[],"note":null},{"id":"名词解释-34","type":"名词解释","number":34,"question":"淋巴小结","answer":"界限较明显、以B淋巴细胞为主的结节状淋巴组织，可分初级淋巴小结和具有生发中心的次级淋巴小结。","options":[],"note":null},{"id":"名词解释-35","type":"名词解释","number":35,"question":"小肠绒毛","answer":"小肠黏膜上皮及固有层向肠腔突起形成的细小结构，内含毛细血管和中央乳糜管等。","options":[],"note":null},{"id":"名词解释-36","type":"名词解释","number":36,"question":"胆小管","answer":"由相邻肝细胞膜局部凹陷形成的微细管道，在肝板内连接成网，收集肝细胞分泌的胆汁。","options":[],"note":null},{"id":"名词解释-37","type":"名词解释","number":37,"question":"血清","answer":"血液凝固后析出的液体，与血浆相比主要缺少纤维蛋白原及部分凝血过程中消耗的成分。","options":[],"note":null},{"id":"名词解释-38","type":"名词解释","number":38,"question":"淋巴细胞再循环","answer":"淋巴细胞在血液、淋巴及外周淋巴器官和淋巴组织之间不断循环迁移的现象。","options":[],"note":null},{"id":"名词解释-39","type":"名词解释","number":39,"question":"骨单位","answer":"即哈弗斯系统，由中央哈弗斯管和周围同心圆排列的骨板构成，是长骨骨密质的主要结构单位。","options":[],"note":null},{"id":"问答题-1","type":"问答题","number":1,"question":"试述中动脉的组织学结构。","answer":"中动脉管壁分内膜、中膜和外膜。内膜包括单层扁平内皮、内皮下层和明显的内弹性膜。中膜以多层环行平滑肌为主，约10～40层。外膜由结缔组织构成，含胶原纤维、弹性纤维，部分中动脉可见外弹性膜。","options":[],"note":null},{"id":"问答题-2","type":"问答题","number":2,"question":"试述淋巴结的组织学结构。","answer":"①被膜和小梁：表面有致密结缔组织被膜，伸入实质形成小梁。②皮质：浅层皮质含淋巴小结及弥散淋巴组织，以B细胞为主；副皮质区是胸腺依赖区，以T细胞为主，含高内皮微静脉；皮质淋巴窦包括被膜下窦和小梁周窦。③髓质：髓索含B细胞、浆细胞及巨噬细胞；髓窦与皮窦相通，参与滤过淋巴。","options":[],"note":null},{"id":"问答题-3","type":"问答题","number":3,"question":"试述睾丸的组织学结构。","answer":"①被膜：鞘膜脏层及致密结缔组织构成的白膜。②实质：睾丸小叶内有生精小管。③生精小管：由界膜和生精上皮组成；生精上皮含支持细胞和生精细胞。生精细胞依次为精原细胞、初级精母细胞、次级精母细胞、精子细胞和精子。④支持细胞：支持、营养生精细胞，分泌雄激素结合蛋白，吞噬残余胞质，并形成血睾屏障。⑤睾丸间质：含分泌雄激素的间质细胞。","options":[],"note":null},{"id":"问答题-4","type":"问答题","number":4,"question":"述长骨骨干的组织学结构。","answer":"①外环骨板：围绕骨干外表面排列。②内环骨板：围绕骨髓腔排列。③哈弗斯系统：中央为哈弗斯管，周围为同心圆排列的骨板。④间骨板：位于骨单位之间，为旧骨单位吸收改建后残留的骨板。骨干内面还可见骨内膜，外面覆骨膜。","options":[],"note":null},{"id":"问答题-5","type":"问答题","number":5,"question":"试述心室壁的组织学结构。","answer":"心室壁分为心内膜、心肌膜和心外膜。①心内膜：包括内皮、内皮下层及心内膜下层，心内膜下层可见蒲肯野纤维、小血管和神经。②心肌膜：主要由分支相连的心肌纤维构成，心肌细胞有闰盘，间有丰富毛细血管；心室肌较厚。③心外膜：为浆膜心包脏层，表面覆间皮，深面为含血管、神经及脂肪细胞的结缔组织。","options":[],"note":null},{"id":"问答题-6","type":"问答题","number":6,"question":"描述肝小叶的组织学结构。","answer":"①中央静脉：位于肝小叶中央，接受肝血窦汇入的血液。②肝板：由肝细胞排列形成，断面称肝索。③肝细胞：具有血窦面、胆小管面和细胞连接面。④肝血窦：位于肝板之间，血窦内有肝巨噬细胞。⑤窦周隙：位于血窦内皮和肝细胞之间，含肝星状细胞。⑥胆小管：由相邻肝细胞膜围成，胆汁流向小叶周边，方向与血流相反。","options":[],"note":null},{"id":"问答题-7","type":"问答题","number":7,"question":"试述肾小管的分段、结构和功能。","answer":"肾小管分近端小管、细段和远端小管。①近端小管：分曲部和直部，立方上皮，细胞嗜酸性强，游离面有刷状缘；重吸收几乎全部葡萄糖和氨基酸，以及大部分水、钠盐等。②细段：单层扁平上皮，参与水和盐的转运。③远端小管：分直部和曲部，立方上皮，刷状缘不明显，参与钠盐重吸收、钾和氢离子分泌及酸碱平衡调节。","options":[],"note":null},{"id":"问答题-8","type":"问答题","number":8,"question":"试述次级卵泡的形态结构。（8分）","answer":"次级卵泡含增大的初级卵母细胞、透明带、多层卵泡细胞及卵泡膜。卵泡细胞间出现卵泡液，逐渐融合形成卵泡腔。卵母细胞连同透明带、放射冠和周围卵泡细胞形成卵丘。卵泡腔周围细胞形成颗粒层。卵泡膜分内层和外层，内层有丰富血管和参与类固醇合成的细胞。","options":[],"note":null},{"id":"问答题-9","type":"问答题","number":9,"question":"试述小肠壁的形态结构。（10分）","answer":"小肠壁由黏膜、黏膜下层、肌层、外膜构成。①黏膜：上皮为单层柱状上皮，含吸收细胞、杯状细胞及内分泌细胞；固有层含小肠腺，绒毛内有毛细血管和中央乳糜管；黏膜肌层为薄层平滑肌。②黏膜下层：为结缔组织，十二指肠有十二指肠腺。③肌层：内环行、外纵行平滑肌。④外膜：浆膜或纤维膜。环形皱襞由黏膜和黏膜下层共同形成，绒毛由上皮和固有层形成。","options":[],"note":null},{"id":"问答题-10","type":"问答题","number":10,"question":"试述肺呼吸部的组织学结构。（10分）","answer":"肺呼吸部包括呼吸性细支气管、肺泡管、肺泡囊和肺泡。呼吸性细支气管壁出现肺泡开口；肺泡管壁几乎全部由肺泡开口组成；肺泡囊为数个肺泡共同开口形成的囊腔。肺泡上皮含Ⅰ型肺泡细胞（扁平，参与气体交换）和Ⅱ型肺泡细胞（分泌肺表面活性物质）。肺泡隔含丰富毛细血管、弹性纤维及其他结缔组织成分。气血屏障是气体交换的结构基础。肺巨噬细胞参与清除异物。","options":[],"note":null},{"id":"问答题-11","type":"问答题","number":11,"question":"简述疏松结缔组织的组织学结构。","answer":"疏松结缔组织由细胞和细胞外基质构成。①细胞：成纤维细胞、巨噬细胞、浆细胞、肥大细胞、脂肪细胞、未分化间充质细胞及游走细胞等。②纤维：胶原纤维、弹性纤维和网状纤维。③基质：含蛋白多糖、多黏糖、黏附性糖蛋白及组织液等。特点是细胞和基质较丰富，纤维排列疏松。","options":[],"note":null},{"id":"问答题-12","type":"问答题","number":12,"question":"试述氧气经过呼吸系统哪些结构到达毛细血管。","answer":"氧气经鼻腔、咽、喉、气管、支气管、小支气管、细支气管、终末细支气管、呼吸性细支气管、肺泡管和肺泡囊到达肺泡。随后穿过肺泡表面液体层、Ⅰ型肺泡细胞及基膜、薄层结缔组织、毛细血管基膜和内皮进入血液。气体交换主要通过扩散完成。","options":[],"note":null},{"id":"问答题-13","type":"问答题","number":13,"question":"简述心壁各层结构特点。","answer":"①心内膜：由内皮、内皮下层和心内膜下层组成，后者含小血管、神经，心室内可见蒲肯野纤维。②心肌膜：由心肌纤维构成，心肌细胞有分支和闰盘，心房肌较薄，心室肌较厚。③心外膜：为浆膜心包脏层，表面为间皮，深面为疏松结缔组织，含血管、神经及脂肪组织。","options":[],"note":null},{"id":"问答题-14","type":"问答题","number":14,"question":"试述肾上腺的组织学结构。","answer":"肾上腺表面为结缔组织被膜，实质分皮质和髓质。皮质由外向内为：①球状带，主要分泌盐皮质激素，如醛固酮；②束状带，主要分泌糖皮质激素，如皮质醇；③网状带，主要分泌肾上腺雄激素。髓质含嗜铬细胞，主要分泌肾上腺素和去甲肾上腺素。","options":[],"note":null},{"id":"问答题-15","type":"问答题","number":15,"question":"论述卵泡的发育与成熟。","answer":"①原始卵泡：初级卵母细胞周围为单层扁平卵泡细胞。②初级卵泡：卵母细胞增大，卵泡细胞变立方并增殖，出现透明带。③次级卵泡：出现卵泡腔、卵丘、颗粒层及卵泡膜。④成熟卵泡：卵泡腔扩大，排卵前初级卵母细胞完成第一次减数分裂，形成次级卵母细胞和第一极体。⑤排卵：次级卵母细胞连同透明带和放射冠排出；残余卵泡组织形成黄体。","options":[],"note":null},{"id":"问答题-16","type":"问答题","number":16,"question":"试述各类肌纤维的光镜结构。","answer":"①骨骼肌：长圆柱形，多核，细胞核位于周边，有明显横纹。②心肌：短柱状、有分支，通常1～2个核居中，有横纹和闰盘。③平滑肌：长梭形，单核居中，无横纹。三者在细胞形态、核的位置和数量、横纹及连接结构方面不同。","options":[],"note":null},{"id":"问答题-17","type":"问答题","number":17,"question":"试述脑垂体的组织学结构。","answer":"脑垂体分腺垂体和神经垂体。①腺垂体：由远侧部、中间部和结节部组成。远侧部有嗜酸性细胞（生长激素细胞、催乳激素细胞）、嗜碱性细胞（促甲状腺激素细胞、促肾上腺皮质激素细胞、促性腺激素细胞）及嫌色细胞。②神经垂体：主要包括神经部和漏斗，含来自下丘脑的无髓神经纤维、垂体细胞及丰富毛细血管，储存和释放下丘脑合成的催产素与抗利尿激素。","options":[],"note":null},{"id":"问答题-18","type":"问答题","number":18,"question":"试述腺垂体的组织学结构。","answer":"腺垂体由远侧部、中间部和结节部构成。远侧部含嗜酸性细胞（生长激素细胞和催乳激素细胞）、嗜碱性细胞（促甲状腺激素细胞、促肾上腺皮质激素细胞和促性腺激素细胞）及嫌色细胞。中间部可见滤泡及相关内分泌细胞。结节部包绕漏斗，含较多嫌色细胞和血管。","options":[],"note":null},{"id":"问答题-19","type":"问答题","number":19,"question":"试述结缔组织中细胞的种类、形态及功能。","answer":"以疏松结缔组织为例：①成纤维细胞：多突起，合成纤维和基质。②巨噬细胞：形态不规则，具有吞噬、抗原提呈和分泌功能。③浆细胞：核偏位、染色质呈车轮状，胞质嗜碱性，分泌抗体。④肥大细胞：含大量颗粒，释放组胺等介质，参与过敏反应。⑤脂肪细胞：储存脂质。⑥未分化间充质细胞：具有一定分化潜能，参与组织修复。","options":[],"note":null},{"id":"问答题-20","type":"问答题","number":20,"question":"试述胃壁的组织结构。","answer":"胃壁由黏膜、黏膜下层、肌层和外膜组成。黏膜上皮为单层柱状上皮，主要由表面黏液细胞组成；固有层含胃腺。胃底腺有主细胞（胃蛋白酶原）、壁细胞（盐酸和内因子）、颈黏液细胞、内分泌细胞和干细胞；幽门腺以黏液分泌为主，不是浆液腺。黏膜肌层为薄层平滑肌。黏膜下层为疏松结缔组织。肌层通常为内斜、中环、外纵三层，外膜为浆膜。","options":[],"note":null},{"id":"问答题-21","type":"问答题","number":21,"question":"试述肝脏的形态结构。","answer":"肝表面主要为结缔组织被膜，部分覆浆膜。实质主要由肝小叶和门管区构成。肝小叶包括中央静脉、肝板、肝血窦、窦周隙及胆小管。肝细胞有血窦面、胆小管面和细胞连接面。肝血窦内有肝巨噬细胞，窦周隙内有肝星状细胞。门管区含小叶间动脉、小叶间静脉和小叶间胆管。血液流向中央静脉，胆汁流向小叶周边。","options":[],"note":null},{"id":"问答题-22","type":"问答题","number":22,"question":"试述白细胞的分类及形态功能。","answer":"白细胞分有粒白细胞和无粒白细胞。有粒白细胞包括：①中性粒细胞，核常2～5叶，吞噬细菌；②嗜酸性粒细胞，核常两叶，参与抗寄生虫和调节过敏反应；③嗜碱性粒细胞，颗粒含组胺等介质，参与过敏反应。无粒白细胞包括：④淋巴细胞，参与免疫应答；⑤单核细胞，可分化为巨噬细胞等，具有吞噬和抗原提呈功能。","options":[],"note":null},{"id":"问答题-23","type":"问答题","number":23,"question":"试述肾脏的组织学结构。","answer":"肾表面有纤维被膜，实质分皮质和髓质。皮质含肾小体、近端小管曲部和远端小管曲部等；髓质含肾小管直部、细段及集合管等。肾单位由肾小体和肾小管组成。肾小体包括血管球和肾小囊，滤过屏障由有孔内皮、肾小球基膜和足细胞裂孔膜构成。近端小管重吸收大部分水盐及几乎全部葡萄糖、氨基酸；远端小管参与离子调节；集合管参与尿液浓缩。","options":[],"note":null},{"id":"问答题-24","type":"问答题","number":24,"question":"写出常见的神经末梢及其功能。","answer":"原文件答案误写为神经胶质细胞分类，现按题干更正。①游离神经末梢：感受痛觉、温度觉等。②触觉小体：感受精细触觉。③环层小体：感受深部压力和振动。④肌梭：感受肌肉长度变化，参与牵张反射。⑤运动终板：运动神经元与骨骼肌的连接，传递运动兴奋。另有腱器官，感受肌腱张力。","options":[],"note":null},{"id":"问答题-25","type":"问答题","number":25,"question":"试述脾的组织结构。","answer":"脾表面有结缔组织被膜，伸入实质形成小梁。实质分白髓、红髓和边缘区。①白髓：动脉周围淋巴鞘以T细胞为主，淋巴小结以B细胞为主。②红髓：由脾索和脾血窦组成，脾索含血细胞、淋巴细胞、浆细胞和巨噬细胞；脾血窦具有特殊杆状内皮。③边缘区：位于白髓和红髓之间，参与血液抗原的捕获及免疫应答。","options":[],"note":null},{"id":"问答题-26","type":"问答题","number":26,"question":"试述胃壁的组织学结构。","answer":"胃壁分黏膜、黏膜下层、肌层和外膜。①黏膜：单层柱状上皮、含胃腺的固有层及黏膜肌层。胃底腺主细胞分泌胃蛋白酶原，壁细胞分泌盐酸和内因子，颈黏液细胞分泌黏液。②黏膜下层：疏松结缔组织，含血管和神经。③肌层：内斜、中环、外纵三层平滑肌。④外膜：主要为浆膜。","options":[],"note":null},{"id":"问答题-27","type":"问答题","number":27,"question":"固有结缔组织的分类及特点","answer":"固有结缔组织主要包括：①疏松结缔组织：细胞种类多、基质较丰富、纤维排列疏松，广泛分布于器官间隙。②致密结缔组织：胶原纤维丰富，细胞及基质较少，具有较强抗拉能力，可分规则致密和不规则致密等。③脂肪组织：以脂肪细胞为主，具有储能、缓冲和保温等作用。④网状组织：由网状细胞、网状纤维及基质构成，为部分造血和淋巴器官提供支架。","options":[],"note":null},{"id":"问答题-28","type":"问答题","number":28,"question":"试述卵巢的组织学结构","options":[],"note":null,"answer":"参考解答：①表面：覆单层立方或扁平上皮，其下为致密结缔组织构成的白膜。②皮质：位于外周，由富含梭形间质细胞的结缔组织构成，含不同发育阶段的卵泡、闭锁卵泡、黄体和白体。卵泡发育依次经历原始、初级、次级、成熟卵泡。③髓质：位于中央，主要是疏松结缔组织，含丰富血管、淋巴管和神经，一般不含卵泡。卵巢的主要功能是生成卵细胞并分泌雌激素、孕激素等。"},{"id":"问答题-29","type":"问答题","number":29,"question":"试述肾小体的组织学结构","options":[],"note":null,"answer":"参考解答：肾小体由血管球和肾小囊组成。①血管球：入球微动脉进入肾小囊，形成有孔毛细血管袢，再汇成出球微动脉；毛细血管袢之间有球内系膜细胞及系膜基质。②肾小囊：由壁层和脏层组成，壁层为单层扁平上皮，脏层为足细胞，两层之间为肾小囊腔，与近端小管相通。③滤过屏障：由有孔内皮、肾小球基膜和足细胞裂孔膜构成，滤过血液形成原尿。"},{"id":"问答题-30","type":"问答题","number":30,"question":"试述生精小管的组织学结构和精子发生的过程","options":[],"note":null,"answer":"参考解答：①生精小管由界膜和生精上皮构成。界膜包括基膜、类肌细胞及结缔组织成分；生精上皮由支持细胞和生精细胞组成。②支持细胞具有支持、营养、吞噬和分泌雄激素结合蛋白等功能，其紧密连接参与血睾屏障形成。③生精细胞从基底部到近腔面依次可见精原细胞、初级精母细胞、次级精母细胞、精子细胞和精子。④精子发生经历精原细胞增殖、精母细胞减数分裂及精子形成三个阶段；精子形成时细胞核浓缩，高尔基复合体形成顶体，鞭毛形成，脱去多余胞质。"},{"id":"问答题-31","type":"问答题","number":31,"question":"试述肾单位的组织学结构","options":[],"note":null,"answer":"参考解答：肾单位由肾小体和肾小管组成。①肾小体：含血管球和肾小囊，血管球为有孔毛细血管袢，肾小囊脏层由足细胞构成；两者共同形成滤过结构。②肾小管：分近端小管、细段和远端小管。近端小管上皮嗜酸性强、刷状缘明显，主要重吸收葡萄糖、氨基酸、水和盐；细段为单层扁平上皮，参与水盐转运；远端小管为立方上皮，刷状缘不明显，参与离子及酸碱平衡调节。③近端小管直部、细段和远端小管直部共同构成髓袢。集合管参与尿液浓缩，但不属于肾单位。"},{"id":"填空题-1","type":"填空题","number":1,"question":"HE染色切片中，嗜酸性物质染成______色，嗜碱性物质染成______色。","options":[],"note":null,"answer":"红色或粉红色；蓝紫色。"},{"id":"填空题-2","type":"填空题","number":2,"question":"单层上皮可分为______、______、______和______。","options":[],"note":null,"answer":"单层扁平上皮；单层立方上皮；单层柱状上皮；假复层柱状上皮（常见为假复层纤毛柱状上皮）。"},{"id":"填空题-3","type":"填空题","number":3,"question":"结缔组织细胞外基质中的三种纤维是______、______和______。","options":[],"note":null,"answer":"胶原纤维；弹性纤维；网状纤维。"},{"id":"填空题-4","type":"填空题","number":4,"question":"中动脉内膜分为______、______和______三层。","options":[],"note":null,"answer":"内皮；内皮下层；内弹性膜。"},{"id":"填空题-5","type":"填空题","number":5,"question":"脑垂体远侧部嗜酸性细胞分泌______和______；嗜碱性细胞分泌______、______和______。","options":[],"note":null,"answer":"生长激素；催乳激素；促甲状腺激素；促肾上腺皮质激素；促性腺激素（包括促卵泡激素和黄体生成素）。"},{"id":"填空题-6","type":"填空题","number":6,"question":"胃底腺主细胞分泌______，经HCl激活后转变为______。","options":[],"note":null,"answer":"胃蛋白酶原；胃蛋白酶。"},{"id":"填空题-7","type":"填空题","number":7,"question":"淋巴组织以______为支架，网孔中含大量______及其他免疫细胞；可分为______和______两种形态。","options":[],"note":null,"answer":"网状组织；淋巴细胞；弥散淋巴组织；淋巴小结。"},{"id":"填空题-8","type":"填空题","number":8,"question":"肺导气部管径逐渐减小时，______、______、______逐渐减少甚至消失，______相对增多。","options":[],"note":null,"answer":"软骨；腺体；杯状细胞；平滑肌（在部分小支气管至细支气管阶段相对明显，终末细支气管也会变化）。"},{"id":"填空题-9","type":"填空题","number":9,"question":"结缔组织可分为______、______、______和______。","options":[],"note":null,"answer":"固有结缔组织；软骨组织；骨组织；血液与淋巴。"},{"id":"填空题-10","type":"填空题","number":10,"question":"神经元胞质中除一般细胞器外，还有______和______两种特殊结构。","options":[],"note":null,"answer":"尼氏体；神经原纤维。"},{"id":"填空题-11","type":"填空题","number":11,"question":"电镜下化学突触由______、______和______构成。","options":[],"note":null,"answer":"突触前成分；突触间隙；突触后成分。"},{"id":"填空题-12","type":"填空题","number":12,"question":"肺呼吸部包括______、______、______和______。","options":[],"note":null,"answer":"呼吸性细支气管；肺泡管；肺泡囊；肺泡。"},{"id":"填空题-13","type":"填空题","number":13,"question":"消化管壁一般由______、______、______和______四层构成。","options":[],"note":null,"answer":"黏膜；黏膜下层；肌层；外膜。"},{"id":"填空题-14","type":"填空题","number":14,"question":"毛细血管管壁主要由______和______构成，另有起支持作用的______。","options":[],"note":null,"answer":"内皮细胞；基膜；周细胞。"},{"id":"填空题-15","type":"填空题","number":15,"question":"胰岛主要由______细胞、______细胞、______细胞和______细胞组成。","options":[],"note":null,"answer":"A细胞；B细胞；D细胞；PP细胞。"},{"id":"填空题-16","type":"填空题","number":16,"question":"常见感觉神经末梢有______、______、______和______。","options":[],"note":null,"answer":"游离神经末梢；触觉小体；环层小体；肌梭。"},{"id":"填空题-17","type":"填空题","number":17,"question":"卵泡由中央的______和周围的______构成。","options":[],"note":null,"answer":"卵母细胞；卵泡细胞。"},{"id":"填空题-18","type":"填空题","number":18,"question":"骨组织的四种细胞是______、______、______和______。","options":[],"note":null,"answer":"骨祖细胞；成骨细胞；骨细胞；破骨细胞。"},{"id":"填空题-19","type":"填空题","number":19,"question":"光镜观察最常用的染色法是______染色，即使用______和______染料。","options":[],"note":null,"answer":"HE染色；苏木精；伊红。"},{"id":"填空题-20","type":"填空题","number":20,"question":"髓袢由______、______和______构成。","options":[],"note":null,"answer":"近端小管直部；细段；远端小管直部。"},{"id":"填空题-21","type":"填空题","number":21,"question":"神经元胞体和树突内强嗜碱性的结构称为______，电镜下由______和______构成，主要功能为______。","options":[],"note":null,"answer":"尼氏体；粗面内质网；游离核糖体；合成蛋白质。"},{"id":"填空题-22","type":"填空题","number":22,"question":"肾上腺皮质从外向内分______带、______带、______带，分别主要分泌______、______、______。","options":[],"note":null,"answer":"球状带；束状带；网状带；盐皮质激素；糖皮质激素；肾上腺雄激素。"},{"id":"填空题-23","type":"填空题","number":23,"question":"上皮细胞侧面的主要细胞连接有______、______、______和______。","options":[],"note":null,"answer":"紧密连接；中间连接；桥粒；缝隙连接。"},{"id":"填空题-24","type":"填空题","number":24,"question":"外分泌腺由______和______两部分构成；内分泌腺无______，分泌物可进入______。","options":[],"note":null,"answer":"分泌部；导管；导管；血液（或组织液后进入血液）。"},{"id":"填空题-25","type":"填空题","number":25,"question":"光镜下骨骼肌纤维呈______状，有明显的______，分为______带和______带。","options":[],"note":null,"answer":"长圆柱形；横纹；明带；暗带。"},{"id":"填空题-26","type":"填空题","number":26,"question":"按内皮细胞等结构特点，毛细血管分为______、______和______三类；肾小球中的是______毛细血管。","options":[],"note":null,"answer":"连续毛细血管；有孔毛细血管；血窦；有孔毛细血管。"},{"id":"填空题-27","type":"填空题","number":27,"question":"脾白髓由______和______构成，红髓由______和______构成。","options":[],"note":null,"answer":"动脉周围淋巴鞘；淋巴小结；脾索；脾血窦。"},{"id":"填空题-28","type":"填空题","number":28,"question":"肾上腺皮质从外向内分为______、______、______三带，其中主要分泌糖皮质激素的是______。","options":[],"note":null,"answer":"球状带；束状带；网状带；束状带。"},{"id":"填空题-29","type":"填空题","number":29,"question":"中动脉内膜分为______、______、______，中膜主要由______构成。","options":[],"note":null,"answer":"内皮；内皮下层；内弹性膜；环行平滑肌。"},{"id":"填空题-30","type":"填空题","number":30,"question":"肺导气部的结构包括______、______、______和______。","options":[],"note":null,"answer":"肺内支气管；小支气管；细支气管；终末细支气管。"}]</script>

const reviews = ['错题', '收藏'];
const collection = q => filter === '全部题目' || (filter === '错题' ? results[q.id]?.wrong : filter === '收藏' ? results[q.id]?.star : q.type === filter);
let queue = order.filter(id => collection(byId.get(id)));
document.querySelector('#total').textContent = '共 ' + bank.length + ' 题';

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text != null) element.textContent = text;
  if (className) element.className = className;
  return element;
}
function button(label, action, className) {
  const element = node('button', label, className);
  element.type = 'button';
  element.addEventListener('click', action);
  return element;
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({results, current})); }
  catch { storageFailed = true; }
}
function go(id, focus = false) {
  current = id;
  revealed = false;
  selected = '';
  save();
  render();
  if (focus) panel.querySelector('h1')?.focus();
}
function setFilter(value) {
  filter = value;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue.includes(current) ? current : queue[0], true);
}
function renderNav() {
  for (const [selector, labels] of [['#types', types], ['#review', reviews]]) {
    const nav = document.querySelector(selector);
    nav.replaceChildren();
    for (const label of labels) {
      const count = bank.filter(q => label === '全部题目' || q.type === label || (label === '错题' && results[q.id]?.wrong) || (label === '收藏' && results[q.id]?.star)).length;
      const control = button(label, () => setFilter(label));
      control.append(node('span', count));
      control.setAttribute('aria-current', String(label === filter));
      nav.append(control);
    }
  }
}
function record(q, changes) {
  results[q.id] = {...results[q.id], ...changes};
  save();
}
function update(focusId) {
  render();
  if (focusId) document.getElementById(focusId)?.focus();
}
function shuffle() {
  const shuffled = [...order];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  order = shuffled;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue[0], true);
}
function render() {
  renderNav();
  panel.replaceChildren();
  const q = byId.get(current);
  const index = queue.indexOf(current);
  if (!q || index < 0) {
    panel.append(node('h1', filter === '错题' ? '暂无错题' : '暂无收藏'));
    panel.append(button('返回全部题目', () => setFilter('全部题目'), 'primary'));
    return;
  }
  const meta = node('div', null, 'meta');
  const completed = queue.filter(id => results[id]?.done).length;
  meta.append(node('strong', q.type + ' · 第 ' + q.number + ' 题'), node('span', '当前 ' + (index + 1) + ' / ' + queue.length + ' · 已练 ' + completed));
  const progress = node('progress');
  progress.max = queue.length;
  progress.value = completed;
  progress.setAttribute('aria-label', '已练习题数');
  const title = node('h1', q.question);
  title.tabIndex = -1;
  panel.append(meta, progress, title);
  if (q.options.length) {
    const choices = node('div', null, 'choices');
    for (const [key, label] of q.options) {
      const control = button(label, () => {
        if (selected) return;
        selected = key;
        revealed = true;
        if (q.answer) record(q, {done:true, wrong:key !== q.answer});
        update('choice-' + key);
      });
      control.id = 'choice-' + key;
      if (selected) control.setAttribute('aria-disabled', 'true');
      if (revealed && key === q.answer) control.className = 'good';
      else if (revealed && key === selected && q.answer) control.className = 'bad';
      choices.append(control);
    }
    panel.append(choices);
  }
  const actions = node('div', null, 'actions');
  const toggle = button(revealed ? '收起答案' : '查看答案', () => {
    revealed = !revealed;
    update('answer-toggle');
  }, 'primary');
  toggle.id = 'answer-toggle';
  toggle.setAttribute('aria-expanded', String(revealed));
  toggle.setAttribute('aria-controls', 'answer');
  const star = button(results[q.id]?.star ? '取消收藏' : '收藏本题', () => {
    record(q, {star:!results[q.id]?.star});
    update('star');
  });
  star.id = 'star';
  actions.append(toggle, star);
  panel.append(actions);
  const answer = node('div', null, 'answer');
  answer.id = 'answer';
  answer.hidden = !revealed;
  answer.setAttribute('aria-live', 'polite');
  if (revealed) {
    const heading = selected && q.answer ? (selected === q.answer ? '答对了' : '答错了') : '参考答案';
    const answerText = q.options.find(([key]) => key === q.answer)?.[1] || q.reference || q.answer || '原表未提供答案';
    answer.append(node('strong', heading), node('div', answerText));
    if (q.note) answer.append(node('div', q.note));
  }
  panel.append(answer);
  if (revealed && !q.options.length && q.answer) {
    const assess = node('div', null, 'actions');
    for (const [label, wrong, id] of [['已掌握',false,'known'],['记为错题',true,'unknown']]) {
      const control = button(label, () => {record(q, {done:true, wrong}); update(id);});
      control.id = id;
      control.setAttribute('aria-pressed', String(results[q.id]?.done && results[q.id]?.wrong === wrong || false));
      assess.append(control);
    }
    if (results[q.id]?.done) assess.append(node('span', results[q.id].wrong ? '已加入错题' : '已标为掌握', 'quiet'));
    panel.append(assess);
  }
  const foot = node('div', null, 'foot');
  const previous = button('上一题', () => go(queue[index - 1], true));
  previous.disabled = index === 0;
  const next = button('下一题', () => go(queue[index + 1], true));
  next.disabled = index === queue.length - 1;
  const jump = node('select', null, 'jump');
  jump.setAttribute('aria-label', '跳到指定题目');
  queue.forEach((id, i) => {
    const item = byId.get(id);
    const option = node('option', '第 ' + (i + 1) + ' 题 · ' + item.type);
    option.value = id;
    jump.append(option);
  });
  jump.value = current;
  jump.addEventListener('change', () => go(jump.value, true));
  const paging = node('div', null, 'actions');
  paging.append(previous, jump, next);
  foot.append(paging, button('随机排序', shuffle));
  panel.append(foot);
  if (storageFailed) panel.append(node('p', '浏览器未允许本地存储，本次记录会在关闭后清除。', 'quiet'));
}
render();
</script>
</html>
