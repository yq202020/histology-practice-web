应。（    ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-48","type":"判断题","number":48,"question":"轴突、树突都不含尼氏体。（   ）","answer":"错","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-49","type":"判断题","number":49,"question":"T淋巴细胞不需抗原刺激就能杀伤某些肿瘤细胞和病毒感染细胞。（    ）","answer":"错","options":[["对","对"],["错","错"]],"note":"NK细胞"},{"id":"判断题-50","type":"判断题","number":50,"question":"破骨细胞是一种多核巨细胞，由多个浆细胞融合而成。（    ）","answer":"错","options":[["对","对"],["错","错"]],"note":"多个单核细胞"},{"id":"判断题-51","type":"判断题","number":51,"question":"成纤维细胞可合成三种纤维，所以常沿胶原纤维分布。 （   ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-52","type":"判断题","number":52,"question":"结缔组织细胞外基质中含有纤维。 （   ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-53","type":"判断题","number":53,"question":"肾上腺皮质球状带细胞分泌的醛固酮能促进肾远曲小管和集合管排出钠和重吸收钾。（  ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-54","type":"判断题","number":54,"question":"小肠绒毛是由小肠粘膜层和粘膜下层共同向肠腔突出所形成。（  ）","answer":"错","options":[["对","对"],["错","错"]],"note":"上皮与固有层"},{"id":"判断题-55","type":"判断题","number":55,"question":"脾的动脉周围淋巴淋巴鞘主要由B细胞构成。（    ）","answer":"错","options":[["对","对"],["错","错"]],"note":"T细胞"},{"id":"判断题-56","type":"判断题","number":56,"question":"暗带是骨骼肌纤维中完全由细肌丝构成的带。(    )","answer":"错","options":[["对","对"],["错","错"]],"note":null},{"id":"判断题-57","type":"判断题","number":57,"question":"破骨细胞是一种多核巨细胞，由多个单核细胞融合而成。（    ）","answer":"对","options":[["对","对"],["错","错"]],"note":null},{"id":"名词解释-1","type":"名词解释","number":1,"question":"肾小叶","answer":"每条髓放线（1分）及其周围的皮质迷路组成一个肾小叶（1分）。","options":[],"note":null},{"id":"名词解释-2","type":"名词解释","number":2,"question":"黄体","answer":"排卵后，卵泡颗粒层和卵泡膜向腔内塌陷（1分），卵泡膜的结缔组织和毛细血管伸入颗粒层，在LH的作用下逐渐演化成具有内分泌功能的黄色细胞团，称黄体（1分）。","options":[],"note":null},{"id":"名词解释-3","type":"名词解释","number":3,"question":"窦周隙","answer":"肝血窦和肝板之间的狭窄间隙，充满血浆，含贮脂细胞。","options":[],"note":null},{"id":"名词解释-4","type":"名词解释","number":4,"question":"突触","answer":"神经元与神经元之间（1分）或神经元与效应细胞之间的传递信息的结构部位（1分）。","options":[],"note":null},{"id":"名词解释-5","type":"名词解释","number":5,"question":"气血屏障","answer":"肺泡内气体和血液内气体进行交换所经过的结构，主要由肺泡表面液体层，I型肺泡细胞与基膜（1分）薄层结缔组织，毛细血管基膜和内皮组成（1分）。","options":[],"note":null},{"id":"名词解释-6","type":"名词解释","number":6,"question":"胚胎学","answer":"是研究自受精卵经过一系列分裂，分化（1分），最终形成新个体的全过程和生长发育的规律（1分）。","options":[],"note":null},{"id":"名词解释-7","type":"名词解释","number":7,"question":"滤过膜","answer":"包括毛细血管有孔内皮，内皮的基膜，足细胞裂孔膜（1.5分），可滤过血液形成原尿（0.5分）。","options":[],"note":null},{"id":"名词解释-8","type":"名词解释","number":8,"question":"肌节","answer":"相邻两条Z线之间的一段肌原纤维称为肌节（1分），由1/2 I带+A带+1/2 I带组成（1分）。","options":[],"note":null},{"id":"名词解释-9","type":"名词解释","number":9,"question":"骨板","answer":"胶原纤维密集排列成束，规则排列成层，层间互成一定角度或相互垂直（1.5分），骨盐平行排列于其间，黏蛋白起粘合作用，犹如多层木质胶合板，称骨板（1分）。","options":[],"note":null},{"id":"名词解释-10","type":"名词解释","number":10,"question":"胃底腺","answer":"位于固有层，主要由主细胞，壁细胞，颈粘液细胞，内分泌细胞和未分化细胞组成（1分），可分泌胃蛋白酶原，盐酸，内因子等（0.5分）。","options":[],"note":null},{"id":"名词解释-11","type":"名词解释","number":11,"question":"哈弗斯系统","answer":"由10-20层哈弗斯骨板呈同心圆状（1分）围绕中央的哈弗斯管（1分）组成。","options":[],"note":null},{"id":"名词解释-12","type":"名词解释","number":12,"question":"组织学","answer":"是研究正常人体微细结构（1分）及其相关功能（1分）的一门科学。","options":[],"note":null},{"id":"名词解释-13","type":"名词解释","number":13,"question":"血睾屏障","answer":"包括毛细血管内皮及其基膜，结缔组织（1分），生精上皮的界膜和支持细胞之间的紧密连接组成（1分）。","options":[],"note":null},{"id":"名词解释-14","type":"名词解释","number":14,"question":"神经纤维","answer":"由神经元的长突起（1分）和包在其外面的神经胶质细胞（1分）组成。","options":[],"note":null},{"id":"名词解释-15","type":"名词解释","number":15,"question":"肾小球旁器","answer":"位于肾小球血管极所形成的三角形区域，由球旁细胞（1分），致密斑和球外系膜细胞组成（1分）。","options":[],"note":null},{"id":"名词解释-16","type":"名词解释","number":16,"question":"肺小叶","answer":"每一条细支气管及其分支和肺泡称为一个肺小叶（2分）。","options":[],"note":null},{"id":"名词解释-17","type":"名词解释","number":17,"question":"血脑屏障","answer":"是介于血液和脑组织之间对物质通透有高度选择的屏障，由连续毛细血管内皮（1分），内皮细胞间紧密连接、基膜和周细胞以及星形胶质细胞脚板构成（1分）构成。","options":[],"note":null},{"id":"名词解释-18","type":"名词解释","number":18,"question":"胃表面粘液屏障","answer":"胃上皮表面覆盖一层厚厚的不溶性粘液凝胶（1分），含大量HCO3¯，可保护胃粘膜不受胃液侵蚀（1分）。","options":[],"note":null},{"id":"名词解释-19","type":"名词解释","number":19,"question":"尘细胞","answer":"肺巨噬细胞吞噬了大量吸入肺内的尘粒后，称为尘细胞（2分）。","options":[],"note":null},{"id":"名词解释-20","type":"名词解释","number":20,"question":"排卵","answer":"成熟卵泡破裂，次级卵母细胞（1分），透明带，放射冠随卵泡液一起排出，称为排卵（1分）。","options":[],"note":null},{"id":"名词解释-21","type":"名词解释","number":21,"question":"组织","answer":"由形态近似，功能相关，来源相同（1分）的细胞群和细胞外基质（1分）构成。","options":[],"note":null},{"id":"名词解释-22","type":"名词解释","number":22,"question":"间皮","answer":"分布在胸膜，腹膜，心包膜腔面（1分）的单层扁平上皮（1分）。","options":[],"note":null},{"id":"名词解释-23","type":"名词解释","number":23,"question":"同源细胞群","answer":"由一个软骨细胞分裂而来的（1分），多为2-8个聚集在一起的软骨细胞（1分）称同源细胞群。","options":[],"note":null},{"id":"名词解释-24","type":"名词解释","number":24,"question":"横纹","answer":"每一条骨骼肌纤维内的所有肌原纤维的明带和暗带都相应地排列在同一平面上（1分），构成了骨骼肌纤维交替的并与骨骼肌纤维长轴垂直的横纹（1分）。","options":[],"note":null},{"id":"名词解释-25","type":"名词解释","number":25,"question":"运动终板","answer":"运动神经元胞体发出的长轴突（1分），抵达骨骼肌时失去髓鞘，此区域呈椭圆形板状隆起，亦称神经肌连接（1分）。","options":[],"note":null},{"id":"名词解释-26","type":"名词解释","number":26,"question":"肝小叶","answer":"是肝结构和功能的基本单位，为多角形棱柱体（1分），每个肝小叶由中央静脉，肝板，肝血窦和胆小管组成（1分）。","options":[],"note":null},{"id":"名词解释-27","type":"名词解释","number":27,"question":"三联体","answer":"肌膜向肌浆内凹陷形成的管状结构称为横小管（1分），每条横小管与两侧的终池组成三联体（1分）。","options":[],"note":null},{"id":"名词解释-28","type":"名词解释","number":28,"question":"小肠腺","answer":"位于肠粘膜固有层，呈单管状，直接开口于肠腔（1分），含有肠上皮细胞，潘氏细胞和未分化细胞（1分）。","options":[],"note":null},{"id":"名词解释-29","type":"名词解释","number":29,"question":"周细胞","answer":"位于毛细血管内皮细胞和基膜之间，细胞扁长而有突起，纵向包围并衬托着毛细血管（1分），周细胞有机械支持作用和收缩功能，并可分化为内皮细胞或成纤维细胞，参与组织再生（1分）。","options":[],"note":null},{"id":"名词解释-30","type":"名词解释","number":30,"question":"运动单位","answer":"一个运动神经元的轴突（1分）及其分支所支配的全部骨骼肌纤维（1分）合称一个运动单位。","options":[],"note":null},{"id":"名词解释-31","type":"名词解释","number":31,"question":"致密斑","answer":"远曲小管近血管极一侧的细胞变为高柱状，形成一椭圆形斑，称致密斑（1分），它是一种离子感受器，可感受远曲小管内原尿钠离子浓度的变化（1分）。","options":[],"note":null},{"id":"名词解释-32","type":"名词解释","number":32,"question":"胰岛","answer":"胰腺的内分泌部分，是许多大小不等和形状不定的细胞团散布在胰岛各处形成的，胰岛产生的激素为胰岛素，可控制碳水化合物的代谢。","options":[],"note":null},{"id":"名词解释-33","type":"名词解释","number":33,"question":"软骨陷窝","answer":"软骨细胞在软骨基质内所占据的空间称软骨陷窝（2分）。","options":[],"note":null},{"id":"名词解释-34","type":"名词解释","number":34,"question":"淋巴小结","answer":"有较明显界限的淋巴组织，以网状组织为支架，网眼中含大量B细胞，滤泡树突状细胞，巨噬细胞等（1.5分），可分为初级淋巴小结和次级淋巴小结（0.5分）。","options":[],"note":null},{"id":"名词解释-35","type":"名词解释","number":35,"question":"小肠绒毛","answer":"小肠上皮层和固有层（1分）向肠腔内突起形成的细小突起叫小肠绒毛（1分）。","options":[],"note":null},{"id":"名词解释-36","type":"名词解释","number":36,"question":"胆小管","answer":"相邻肝细胞面的胞膜局部向内凹陷围成的微细管道（1分），在肝板内联结成网，可收集胆汁（1分）。","options":[],"note":null},{"id":"名词解释-37","type":"名词解释","number":37,"question":"血清","answer":"血浆除去纤维蛋白原后称血清。（2分）","options":[],"note":null},{"id":"名词解释-38","type":"名词解释","number":38,"question":"淋巴细胞再循环","answer":"外周淋巴器官和淋巴组织内的淋巴细胞可经淋巴管进入血流，循环全身，又可通过毛细血管后微静脉再返回淋巴器官或淋巴组织，周而复始，使淋巴细胞从一个淋巴器官到另一个淋巴器官，从一处淋巴组织到另一处淋巴组织，这种现象叫做淋巴细胞再循环（2分）。","options":[],"note":null},{"id":"名词解释-39","type":"名词解释","number":39,"question":"骨单位","answer":"即哈弗斯系统，由10-20层哈弗斯骨板呈同心圆状（1分）围绕中央的哈弗斯管（1分）形成。是长骨干起支持作用的主要结构单位。","options":[],"note":null},{"id":"问答题-1","type":"问答题","number":1,"question":"试述中动脉的组织学结构。","answer":"1、内膜:由内皮：单层扁平上皮；内皮下层：薄层细密结缔组织；内弹性膜：由弹性蛋白构成。（3分）中膜：10-40层环形平滑肌。（1分）外膜：外弹性膜；结缔组织膜  （2分）","options":[],"note":null},{"id":"问答题-2","type":"问答题","number":2,"question":"试述淋巴结的组织学结构。","answer":"被膜：薄层结缔组织，伸入实质形成小梁。（1分）皮质：浅层皮质含淋巴小结及其间的弥散淋巴组织；副皮质区有皮质深层的弥散淋巴组织；皮质淋巴窦  被膜下窦和小梁周窦，滤过淋巴的场所。（5分）髓质：髓索  含浆细胞、B细胞和巨噬细胞；髓窦与皮窦相通，可滤过淋巴。（4分）","options":[],"note":null},{"id":"问答题-3","type":"问答题","number":3,"question":"试述睾丸的组织学结构。","answer":"被膜：包括鞘膜脏层和白膜  （1分）睾丸间质：生精小管之间富含血管和淋巴管的疏松结缔组织。内有睾丸间质细胞，可分泌雄激素。（1分）生精小管：界膜-基膜、类肌细胞、成纤维细胞 ；（1分）生精上皮-复层扁平上皮，由生精上皮和支持细胞构成。（1分）支持细胞：不规则长锥形，侧面镶嵌着各级生精细胞，光镜下轮廓不清。可支持营养生精细胞。分泌液体，移动生精细胞。吞噬消化精子形成脱落的胞质。 分泌雄激素结合蛋白。参与形成血睾屏障。（3分）生精细胞:可产生精子。包括精原细胞、初级精母细胞（46，XY）、次级精母细胞（23，X或Y）、精子细胞（23，X或Y）、精子五个阶段。（3）","options":[],"note":null},{"id":"问答题-4","type":"问答题","number":4,"question":"述长骨骨干的组织学结构。","answer":"环骨板：包括内环骨板和外环骨板。内环骨板由厚薄不均的数层骨板围绕骨髓腔构成。      外环骨板较厚，由多层骨板围绕骨干外表面构成。（3分）哈弗斯系统：由中央的哈弗斯管和外周同心圆状排列的哈弗斯骨板构成。（3分）间骨板：残留的哈弗斯系统。（2分）","options":[],"note":null},{"id":"问答题-5","type":"问答题","number":5,"question":"试述心室壁的组织学结构。","answer":"心内膜:内皮-单层扁平上皮; 内皮下层-薄层细密结缔组织,内有少量平滑肌纤维。心内膜下层  疏松结缔组织，含小血管、神经，蒲肯野纤维。（4分）心肌膜: 心房肌：浅、深两层。有些心房肌纤维含心房特殊颗粒。心骨骼：致密结缔组织。为心房和心室的心肌附着处。心室肌：内纵、中环、外斜三层心肌。（3分）心外膜: 疏松结缔组织+间皮：覆盖于表面（2分）","options":[],"note":null},{"id":"问答题-6","type":"问答题","number":6,"question":"描述肝小叶的组织学结构。","answer":"中央静脉：单层扁平上皮围成，上有肝血窦开口。（1.5分）肝 板：肝细胞排列形成的凹凸不平的板状结构，断面称肝索。（1.5分）肝小叶：肝细胞：占肝内细胞总数80%，多面体，富含各种细胞器。有三种不同的面：血窦面、胆小管面、肝细胞临接面。（2分）肝血窦：位于肝板之间，腔大不规则。窦壁由内皮细胞围成，窦内有巨噬细胞。 血窦壁与肝板之间的狭小间隙为窦周隙，内有储脂细胞。（2分）胆小管：相邻肝细胞面的质膜向内凹陷形成。（2分）","options":[],"note":null},{"id":"问答题-7","type":"问答题","number":7,"question":"试述肾小管的分段、结构和功能。","answer":"近端小管：分曲部、直部，上皮细胞为锥体形或立方形，(1分)极强的重吸收功能。原尿中几乎全部葡萄糖、氨基酸和蛋白质以及大部分水.离子和尿素等均在此重吸收。分泌氨、肌酐等。 (3分) 细段：  单层扁平上皮，可通透水、盐离子。(2分) 远端小管：分曲部、直部，立方形上皮，参与浓缩尿液，重吸收水、钠，排钾、氨等。(2分)","options":[],"note":null},{"id":"问答题-8","type":"问答题","number":8,"question":"试述次级卵泡的形态结构。（8分）","answer":"次级卵泡由初级卵母细胞、卵泡细胞和卵泡膜组成。(1分)初级卵母细胞增大，卵泡细胞增多至6-12层，随后卵泡细胞之间形成卵泡腔,含卵泡液。(2分) 随着卵泡液增多，卵泡腔扩大，初级卵母细胞、透明带、放射冠及部分卵泡细胞突向卵泡腔，形成卵丘。(2分) 卵泡腔周围的数层卵泡细胞形成颗粒层(将雄激素转化为雌激素)。(1分)同时卵泡周边结缔组织形成卵泡膜，分化为内外两层：内层可合成雄激素，在颗粒细胞内转化为雄激素。(2分)","options":[],"note":null},{"id":"问答题-9","type":"问答题","number":9,"question":"试述小肠壁的形态结构。（10分）","answer":"粘膜: 单层柱状上皮-吸收细胞,可吸收营养物质;杯状细胞-位于吸收细胞之间，分泌粘液。内分泌细胞-分泌激素 (4分)。固有层：绒毛中轴-中央乳糜管，散在平滑肌；小肠腺：由吸收细胞、杯状细胞、内分泌细胞、潘氏细胞、干细胞组成。粘膜肌层-内环外纵两层平滑肌(3分)。粘膜下层-疏松结缔组织。十二指肠部含十二指肠腺。(1分) 肌层-内环外纵两层。(1分) 外膜层-浆膜(1分)","options":[],"note":null},{"id":"问答题-10","type":"问答题","number":10,"question":"试述肺呼吸部的组织学结构。（10分）","answer":"呼吸部包括：呼吸性细支气管：管壁不完整，出现肺泡开口，有换气功能。单层立方上皮，上皮下有少量平滑肌纤维。肺泡开口处，上皮移行为单层扁平上皮。(1.5分) 肺泡管：管壁结构少。表现为相邻肺泡之间的结节状膨大。上皮为单层立方或扁平上皮，下有少量结缔组织和平滑肌纤维。(1.5分)肺泡囊：由几个肺泡围成。(1分)肺泡：肺泡上皮：I型肺泡细胞：细胞扁平，表面较光滑，含核部分略厚，其他部分很薄，Ⅱ型肺泡细胞 细胞较小，圆形或立方形，散在嵌于Ⅰ型细胞之间。可分泌表面活性物质，稳定肺泡直径。Ⅱ型细胞还有分裂增殖并转化为Ⅰ型细胞的功能。(2分)肺泡隔：相邻肺泡之间的薄层结缔组织构成肺泡隔，弹性纤维较丰富，也有少量胶原纤维和网状纤维。含密集的连续毛细血管网。肺泡内气体与血液内气体分子交换所通过的结构称气血屏障。它由以下结构组成：肺泡表面液体层.Ⅰ型肺泡细胞与基膜.薄层结缔组织.毛细血管基膜与内皮。(2分)肺泡孔： 相邻肺泡之间有小孔相通 可均衡肺泡内气体的含量(1分)肺巨噬细胞:广泛分布在肺间质及肺泡腔内，有吞噬、免疫和分泌活性物质的功能。(1分)","options":[],"note":null},{"id":"问答题-11","type":"问答题","number":11,"question":"简述疏松结缔组织的组织学结构。","answer":"细胞外基质:基质-蛋白多糖、纤维粘连蛋白、组织液(1分); 纤维：胶原纤维、弹性纤维、网状纤维(2分) ;细胞：成纤维细胞、浆细胞、肥大细胞、巨噬细胞、未分化间充质细胞其他：脂肪细胞、少量血细胞(2分)","options":[],"note":null},{"id":"问答题-12","type":"问答题","number":12,"question":"试述氧气经过呼吸系统哪些结构到达毛细血管。","answer":"鼻腔、咽、喉、气管、支气管、小支气管、(1分)细支气管、终末细支气管、呼吸性细支气管、肺泡管、肺泡囊、肺泡、(2分)肺泡上皮、上皮基膜、薄层结缔组织、毛细血管内皮基膜、毛细血管内皮(2分)。","options":[],"note":null},{"id":"问答题-13","type":"问答题","number":13,"question":"简述心壁各层结构特点。","answer":"心内膜由内皮、内皮下层和心内膜下层构成。(1分)内皮为单层扁平上皮，薄而光滑，利于血液流动。内皮下层为细密结缔组织，内有少量平滑肌纤维。心内膜下层为疏松结缔组织，内含小血管和神经。(1分)心肌膜主要由心肌纤维组成。(1分)心肌纤维分层或集合成束，肌层或肌束间有数量不等的结缔组织和丰富的毛细血管。心房肌薄，而分为浅深两层。心房肌纤维短而细，无分支，部分心房肌纤维在电镜下可见到心房特殊颗粒。(1分)心室肌厚，可分为内纵、中环、外斜三层。心室肌纤维粗而长，有分支，呈螺旋状排列。(1分)心外膜为浆膜心包的脏层，其表面被覆一层间皮，深面为疏松结缔组织，内含血管、神经和脂肪细胞等(1分)。","options":[],"note":null},{"id":"问答题-14","type":"问答题","number":14,"question":"试述肾上腺的组织学结构。","answer":"被膜：疏松结缔组织(1分)。实质，皮质：球状带-细胞较小，锥体形或多边形，分泌盐皮质激素，调节水盐代谢。(2分) 束状带：细胞较大，多边形，脂滴多，分泌糖皮质激素，调节糖、蛋白质代谢，抗炎，抑制免疫应答。(2分) 网状带：细胞较小，脂褐素多，排成条索，吻合成网。分泌雄激素，少量雌激素和糖皮质激素。(2分) 髓质：髓质细胞（嗜铬细胞）：多边形，嗜碱性。(1分) 肾上腺素细胞-合成分泌肾上腺素，可使心率加快，心血管扩张；去甲肾上腺素细胞：合成分泌去甲肾上腺素。可使血压增高，血流加快。","options":[],"note":null},{"id":"问答题-15","type":"问答题","number":15,"question":"论述卵泡的发育与成熟。","answer":"（一）原始卵泡：初级卵母细胞 +卵泡细胞（一层，扁平）(2分)（二）生长卵泡：1、初级卵泡：初级卵母细胞-增大，细胞器丰富，有分泌功能。周边有透明带。卵泡细胞-多层立方形或柱状，形成放射冠 (2分)2、次级卵泡：初级卵母细胞增大；卵泡细胞6-12层，形成卵泡腔,含卵泡液。随着卵泡液增多，卵泡腔扩大，初级卵母细胞、透明带、放射冠及部分卵泡细胞突向卵泡腔，形成卵丘。 卵泡腔周围的数层卵泡细胞形成颗粒层（将雄激素转化为雌激素）卵泡周边结缔组织形成卵泡膜，分化为内外两层：内层可合成雄激素，在颗粒细胞内转化为雄激素。(2分) 3、成熟卵泡 ：卵前36-48小时，初级卵母细胞（46，X,Y）分裂形成次级卵母细胞(23，X或Y)和第一极体。卵泡液剧增。颗粒层变薄。(2分) 4、排卵：成熟卵泡破裂，透明带、放射冠随卵泡液从卵巢排出的过程称为排卵。排卵后，卵泡颗粒层和卵泡膜向腔内塌陷，卵泡膜的结缔组织和毛细血管也伸入颗粒层，在LH的作用下逐渐演化成具有内分泌功能的细胞团，色黄，称黄体。不能发育成熟的卵泡在发育的各个阶段停止生长并退化。(2分)","options":[],"note":null},{"id":"问答题-16","type":"问答题","number":16,"question":"试述各类肌纤维的光镜结构。","answer":"①平滑肌纤维：呈长梭形，核一个，为椭圆形或杆状。位于细胞中央。（1.5分）②骨骼肌纤维：呈长圆柱状，一条纤维具有100多个核，位于肌膜下。核呈卵圆形或杆状。富含肌原纤维，横纹明显。（2分）③心肌纤维：呈分支圆柱状，连接处形成闰盘，有较明显的横纹。核1-2个，圆形或卵圆形，位于细胞中央。（1.5分）","options":[],"note":null},{"id":"问答题-17","type":"问答题","number":17,"question":"试述脑垂体的组织学结构。","answer":"垂体包括腺垂体和神经垂体两部分。（1）腺垂体由远侧部、中间部和结节部构成。远侧部: 嗜酸性细胞-生长激素细胞→生长激素;催乳激素细胞→催乳激素。（2分)嗜碱性细胞、促甲状腺激素细胞→促甲状腺激素、促肾上腺皮质激素细胞→促肾上腺皮质激素、促性腺激素细胞→促性腺激素（3分）嫌色细胞（1分）中间部：嗜碱性细胞→黑素细胞刺激素（1分）结节部：以嫌色细胞为主（1分）（2）神经垂体：主要由无髓神经纤维和神经胶质细胞组成，含有丰富的窦状毛细血管。（1分）可贮存分泌下丘脑合成的抗利尿激素和催产素。（1分）","options":[],"note":null},{"id":"问答题-18","type":"问答题","number":18,"question":"试述腺垂体的组织学结构。","answer":"远侧部:生长激素细胞-生长激素;嗜酸性细胞:催乳激素细胞-催乳激素（2分）嗜碱性细胞:促甲状腺激素细胞-促甲状腺激素; 促肾上腺皮质激素细胞-促肾上腺皮质激素;促性腺激素细胞-促性腺激素（3分;嫌色细胞（1分）;中间部：嗜碱性细胞-黑素细胞刺激素（1分）结节部：以嫌色细胞为主（1分）","options":[],"note":null},{"id":"问答题-19","type":"问答题","number":19,"question":"试述结缔组织中细胞的种类、形态及功能。","answer":"①成纤维细胞：胞体大，扁平多突，胞质弱嗜碱性，核卵圆形，核仁明显。可合成三种纤维，形成基质（2分）②巨噬细胞:圆形或不规则形，核小、着色深，胞质丰富、嗜酸性。有变形运动能力和趋化性，可识别、粘附和吞噬异物，参与免疫应答，并具有分泌功能。（2分）③浆细胞：圆或卵圆形，核小、偏位，核染色质呈车轮状；胞质嗜碱性，近核侧有浅染区，可分泌免疫球蛋白(immunoglobulin, Ig)，参与体液免疫。（2分）④肥大细胞：圆或卵圆形，细胞核较小，卵圆形。胞质中充满粗大的嗜碱性颗粒，可引起过敏反应。（2分）此外，还有未分化间充质细胞和其他细胞。（1分）","options":[],"note":null},{"id":"问答题-20","type":"问答题","number":20,"question":"试述胃壁的组织结构。","answer":"粘膜：上皮-单层柱状上皮（表面粘液细胞和极少量内分泌细胞）（1分）固有层-细密的结缔组织，含大量胃腺：a贲门腺  粘液腺，可见少量壁细胞。b胃底腺  分颈、体、底三部，由主细胞（分泌胃蛋白酶原）、壁细胞（分泌盐酸、内因子）、颈粘液细胞、内分泌细胞组成。c幽门腺  浆液腺，可见大量内分泌细胞。（3分）粘膜肌层  内环外纵两层平滑肌（1分）粘膜下层 -疏松结缔组织。肌层-内斜中环外纵三层。外膜层-浆膜。（3分）","options":[],"note":null},{"id":"问答题-21","type":"问答题","number":21,"question":"试述肝脏的形态结构。","answer":"被膜：多为浆膜。（1分）2、实质：肝小叶是肝的基本结构单位，呈多角棱柱体，小叶之间以少量结缔组织分隔，分界不清。肝小叶周围的角缘处可见门管区。（1分）肝小叶中央有一条沿其长轴走行的中央静脉，中央静脉周围是大致呈放射状排列的肝细胞和肝血窦。肝小叶:中央静脉-单层扁平上皮围成，上有肝血窦开口。（1分）肝板：单层肝细胞排列形成的凹凸不平的板状结构，断面称肝索。肝细胞：占肝内细胞总数80%，多面体，富含各种细胞器。有三种不同的面：血窦面、胆小管面、肝细胞临接面。（2分）肝血窦：位于肝板之间，腔大不规则。窦壁由内皮细胞围成，窦内有巨噬细胞。血窦壁与肝板之间的狭小间隙为窦周隙，内有储脂细胞。（2分）胆小管：相邻肝细胞面的质膜向内凹陷形成。收集胆汁。（1分）门管区:肝小叶周围的角缘处，可见较多的结缔组织，其中含有小叶间静脉、小叶间动脉和小叶间胆管，称为门管区。（2分）","options":[],"note":null},{"id":"问答题-22","type":"问答题","number":22,"question":"试述白细胞的分类及形态功能。","answer":"白细胞分为有粒细胞和无粒细胞。（1分）有粒细胞包括：中性粒细胞：2-5叶分叶核，胞浆充满细小均匀的特殊颗粒和嗜天青颗粒。有吞噬防御功能。嗜碱粒细胞：核分叶或马蹄形或不规则，胞浆内含有大小不等分布不均的嗜碱颗粒。可抗过敏、抗寄生虫。嗜酸粒细胞：两叶核，胞质内充满粗大、均匀的嗜酸性颗粒。参与过敏反应。（4分）无粒细胞包括：单核细胞：核肾形、马蹄形或不规则，胞质灰蓝色，内含大量细小嗜天青颗粒。进入结缔组织分化为巨噬细胞。有吞噬、免疫功能。淋巴细胞 ：核圆形或肾形，紫蓝色，胞质量少，蔚蓝色。有免疫功能。（3分）","options":[],"note":null},{"id":"问答题-23","type":"问答题","number":23,"question":"试述肾脏的组织学结构。","answer":"被膜： 纤维膜，致密结缔组织（1分），肾间质: 泌尿小管间的少量结缔组织。间质细胞可分泌前列腺素。（0.5分）肾实质：血管球：入球微动脉有孔毛细血管、出球微动脉；肾小体-球内系膜: 主要由系膜细胞和系膜基质组成（2分），肾小囊: 壁层:单层扁平上皮；脏层: 足细胞（1分）滤过膜: 有孔内皮+毛细血管基膜+足细胞裂孔膜滤过血液形成原尿。（180升/天）（2分），近端小管: 分曲部、直部，上皮细胞为锥体形或立方形 极强的重吸收功能。原尿中几乎全部葡萄糖、氨 基酸和蛋白质以及大部分水、离子和尿素等均在此重吸收。分泌氨、肌酐等。（2分）细段: 单层扁平上皮，可通透水、盐离子。（1分）远端小管: 分曲部、直部，立方形上皮，参与浓缩尿液，重吸收水、钠，排钾、氨等。（1分）集合管系: 弓形集合小管、直集合小管、乳头管。浓缩尿液。终尿1-2升。（0.5分）","options":[],"note":null},{"id":"问答题-24","type":"问答题","number":24,"question":"写出常见的神经末梢及其功能。","answer":"中枢神经系统的神经胶质细胞包括四种：①星形胶质细胞：包括纤维性星形胶质细胞、原浆性星形胶质细胞。纤维性星形胶质细胞多分布在白质，突起细长，分支较少，胞质内含大量胶质丝。原浆性星形胶质细胞多分布在灰质，突起较短粗，分支较多，胞质内胶质丝较少，星形胶质细胞的突起伸展充填在神经元胞体及其突起之间，起支持和绝缘的作用。有些突起末端形成脚板，附在毛细血管壁上构成血-脑屏障，或附着在脑和脊髓表面形成胶质界膜。(3分)②少突胶质细胞  突起较少，胞体较小，核圆，染色较深。 参与形成中枢神经系统的髓鞘。（2分）③小胶质细胞：胞体最小，细长或椭圆，核小，扁平或三角形，染色深。细胞的突起细长有分支，表面有许多小棘突。源于血中单核细胞，可转变为巨噬细胞，有吞噬功能（2分）④室管膜细胞：为立方或柱形，表面有许多微绒毛，有些细胞表面有纤毛。衬在脑室和脊髓中央管的腔面，为单层立方或柱状上皮，可产生脑脊液。（1分）","options":[],"note":null},{"id":"问答题-25","type":"问答题","number":25,"question":"试述脾的组织结构。","answer":"被膜较厚，表面覆以间皮。被膜结缔组织伸入脾内形成小梁。（1分）实质:（1）白髓：动脉周围淋巴鞘，包绕在中央动脉周围的弥散淋巴组织。由大量T细胞和少量巨噬细胞与交错突细胞等构成。淋巴小结-称脾小体：主要由大量B细胞构成。(2)边缘区-淋巴细胞由血液进入淋巴组织的通道。边缘窦-中央动脉侧支分支而成的一些毛细血管的末端在白髓和边缘区之间膨大形成的小血窦。（4分）（3）红髓：脾索-富含血细胞的淋巴组织，含大量巨噬细胞，是滤过血液的场所，含笔毛微动脉，其终末毛细血管可直接开口于脾索或脾血窦；脾窦-由长杆状内皮、不完整的基膜及环形网状纤维构成。（3分）","options":[],"note":null},{"id":"问答题-26","type":"问答题","number":26,"question":"试述胃壁的组织学结构。","answer":"胃壁可分为粘膜层、粘膜下层、肌层、外膜层。粘膜：（1）上皮：单层柱状上皮（表面粘液细胞和极少量内分泌细胞）（1分）（2）固有层：细密的结缔组织，含大量胃腺：a贲门腺-粘液腺，可见少量壁细胞。b胃底腺-分颈、体、底三部，由主细胞（分泌胃蛋白酶原）、壁细胞（分泌盐酸、内因子）、颈粘液细胞、内分泌细胞组成。c幽门腺-浆液腺，可见大量内分泌细胞。（3分）（3）粘膜肌层：内环外纵两层平滑肌（1分）粘膜下层：疏松结缔组织（1分）。肌层：内斜中环外纵三层。（1分）外膜：浆膜。（1分）","options":[],"note":null},{"id":"问答题-27","type":"问答题","number":27,"question":"固有结缔组织的分类及特点","answer":"","options":[],"note":null}]</script>
<script>
'use strict';
const bank = JSON.parse(document.querySelector('#bank').textContent);
const byId = new Map(bank.map(q => [q.id, q]));
const storageKey = 'histology-quiz-v1';
let saved;
try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; } catch { saved = {}; }
const results = saved.results || {};
let filter = '全部题目';
let order = bank.map(q => q.id);
let current = byId.has(saved.current) ? saved.current : order[0];
let revealed = false;
let selected = '';
let storageFailed = false;
const panel = document.querySelector('#panel');
const types = ['全部题目', '单选题', '判断题', '名词解释', '问答题'];
const reviews = ['错题', '收藏'];
const collection = q => filter === '全部题目' || (filter === '错题' ? results[q.id]?.wrong : filter === '收藏' ? results[q.id]?.star : q.type === filter);
let queue = order.filter(id => collection(byId.get(id)));
document.querySelector('#total').textContent = '共 ' + bank.length + ' 题';

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text != null) element.textContent = text;
  if (className) element.className = className;
  return element;
}
function button(label, action, className) {
  const element = node('button', label, className);
  element.type = 'button';
  element.addEventListener('click', action);
  return element;
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({results, current})); }
  catch { storageFailed = true; }
}
function go(id, focus = false) {
  current = id;
  revealed = false;
  selected = '';
  save();
  render();
  if (focus) panel.querySelector('h1')?.focus();
}
function setFilter(value) {
  filter = value;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue.includes(current) ? current : queue[0], true);
}
function renderNav() {
  for (const [selector, labels] of [['#types', types], ['#review', reviews]]) {
    const nav = document.querySelector(selector);
    nav.replaceChildren();
    for (const label of labels) {
      const count = bank.filter(q => label === '全部题目' || q.type === label || (label === '错题' && results[q.id]?.wrong) || (label === '收藏' && results[q.id]?.star)).length;
      const control = button(label, () => setFilter(label));
      control.append(node('span', count));
      control.setAttribute('aria-current', String(label === filter));
      nav.append(control);
    }
  }
}
function record(q, changes) {
  results[q.id] = {...results[q.id], ...changes};
  save();
}
function update(focusId) {
  render();
  if (focusId) document.getElementById(focusId)?.focus();
}
function shuffle() {
  const shuffled = [...order];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  order = shuffled;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue[0], true);
}
function render() {
  renderNav();
  panel.replaceChildren();
  const q = byId.get(current);
  const index = queue.indexOf(current);
  if (!q || index < 0) {
    panel.append(node('h1', filter === '错题' ? '暂无错题' : '暂无收藏'));
    panel.append(button('返回全部题目', () => setFilter('全部题目'), 'primary'));
    return;
  }
  const meta = node('div', null, 'meta');
  const completed = queue.filter(id => results[id]?.done).length;
  meta.append(node('strong', q.type + ' · 第 ' + q.number + ' 题'), node('span', '当前 ' + (index + 1) + ' / ' + queue.length + ' · 已练 ' + completed));
  const progress = node('progress');
  progress.max = queue.length;
  progress.value = completed;
  progress.setAttribute('aria-label', '已练习题数');
  const title = node('h1', q.question);
  title.tabIndex = -1;
  panel.append(meta, progress, title);
  if (q.options.length) {
    const choices = node('div', null, 'choices');
    for (const [key, label] of q.options) {
      const control = button(label, () => {
        if (selected) return;
        selected = key;
        revealed = true;
        if (q.answer) record(q, {done:true, wrong:key !== q.answer});
        update('choice-' + key);
      });
      control.id = 'choice-' + key;
      if (selected) control.setAttribute('aria-disabled', 'true');
      if (revealed && key === q.answer) control.className = 'good';
      else if (revealed && key === selected && q.answer) control.className = 'bad';
      choices.append(control);
    }
    panel.append(choices);
  }
  const actions = node('div', null, 'actions');
  const toggle = button(revealed ? '收起答案' : '查看答案', () => {
    revealed = !revealed;
    update('answer-toggle');
  }, 'primary');
  toggle.id = 'answer-toggle';
  toggle.setAttribute('aria-expanded', String(revealed));
  toggle.setAttribute('aria-controls', 'answer');
  const star = button(results[q.id]?.star ? '取消收藏' : '收藏本题', () => {
    record(q, {star:!results[q.id]?.star});
    update('star');
  });
  star.id = 'star';
  actions.append(toggle, star);
  panel.append(actions);
  const answer = node('div', null, 'answer');
  answer.id = 'answer';
  answer.hidden = !revealed;
  answer.setAttribute('aria-live', 'polite');
  if (revealed) {
    const heading = selected && q.answer ? (selected === q.answer ? '答对了' : '答错了') : '参考答案';
    const answerText = q.options.find(([key]) => key === q.answer)?.[1] || q.answer || '原表未提供答案';
    answer.append(node('strong', heading), node('div', answerText));
    if (q.note) answer.append(node('div', q.note));
  }
  panel.append(answer);
  if (revealed && !q.options.length && q.answer) {
    const assess = node('div', null, 'actions');
    for (const [label, wrong, id] of [['已掌握',false,'known'],['记为错题',true,'unknown']]) {
      const control = button(label, () => {record(q, {done:true, wrong}); update(id);});
      control.id = id;
      control.setAttribute('aria-pressed', String(results[q.id]?.done && results[q.id]?.wrong === wrong || false));
      assess.append(control);
    }
    if (results[q.id]?.done) assess.append(node('span', results[q.id].wrong ? '已加入错题' : '已标为掌握', 'quiet'));
    panel.append(assess);
  }
  const foot = node('div', null, 'foot');
  const previous = button('上一题', () => go(queue[index - 1], true));
  previous.disabled = index === 0;
  const next = button('下一题', () => go(queue[index + 1], true));
  next.disabled = index === queue.length - 1;
  const jump = node('select', null, 'jump');
  jump.setAttribute('aria-label', '跳到指定题目');
  queue.forEach((id, i) => {
    const item = byId.get(id);
    const option = node('option', '第 ' + (i + 1) + ' 题 · ' + item.type);
    option.value = id;
    jump.append(option);
  });
  jump.value = current;
  jump.addEventListener('change', () => go(jump.value, true));
  const paging = node('div', null, 'actions');
  paging.append(previous, jump, next);
  foot.append(paging, button('随机排序', shuffle));
  panel.append(foot);
  if (storageFailed) panel.append(node('p', '浏览器未允许本地存储，本次记录会在关闭后清除。', 'quiet'));
}
render();
</script>
</html>
