<style>

body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.65 "Source Sans 3","PingFang SC","Microsoft YaHei",sans-serif}

button,.jump{font:inherit;color:inherit;background:var(--white);border:1px solid var(--line);border-radius:4px;padding:8px 13px;min-height:42px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}

nav button{display:flex;justify-content:space-between;align-items:center;border-color:transparent;background:transparent;text-align:left;gap:9px}

.chapter{width:100%;margin-bottom:10px}
.panel{background:var(--white);border:1px solid var(--line);padding:27px 30px;min-width:0}
.meta,.foot,.actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.meta{color:var(--muted);font-size:14px}
.meta strong{font-weight:600;color:var(--accent)}
progress{width:100%;height:4px;display:block;margin:13px 0 24px;accent-color:var(--accent)}
h1{font:700 clamp(22px,3vw,30px)/1.5 "Songti SC","Noto Serif CJK SC","SimSun",serif;margin:0 0 19px;overflow-wrap:anywhere}
.choices{display:grid;gap:7px;margin-bottom:18px}
.choices button{text-align:left;min-height:46px;padding:9px 13px}
.choices button.good{background:var(--soft);border-color:var(--accent)}
.choices button.bad{background:#f7e8e1;color:var(--red);border-color:var(--red)}
.choices button[aria-disabled=true]{cursor:default}
.answer{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:13px 15px;border-left:2px solid var(--accent);margin:14px 0}
.answer strong{display:block;margin-bottom:4px}
.answer .quiet{margin-top:8px}
.foot{border-top:1px solid var(--line);margin-top:23px;padding-top:14px}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.actions{justify-content:flex-start}
.jump{max-width:100%;padding:6px 8px}
.review-head{margin-bottom:13px}
.review-head h1{margin-bottom:2px}
.review-list{list-style:none;padding:0;margin:18px 0 0;border-top:1px solid var(--line)}
.review-list li{border-bottom:1px solid var(--line)}
.review-list button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:13px 5px;overflow-wrap:anywhere}
.review-list button:hover{background:var(--soft)}
.review-list .quiet{display:block;margin-bottom:3px}
@media(max-width:680px){
  .head{padding:14px 16px}
  .brand strong{font-size:20px}
  main{margin:15px auto;padding:0 12px;display:block}
  aside h2{display:none}
  nav,.tools{display:flex;flex-wrap:wrap;gap:3px}
  nav button{font-size:14px;padding:5px 9px;gap:5px;min-height:38px}
  .tools{margin:6px 0 12px;padding-top:4px}
  .panel{padding:16px 14px}
  .foot,.actions{gap:6px}
}
</style>

免疫球蛋白"],["D","D．白喉类毒素"]],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 单选 4"},{"id":"eabb1bf7df088998","type":"单选题","number":260,"question":"根据有效免疫原的氨基酸序列，设计合成的免疫原性多肽称为（）","answer":"A","options":[["A","A．合成肽疫苗"],["B","B．结合疫苗"],["C","C．亚单位疫苗"],["D","D．重组抗原疫苗"]],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 单选 5"},{"id":"76997af9f8a3e10b","type":"单选题","number":261,"question":"提取病原体中有效免疫原成分制成的疫苗称为（）","answer":"D","options":[["A","A．灭活疫苗"],["B","B．合成肽疫苗"],["C","C．结合疫苗"],["D","D．亚单位疫苗"]],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 单选 6"},{"id":"5bfaa19465e08470","type":"单选题","number":262,"question":"由编码病原体有效免疫原的基因与细菌质粒构建形成的重组体称为（）","answer":"D","options":[["A","A．结合疫苗"],["B","B．亚单位疫苗"],["C","C．重组载体疫苗"],["D","D．DNA疫苗"]],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 单选 7"},{"id":"bcb0df48a272ec7e","type":"单选题","number":263,"question":"免疫抑制剂不宜用于（）","answer":"C","options":[["A","A．超敏反应病"],["B","B．自身免疫病"],["C","C．感染"],["D","D．炎症"]],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 单选 8"},{"id":"35a8e99fe02c145b","type":"填空题","number":1,"question":"免疫系统的三大功能是______、______、______。","answer":"免疫防御、免疫自稳、免疫监视（顺序可互换）。","options":[],"chapter":"免疫学概论","source":"医学免疫学-复习题 (1).doc · 第一章 · 填空 1"},{"id":"1093cd8915f010be","type":"填空题","number":2,"question":"免疫应答包括______免疫应答和______免疫应答。其中前者又称为非特异性免疫应答，后者又称为特异性免疫应答或获得性免疫应答。","answer":"固有免疫应答、适应性免疫应答","options":[],"chapter":"免疫学概论","source":"医学免疫学-复习题 (1).doc · 第一章 · 填空 2"},{"id":"aeb56b4668d1339d","type":"填空题","number":3,"question":"机体遭遇病原微生物感染时首先产生的是_____免疫应答，但最终在清除病原体时起主导作用的是______免疫应答。","answer":"固有、适应性","options":[],"chapter":"免疫学概论","source":"医学免疫学-复习题 (1).doc · 第一章 · 填空 3"},{"id":"0eed9696f98ee93b","type":"填空题","number":4,"question":"T细胞和B细胞分别靠其表面的______和______识别抗原分子，并且一个T或B细胞只能识别______种抗原分子。","answer":"TCR、BCR、一种","options":[],"chapter":"免疫学概论","source":"医学免疫学-复习题 (1).doc · 第一章 · 填空 4"},{"id":"2684e429c3afdcdd","type":"填空题","number":5,"question":"B细胞经过抗原刺激，分化为______，通过分泌______执行免疫功能，因此由B细胞介导的免疫称为______免疫。T细胞经抗原刺激成为效应细胞而发挥免疫效应，所以由T细胞介导的免疫称为______免疫。","answer":"浆细胞、抗体、体液、细胞","options":[],"chapter":"免疫学概论","source":"医学免疫学-复习题 (1).doc · 第一章 · 填空 5"},{"id":"9fba7f448cd5ec6d","type":"填空题","number":6,"question":"B细胞成熟的部位是______，T细胞成熟的部位是______。","answer":"骨髓、胸腺","options":[],"chapter":"免疫学概论","source":"医学免疫学-复习题 (1).doc · 第一章 · 填空 6"},{"id":"95ceff9493d6917e","type":"填空题","number":7,"question":"单核细胞随血液循环至组织中定位并分化成熟，成为______。","answer":"巨噬细胞","options":[],"chapter":"免疫学概论","source":"医学免疫学-复习题 (1).doc · 第一章 · 填空 8"},{"id":"fd1c43b8f5c6043c","type":"名词解释","number":1,"question":"免疫","answer":"免疫是机体免疫系统识别自身物质与非己物质，对自身物质形成免疫耐受，对非己物质产生消灭排除作用，以维持机体内环境稳定的一种生理功能。","options":[],"chapter":"免疫学概论","source":"医学免疫学-人卫版题库 (1).doc · 免疫学概论 · 名词解释 1"},{"id":"9ccf822cd896c814","type":"名词解释","number":2,"question":"PAMP","answer":"即病原相关模式分子，是一大组或几大组病原生物所共有的非特异性、高度保守的分子结构，也包括宿主凋亡细胞表面某些共有特定结构的分子，可被机体固有免疫系统所识别。","options":[],"chapter":"免疫学概论","source":"医学免疫学-人卫版题库 (1).doc · 免疫学概论 · 名词解释 2"},{"id":"3d9bfcba7dac2336","type":"名词解释","number":3,"question":"PRR","answer":"即模式识别受体，是指存在于固有免疫细胞表面、胞内器室膜上和血清中的一类能够直接识别病原体及其产物或宿主凋亡细胞、衰老细胞表面某些共有的特定分子结构的受体。","options":[],"chapter":"免疫学概论","source":"医学免疫学-人卫版题库 (1).doc · 免疫学概论 · 名词解释 3"},{"id":"dd95c91247338b0b","type":"名词解释","number":4,"question":"淋巴细胞归巢","answer":"指血液中的淋巴细胞选择性趋向迁移并定居于外周免疫器官或组织的特定区域或特定组织的过程。","options":[],"chapter":"免疫器官和组织","source":"医学免疫学-人卫版题库 (1).doc · 免疫器官和组织 · 名词解释 1"},{"id":"905a736299484eb4","type":"名词解释","number":5,"question":"淋巴细胞再循环","answer":"定居于外周免疫器官的淋巴细胞在血液、淋巴液、淋巴器官或组织间反复循环的过程。","options":[],"chapter":"免疫器官和组织","source":"医学免疫学-人卫版题库 (1).doc · 免疫器官和组织 · 名词解释 2"},{"id":"529d98f853697ce1","type":"名词解释","number":6,"question":"抗原","answer":"指能与TCR或BCR结合，诱导T细胞、B细胞产生免疫应答；并能与免疫应答产物（抗体或效应T细胞）之发生特异性结合反应的物质。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 1"},{"id":"e9f89fb503a3369e","type":"名词解释","number":7,"question":"完全抗原","answer":"是指具有免疫原性和抗原性/免疫反应性的物质。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 2"},{"id":"6fbfa13a738f00d5","type":"名词解释","number":8,"question":"半抗原/不完全抗原","answer":"指只具有抗原性/免疫反应性而无免疫原性的物质。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 3"},{"id":"57d28b990a47bdee","type":"名词解释","number":9,"question":"表位/抗原决定基","answer":"是指抗原分子中决定抗原特异性的化学基团，是与TCR / BCR及抗体特异性结合的基本结构单位。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 4"},{"id":"57b35b13dc07309a","type":"名词解释","number":10,"question":"载体效应","answer":"再次免疫时，半抗原只有结合在与初次免疫相同的载体上，才能产生针对半抗原的再次应答反应。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 5"},{"id":"1216a1c0172e045a","type":"名词解释","number":11,"question":"交叉反应","answer":"指抗体或效应T细胞对具有相同或相似表位的不同抗原发生的结合反应。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 6"},{"id":"17e3c709de842c23","type":"名词解释","number":12,"question":"TD-Ag","answer":"即胸腺依赖性抗原，是指在刺激B细胞产生抗体时需要T细胞辅助的抗原。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 7"},{"id":"073e019bc666a484","type":"名词解释","number":13,"question":"TI-Ag","answer":"即非胸腺依赖性抗原，此类抗原刺激B细胞产生抗体时不需要T细胞的辅助。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 8"},{"id":"7a3ee45d5d4e28ce","type":"名词解释","number":14,"question":"异嗜性抗原","answer":"存在于人、动物和微生物等不同种属之间的共同抗原。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 9"},{"id":"5383fb2017acce76","type":"名词解释","number":15,"question":"超抗原","answer":"指只需极低浓度即可激活大量T细胞克隆，产生极强的免疫应答的物质。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 10"},{"id":"b27c7f00f7607af0","type":"名词解释","number":16,"question":"佐剂","answer":"指预先或同抗原一起注入体内，可增强机体对该抗原的免疫应答或改变免疫应答类型的非特异性免疫增强性物质。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 名词解释 11"},{"id":"e342be94556fd83b","type":"名词解释","number":17,"question":"抗体","answer":"是B细胞接受抗原刺激后增殖分化为浆细胞，由浆细胞产生的一类能与相应抗原特异性结合的球蛋白，具有免疫功能。","options":[],"chapter":"抗体","source":"医学免疫学-人卫版题库 (1).doc · 抗体 · 名词解释 1"},{"id":"cdd29bc6f8d12c1a","type":"名词解释","number":18,"question":"Ig","answer":"即免疫球蛋白，指具有抗体活性或化学结构与抗体相似的球蛋白。","options":[],"chapter":"抗体","source":"医学免疫学-人卫版题库 (1).doc · 抗体 · 名词解释 2"},{"id":"86b016f1d2813f9b","type":"名词解释","number":19,"question":"CDR","answer":"在Ig的V区中，H链和L链各有3个区域的氨基酸组成和排列高度可变，称为高变区（HVR），这些高变区共同组成抗体分子的抗原结合部位，形成一个与抗原表位互补的空间构象，故又称为互补决定区（complementarity-determining region，CDR）。","options":[],"chapter":"抗体","source":"医学免疫学-人卫版题库 (1).doc · 抗体 · 名词解释 3"},{"id":"aa6b33af37a72f11","type":"名词解释","number":20,"question":"独特型（Id）","answer":"不同的B细胞克隆产生的抗体分子，因其V区中CDR区的氨基酸序列不同，具有独特的抗原特异性，称为抗体的独特型。","options":[],"chapter":"抗体","source":"医学免疫学-人卫版题库 (1).doc · 抗体 · 名词解释 4"},{"id":"fcdc566c615e0fb5","type":"名词解释","number":21,"question":"单克隆抗体","answer":"是用杂交瘤技术制备的、识别一种B细胞表位的特异性抗体。","options":[],"chapter":"抗体","source":"医学免疫学-人卫版题库 (1).doc · 抗体 · 名词解释 7"},{"id":"db24bafd74544014","type":"名词解释","number":22,"question":"基因工程抗体","answer":"是一类应用DNA重组和蛋白质工程技术，按人们的意愿在基因水平上对Ig分子进行切割、拼接或修饰，重新组装成的新型抗体分子。","options":[],"chapter":"抗体","source":"医学免疫学-人卫版题库 (1).doc · 抗体 · 名词解释 8"},{"id":"4d7991568e522999","type":"名词解释","number":23,"question":"补体","answer":"补体是存在于人和动物血清、组织液中，一组经活化后具有酶活性的球蛋白，具有重要的免疫功能。","options":[],"chapter":"补体系统","source":"医学免疫学-人卫版题库 (1).doc · 补体系统 · 名词解释 1"},{"id":"886b77838b1c3220","type":"名词解释","number":24,"question":"补体的调理作用","answer":"与细菌及其他颗粒性物质结合的补体C3b、C4b等通过结合吞噬细胞表面相应受体（CR1等），可促进吞噬细胞的吞噬作用。","options":[],"chapter":"补体系统","source":"医学免疫学-人卫版题库 (1).doc · 补体系统 · 名词解释 2"},{"id":"ec83aae53d9ddb10","type":"名词解释","number":25,"question":"免疫黏附作用","answer":"结合C3b的抗原或抗原抗体复合物与表达CR1的红细胞、血小板结合，并通过血流运送到肝、脾被吞噬清除。","options":[],"chapter":"补体系统","source":"医学免疫学-人卫版题库 (1).doc · 补体系统 · 名词解释 3"},{"id":"4a1ad358285057e7","type":"名词解释","number":26,"question":"MAC","answer":"即攻膜复合物，是补体系统活化过程中由C5b～8复合物与12～15个C9分子组成的复合物，该复合物在靶细胞膜上形成跨膜孔道，小分子物质、水和离子可自由透过细胞膜，蛋白质等大分子不易逸出，导致细胞内渗透压降低，细胞溶解。","options":[],"chapter":"补体系统","source":"医学免疫学-人卫版题库 (1).doc · 补体系统 · 名词解释 4"},{"id":"f25be31c08af9231","type":"名词解释","number":27,"question":"细胞因子","answer":"细胞因子是由免疫细胞及组织细胞分泌的，在细胞间发挥相互调控作用的一类小分子蛋白，通过结合受体调节细胞生长分化和效应，调控免疫应答。","options":[],"chapter":"细胞因子","source":"医学免疫学-人卫版题库 (1).doc · 细胞因子 · 名词解释 1"},{"id":"16106291c798eee5","type":"名词解释","number":28,"question":"CSF","answer":"即集落刺激因子，是一类能刺激多能造血干细胞和不同发育阶段的造血祖细胞分化、增殖的细胞因子。","options":[],"chapter":"细胞因子","source":"医学免疫学-人卫版题库 (1).doc · 细胞因子 · 名词解释 2"},{"id":"278291a9fe2a5a9a","type":"名词解释","number":29,"question":"TNF","answer":"即肿瘤坏死因子，是一类能直接使肿瘤组织发生出血坏死，并能杀伤肿瘤细胞的细胞因子。","options":[],"chapter":"细胞因子","source":"医学免疫学-人卫版题库 (1).doc · 细胞因子 · 名词解释 2"},{"id":"65ee6ca1b1d68851","type":"名词解释","number":30,"question":"MHC","answer":"即主要组织相容性复合体，是脊椎动物某一染色体上一组紧密连锁的基因群，其编码产物为MHC分子；该分子广泛表达于多种细胞表面，主要功能是提呈抗原肽，进而激活T淋巴细胞，在启动特异性免疫应答中起主要作用。","options":[],"chapter":"主要组织相容性复合体","source":"医学免疫学-人卫版题库 (1).doc · 主要组织相容性复合体 · 名词解释 1"},{"id":"40532e8b037f6adf","type":"名词解释","number":31,"question":"HLA复合体","answer":"是人类的主要组织相容性复合体，位于6p21.31，长3600kb，有224个基因座位，其中128个功能性基因。其中编码经典HLAⅠ类分子基因座位为HLA-A、HLA-B、HLA-C，编码经典HLAⅡ类分子基因亚区为HLA-DP、HLA-DQ、HLA-DQ，还有免疫功能相关基因。","options":[],"chapter":"主要组织相容性复合体","source":"医学免疫学-人卫版题库 (1).doc · 主要组织相容性复合体 · 名词解释 2"},{"id":"dc269f6ecaa8c4dc","type":"名词解释","number":32,"question":"MHC限制性","answer":"在适应性免疫中，在T细胞识别MHCⅠ类/Ⅱ类分子提呈的抗原肽时，必须同时识别自身MHC分子，即T细胞只能识别自身MHC分子提呈的抗原肽，这一现象称为MHC限制性。4．锚定残基：抗原肽上与MHCⅠ类/Ⅱ类分子肽结合槽结合的氨基酸残基。","options":[],"chapter":"主要组织相容性复合体","source":"医学免疫学-人卫版题库 (1).doc · 主要组织相容性复合体 · 名词解释 3"},{"id":"b202ac693f293e00","type":"名词解释","number":33,"question":"共用基序","answer":"能与同一HLA分子相结合的不同抗原肽，其锚定残基往往相同或相似，即这些肽段为具有相同锚定残基的共用基序。6．TAP（transporters associated with antigen processing）：即抗原加工相关转运物，由TAP1和TAP2组成的异二聚体，两者分别由TAP1和TAP2基因编码。TAP的作用是将内源性抗原降解后产生的抗原肽转运至内质网内。","options":[],"chapter":"主要组织相容性复合体","source":"医学免疫学-人卫版题库 (1).doc · 主要组织相容性复合体 · 名词解释 5"},{"id":"f71443276b711555","type":"名词解释","number":34,"question":"前B细胞受体","answer":"表达于在B细胞发育的pre-B细胞阶段，由Ig的μ链和替代轻链（λ5/VpreB）组成。主要作用是抑制同源染色体上IgH链基因的重排及促进前B细胞的增殖。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 名词解释 2"},{"id":"f3534d335fa725ab","type":"名词解释","number":35,"question":"替代轻链","answer":"表达于B细胞发育的pre-B细胞阶段，由λ5和VpreB两种蛋白组成。替代轻链Ig的μ链构成前B细胞受体。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 名词解释 3"},{"id":"40123f5bd97da090","type":"名词解释","number":36,"question":"基因重排","answer":"在T、B细胞的发育过程中，一部分基因片段互相接近、重新排列，形成功能性TCR或BCR基因单位，这一过程称为基因重排。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 名词解释 5"},{"id":"4e86fdf29a88857b","type":"名词解释","number":37,"question":"受体编辑","answer":"指在BCR基因重排的过程中，一些基因重排并成功表达BCR（mIgM）识别自身抗原后未被克隆清除，而是发生RAG基因重新活化，导致BCR轻链VJ的再次重排，合成新的轻链，替代自身反应性轻链，使BCR获得新的特异性。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 名词解释 6"},{"id":"514d8f38d54251d0","type":"名词解释","number":38,"question":"等位排斥","answer":"指B细胞中位于一对染色体上的轻链或重链基因，只有一条染色体上的基因得到表达，先重排成功的基因抑制了同源染色体上另一等位基因的重排。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 名词解释 7"},{"id":"2a0dd1e254b4e1ed","type":"名词解释","number":39,"question":"ITAM","answer":"即免疫受体酪氨酸活化基序，是免疫细胞某些跨膜分子胞浆内特定的氨基酸序列，由18个氨基酸残基组成，其中含有2个YxxL/V保守序列。该保守序列的酪氨酸残基可被细胞内的酪氨酸蛋白激酶磷酸化，在免疫细胞的信号转导和活化中起重要作用。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 名词解释 9"},{"id":"ee23cbe815bb0151","type":"名词解释","number":40,"question":"体细胞高频突变","answer":"位于外周淋巴器官生发中心成熟B细胞，在抗原刺激下高频率发生的主要在编码V区的CDR部位的点突变。其意义为：①增加抗体的多样性；②导致抗体亲和力的成熟。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 名词解释 10"},{"id":"83199006a69e0a41","type":"名词解释","number":41,"question":"TCR-CD3复合物","answer":"由TCR与CD3分子以非共价键结合，形成TCR-CD3复合物，表达于T细胞表面。其中，TCR的作用是能特异性识别APC或靶细胞表面的抗原肽-MHC分子复合物，CD3分子的功能是转导TCR识别抗原所产生的活化信号。","options":[],"chapter":"T淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · T淋巴细胞 · 名词解释 1"},{"id":"2b46d05cbf93be2e","type":"名词解释","number":42,"question":"阳性选择","answer":"T细胞在胸腺内发育过程中，DP在胸腺皮质与胸腺上皮细胞表面自身抗原肽-自身MHCⅠ/Ⅱ分子以适度亲和力结合，继续发育成为SP，并获得MHC限制性；不能结合或发生亲和力过高结合的DP则发生凋亡。","options":[],"chapter":"T淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · T淋巴细胞 · 名词解释 2"},{"id":"e81b047583e0bd35","type":"名词解释","number":43,"question":"阴性选择","answer":"T细胞在胸腺内发育过程中，SP在皮质髓质交界处及髓质区，与胸腺树突细胞或巨噬细胞表面自身抗原肽-自身MHCⅠ/Ⅱ分子复合物高亲力结合者发生凋亡，少部分分化为调节性T细胞；不能结合的SP发育成为成熟T细胞。阴性选择的意义是排除自身反应性T细胞克隆，获得自身耐受。","options":[],"chapter":"T淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · T淋巴细胞 · 名词解释 3"},{"id":"dea9125477c71830","type":"名词解释","number":44,"question":"APC","answer":"即抗原提呈细胞，指能加工抗原并以抗原肽-MHC分子复合的形式将抗原肽提呈给T细胞的一类细胞。","options":[],"chapter":"抗原提呈细胞与抗原的加工及提呈","source":"医学免疫学-人卫版题库 (1).doc · 抗原提呈细胞与抗原的加工及提呈 · 名词解释 1"},{"id":"a1689150fca0d1c0","type":"名词解释","number":45,"question":"professional APC","answer":"即专职性抗原提呈细胞。指组成性表达MHCⅡ类分子、共刺激分子和黏附分子，将抗原性加工处理后，以抗原肽- MHCⅡ类分子复合物的形式，将抗原肽提呈给CD4＋T细胞。包括树突状细胞、单核/巨噬细胞、B细胞。","options":[],"chapter":"抗原提呈细胞与抗原的加工及提呈","source":"医学免疫学-人卫版题库 (1).doc · 抗原提呈细胞与抗原的加工及提呈 · 名词解释 2"},{"id":"63176eb3980325f3","type":"名词解释","number":46,"question":"抗原加工","answer":"是APC将摄入胞内的外源性抗原或胞质内自身产生的内源性抗原降解为一定大小的多肽片段，使抗原肽与MHC分子结合，以抗原肽-MHC分子复合物的形式表达于细胞膜表面的过程。","options":[],"chapter":"抗原提呈细胞与抗原的加工及提呈","source":"医学免疫学-人卫版题库 (1).doc · 抗原提呈细胞与抗原的加工及提呈 · 名词解释 3"},{"id":"41050d94f3d97987","type":"名词解释","number":47,"question":"抗原提呈","answer":"表达于在APC表面的抗原肽-MHC分子复合物被T细胞所识别，从而将抗原肽提呈给T细胞，诱导T细胞活化的过程。","options":[],"chapter":"抗原提呈细胞与抗原的加工及提呈","source":"医学免疫学-人卫版题库 (1).doc · 抗原提呈细胞与抗原的加工及提呈 · 名词解释 4"},{"id":"46ac3c6623effbaf","type":"名词解释","number":48,"question":"体液免疫应答","answer":"抗原进入机体后诱导B细胞活化、增殖、分化为浆细胞，产生抗体，发挥特异性免疫效应的过程。","options":[],"chapter":"B淋巴细胞介导的特异性免疫应答","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞介导的特异性免疫应答 · 名词解释 1"},{"id":"bc85fff5a9f274ae","type":"名词解释","number":49,"question":"Ig类别转换","answer":"B细胞在IgV基因重排完成后，B细胞及其子代细胞的IgV基因不变，IgC基因发生改变，即从分泌IgM转变为分泌IgG、IgA或IgE， 这种可变区相同而Ig类别发生变化的过程称为Ig类别转换（同种型转换）。","options":[],"chapter":"B淋巴细胞介导的特异性免疫应答","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞介导的特异性免疫应答 · 名词解释 3"},{"id":"acf5188596e4ff7b","type":"名词解释","number":50,"question":"抗体亲和力成熟","answer":"体细胞高频突变产生了表达不同亲和力BCR的B细胞克隆，只有少数高亲和力的BCR与FDC表面的抗原结合而存活，进一步分化成为浆细胞或记忆B细胞，导致抗体亲和力成熟。","options":[],"chapter":"B淋巴细胞介导的特异性免疫应答","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞介导的特异性免疫应答 · 名词解释 4"},{"id":"1e6213226e3e06d8","type":"名词解释","number":51,"question":"免疫耐受","answer":"是机体免疫系统对特定抗原的免疫无应答状态。","options":[],"chapter":"免疫耐受","source":"医学免疫学-人卫版题库 (1).doc · 免疫耐受 · 名词解释 1"},{"id":"7f96b1c373a8d20a","type":"名词解释","number":52,"question":"中枢耐受（及特点）","answer":"指胚胎期以及出生后T、B细胞在中枢免疫器官的发育过程中，遇自身抗原所形成的耐受。其特点是：一般耐受长期持续，不易被打破。","options":[],"chapter":"免疫耐受","source":"医学免疫学-人卫版题库 (1).doc · 免疫耐受 · 名词解释 2"},{"id":"2e8104e9d97a3fa2","type":"名词解释","number":53,"question":"外周耐受（及特点）","answer":"成熟的T、B细胞在抗原的诱导下，发生的免疫耐受。其特点是：耐受能持续一段时间，诱因消除后可恢复应答能力。","options":[],"chapter":"免疫耐受","source":"医学免疫学-人卫版题库 (1).doc · 免疫耐受 · 名词解释 3"},{"id":"f076850d3e3a23ff","type":"名词解释","number":54,"question":"低带耐受与高带耐受","answer":"因抗原剂量过低而诱导的耐受即为低带耐受；因抗原剂量过高诱导的耐受即为高带耐受。","options":[],"chapter":"免疫耐受","source":"医学免疫学-人卫版题库 (1).doc · 免疫耐受 · 名词解释 4"},{"id":"d266ed986a473114","type":"名词解释","number":55,"question":"免疫忽视","answer":"免疫系统对低水平抗原或低亲和力抗原不发生免疫应答的现象，称为免疫忽视。","options":[],"chapter":"免疫耐受","source":"医学免疫学-人卫版题库 (1).doc · 免疫耐受 · 名词解释 5"},{"id":"d3a1f160a68e2b4d","type":"名词解释","number":56,"question":"超敏反应","answer":"又称变态反应，是机体受到某些抗原刺激时，出现生理功能紊乱或组织细胞损伤的异常适应性免疫应答。","options":[],"chapter":"超敏反应","source":"医学免疫学-人卫版题库 (1).doc · 超敏反应 · 名词解释 1"},{"id":"eb0e92a80b8cb77a","type":"名词解释","number":57,"question":"变应原","answer":"能选择性诱导机体产生特异性IgE，引起速发型超敏反应的抗原物质。","options":[],"chapter":"超敏反应","source":"医学免疫学-人卫版题库 (1).doc · 超敏反应 · 名词解释 2"},{"id":"af8278562a5f9b69","type":"名词解释","number":58,"question":"Arthus反应","answer":"是一种实验性局部Ⅲ型超敏反应。用马血清经皮下反复免疫家兔数周后，当再次注射马血清时，注射局部出现剧烈炎症反应的现象。","options":[],"chapter":"超敏反应","source":"医学免疫学-人卫版题库 (1).doc · 超敏反应 · 名词解释 3"},{"id":"e20ae467f96a644f","type":"名词解释","number":59,"question":"凝集反应","answer":"颗粒性抗原与相应抗体结合，形成肉眼可见的凝集物。","options":[],"chapter":"免疫学检测技术","source":"医学免疫学-人卫版题库 (1).doc · 免疫学检测技术 · 名词解释 1"},{"id":"257934aa70398477","type":"名词解释","number":60,"question":"间接凝集反应","answer":"将可溶性抗原或抗体包被在载体颗粒表面，与相应抗体或抗原反应出现凝集的现象。","options":[],"chapter":"免疫学检测技术","source":"医学免疫学-人卫版题库 (1).doc · 免疫学检测技术 · 名词解释 2"},{"id":"44608185e24549b2","type":"名词解释","number":61,"question":"沉淀反应","answer":"可溶性抗原与相应抗体结合，形成肉眼可见的沉淀物。","options":[],"chapter":"免疫学检测技术","source":"医学免疫学-人卫版题库 (1).doc · 免疫学检测技术 · 名词解释 3"},{"id":"3412da458b384220","type":"名词解释","number":62,"question":"效价","answer":"又称滴度。抗原抗体反应中，出现明显可见反应的最大抗体或抗原制剂稀释度。","options":[],"chapter":"免疫学检测技术","source":"医学免疫学-人卫版题库 (1).doc · 免疫学检测技术 · 名词解释 4"},{"id":"2787ce1084e09164","type":"名词解释","number":63,"question":"免疫标记技术","answer":"用荧光素、酶或放射性同位素等标记物标记抗体或抗原，进行的抗原抗体反应。其敏感性高，特异性强，具有快速、可定性或定量及定位等特点。","options":[],"chapter":"免疫学检测技术","source":"医学免疫学-人卫版题库 (1).doc · 免疫学检测技术 · 名词解释 5"},{"id":"7a01eb236243f704","type":"名词解释","number":64,"question":"ELISA","answer":"即酶联免疫吸附试验，将已知抗原或抗体吸附在固相载体表面，使抗原抗体反应在固相表面进行，通过洗涤洗除液相中的游离成分，再相继加入酶标记的抗体和底物显色，判断待检抗原或抗体的含量。","options":[],"chapter":"免疫学检测技术","source":"医学免疫学-人卫版题库 (1).doc · 免疫学检测技术 · 名词解释 6"},{"id":"03a15a420aef6acd","type":"名词解释","number":65,"question":"人工主动免疫","answer":"人为地给机体输入抗原性物质，刺激机体产生特异性免疫力。","options":[],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 名词解释 1"},{"id":"3c084fd324851c15","type":"名词解释","number":66,"question":"人工被动免疫","answer":"人为地给机体输入抗体或细胞因子等制剂，以治疗或紧急预防疾病。","options":[],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 名词解释 2"},{"id":"4fa764ed1b12e6e0","type":"名词解释","number":67,"question":"计划免疫","answer":"根据某些特定传染病的疫情监测和人群免疫状况分析，有计划地用疫苗进行免疫接种，预防相应传染病，最终达到控制乃至消灭相应传染病的目的而采取的重要措施。","options":[],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 名词解释 3"},{"id":"2ff6ec7e6d5d7696","type":"名词解释","number":68,"question":"重组载体疫苗","answer":"将编码病原体有效免疫原的基因插入载体（减毒的病毒或细菌）基因组中，接种后，随疫苗株在体内的增殖，大量表达所需的抗原，从而刺激机体产生特异性免疫力。","options":[],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 名词解释 4"},{"id":"f8d64331669a4b7e","type":"名词解释","number":69,"question":"DNA疫苗","answer":"由编码病原体有效免疫原的基因与细菌质粒构建重组体而制成的疫苗称为DNA疫苗。","options":[],"chapter":"免疫学防治","source":"医学免疫学-人卫版题库 (1).doc · 免疫学防治 · 名词解释 5"},{"id":"900f990864b3add1","type":"问答题","number":1,"question":"简述免疫系统的组成。","answer":"免疫系统组成有：\n（1）免疫器官和组织：包括中枢免疫器官的骨髓和胸腺，外周免疫器官和组织的淋巴结、脾脏和黏膜相关淋巴组织等）。\n（2）免疫细胞：包括造血干细胞、淋巴细胞、抗原提呈细胞、粒细胞、肥大细胞等。\n（3）免疫分子：包括抗体、补体、细胞因子、MHC分子、CD分子、黏附分子等。","options":[],"chapter":"免疫器官和组织","source":"医学免疫学-人卫版题库 (1).doc · 免疫器官和组织 · 简答 1"},{"id":"0f340f8b7db95ad1","type":"问答题","number":2,"question":"简述中枢免疫器官的组成和各器官主要功能。","answer":"中枢免疫器官由骨髓和胸腺组成，其主要功能为：免疫细胞发生、分化、发育和成熟的场所。\n骨髓的主要功能为：（1）各类血细胞和免疫细胞发生的场所。（2）B细胞分化、成熟的场所。（3）骨髓也是再次体液免疫应答和产生抗体的主要部位。\n胸腺的主要功能为：（1）T细胞分化、成熟的场所。（2）免疫调节作用：胸腺基质细胞产生的多种细胞因子和胸腺肽类分子，对外周免疫器官和免疫细胞有调节作用。（3）自身耐受的建立与维持：T细胞系谱在胸腺发育过程中产生的自身反应性T细胞经阴性选择，导致自身反应性T细胞克隆删除或功能被抑制，形成对自身抗原的中枢耐受。","options":[],"chapter":"免疫器官和组织","source":"医学免疫学-人卫版题库 (1).doc · 免疫器官和组织 · 简答 2"},{"id":"b29a697bc82af89b","type":"问答题","number":3,"question":"简述外周免疫器官的组成和各器官主要功能。","answer":"外周免疫器官由淋巴结、脾脏和黏膜相关淋巴组织等组成，其主要功能为：是成熟T细胞、B细胞等免疫细胞定居的场所，也是产生免疫应答的主要部位。其中，淋巴结和脾脏还参与淋巴细胞再循环，并分别对淋巴液和血液里的病原体和其他有害异物有滤过作用；皮肤黏膜相关淋巴组织（扁桃体、小肠派氏集合淋巴结、阑尾等）主要针对经黏膜表面入侵机体的病原微生物产生免疫应答，在局部免疫中发挥重要作用。","options":[],"chapter":"免疫器官和组织","source":"医学免疫学-人卫版题库 (1).doc · 免疫器官和组织 · 简答 3"},{"id":"a98e24f775836518","type":"问答题","number":4,"question":"何谓淋巴细胞再循环，其生物学意义是什么？","answer":"淋巴细胞再循环是指定居于外周免疫器官的淋巴细胞在血液、淋巴液、淋巴器官或组织间反复循环的过程。淋巴细胞再循环的意义为：（1）使淋巴细胞在外周免疫器官和组织的分布更为合理。（2）增加了T、B细胞与抗原和APC接触的机会。（3）使免疫器官和免疫组织联系成为一个有机的整体。","options":[],"chapter":"免疫器官和组织","source":"医学免疫学-人卫版题库 (1).doc · 免疫器官和组织 · 简答 4"},{"id":"e7167dc30628edc6","type":"问答题","number":5,"question":"抗原的两个基本特性及其含义是什么？","answer":"抗原的两个基本特性为免疫原性和抗原性/免疫反应性。免疫原性是指抗原刺激机体产生免疫应答，诱生抗体或效应T细胞；抗原性/免疫反应性是指抗原能与相应的抗体或效应T细胞发生特异性结合。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 简答 1"},{"id":"4facbb44b3700650","type":"问答题","number":6,"question":"简述影响抗原免疫原性的因素。","answer":"影响抗原免疫应答的因素包括抗原分子的理化与结构性质、宿主的特性和抗原进入机体的方式三个方面。抗原分子的理化与结构性质包括抗原的异物性、化学属性、分子量、分子结构、分子构象、易接近性和物理性状；宿主方面的因素包括遗传因素及年龄、性别和健康状况等；抗原进入机体的方式主要包括抗原的剂量、免疫途径、次数、间隔时间、佐剂的应用以及佐剂的类型等。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 简答 2"},{"id":"87eb048ef2be60ce","type":"问答题","number":7,"question":"动物免疫血清对于人的两重性表现在哪里？","answer":"动物免疫血清对于人的两重性表现在：（1）动物免疫血清是特异性抗体，在人体内可中和相应外毒素，故可用于某些疾病防治。（2）动物免疫血清是异种抗原：动物的产生的抗体（Ig）对于人体的免疫系统而言，是异种蛋白，故具有抗原的作用，可刺激人免疫系统产生免疫应答，所以诱发致超敏反应。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 简答 3"},{"id":"503f0f3b6b562713","type":"问答题","number":8,"question":"何谓佐剂？佐剂的作用机制有哪些？","answer":"佐剂是一类预先注入机体或与抗原同时注入机体，可增强机体对该抗原的免疫应答或改变免疫应答类型的非特异性免疫增强物质。\n作用的主要机制有：①改变抗原物理性状，延缓抗原降解和排除，延长抗原在体内潴留时间；②刺激单核巨噬细胞系统，增强其对抗原的处理和提呈能力；③刺激淋巴细胞的增殖分化，从而增强和扩大免疫应答的能力。","options":[],"chapter":"抗原","source":"医学免疫学-人卫版题库 (1).doc · 抗原 · 简答 4"},{"id":"e0653b70752aec3c","type":"问答题","number":9,"question":"简述免疫球蛋白的基本结构。","answer":"免疫球蛋白的基本结构：Ig是由两条相同的重链和两条相同的轻链以链间二硫键连接而成的四肽链结构。在重链近N端的1/4或1/5区域、轻链近N端的1/2区域内的氨基酸序列变化较大，称为可变区（V区）；其余部分其氨基酸序列相对保守称为恒定区（C区）。","options":[],"chapter":"抗体","source":"医学免疫学-人卫版题库 (1).doc · 抗体 · 简答 1"},{"id":"0c06d788986608ab","type":"问答题","number":10,"question":"试述IgM的主要免疫学特性及功能。","answer":"IgM为五聚体，分子量最大，主要分布在血液中；个体发育过程中最早合成，胚胎晚期即可产生，脐带血IgM增高提示胎儿有宫内感染；抗原刺激机体后，最早出现的抗体为IgM型，且IgM半衰期短，故血清检测到针对某种病原微生物特异性的IgM型抗体，提示有该病原微生物的近期感染；激活补体能力、凝集作用较IgG强，在机体早期免疫防御中起重要作用；机体的ABO血型抗体为IgM型抗体，是天然血型抗体；IgM也参与某些自身免疫病和超敏反应。mIgM是BCR的主要成分之一。","options":[],"chapter":"抗体","source":"医学免疫学-人卫版题库 (1).doc · 抗体 · 简答 4"},{"id":"cee3ec6305a6bdd4","type":"问答题","number":11,"question":"简述补体膜攻击复合物（MAC）的组成及其靶细胞溶解的效应机制。","answer":"MAC由C5b～8复合物与12～15个C9分子组成（C5b～9），其溶解靶细胞的效应机制是：MAC在靶细胞膜上形成内壁亲水的跨膜通道，使小分子、水和离子可自由透过细胞膜，\n蛋白质等大分子不易逸出，导致细胞内渗透压降低，细胞溶解。","options":[],"chapter":"补体系统","source":"医学免疫学-人卫版题库 (1).doc · 补体系统 · 简答 1"},{"id":"533a974f4c1e6fe0","type":"问答题","number":12,"question":"简述补体的生物学功能及相应的补体成分。","answer":"（1）细胞毒作用： MAC（C5b6789n）\n（2）调理作用：C3b、C4b、 iC3b、CR1、CR3、CR4\n（3）炎症介质作用：介导局部炎症反应的补体片段为C3a、C4a、C5a；对中性粒细胞具有趋化作用的补体片段为C5a。\n（4）清除免疫复合物——免疫黏附作用：C3b","options":[],"chapter":"补体系统","source":"医学免疫学-人卫版题库 (1).doc · 补体系统 · 简答 2"},{"id":"cf039d421f117c40","type":"问答题","number":13,"question":"简述细胞因子作用方式和功能特点。","answer":"主要以自分泌或旁分泌的方式发挥作用，少数以内分泌的方式发挥作用。其作用特点主要有：①多效性：一种细胞因子作用于多种靶细胞，产生多种生物学效应；②重叠性：几种细胞因子作用于同一种靶细胞，产生相同或相似的生物学效应；③协同性：一种细胞因子强化另一种细胞因子的功能；④拮抗性：一种细胞因子抑制其他细胞因子的功能；⑤网络性：在免疫应答过程中，免疫细胞通过具有不同生物学效应的细胞因子之间相互刺激、彼此约束，形成复杂的细胞因子网络，对免疫应答进行调节，维持免疫系统的稳态和平衡。","options":[],"chapter":"细胞因子","source":"医学免疫学-人卫版题库 (1).doc · 细胞因子 · 简答 1"},{"id":"0c917bc54efc16d6","type":"问答题","number":14,"question":"细胞因子分哪几类？请分别写出其中文名和常用英文缩写。","answer":"细胞因子可分为：白细胞介素（IL）、干扰素（IFN）、肿瘤坏死因子（TNF）、集落刺激因子（CSF）、趋化性细胞因子（chemokine）和生长因子（GF）六类。","options":[],"chapter":"细胞因子","source":"医学免疫学-人卫版题库 (1).doc · 细胞因子 · 简答 2"},{"id":"7245fe5a01e37046","type":"问答题","number":15,"question":"简述HLA复合体的遗传特点。","answer":"（1）HLA的多态性：现已确定的HLA等基因总数达8712个，这些等基因在一个HLA复合体上的随机组合数目达1╳1031以上。由此可知，在没有亲缘关系的个体之间，其HLA基因完全相同的可能性几乎等于零。\n（2）单体型遗传：HLA复合体作为一个整体从亲代向子代遗传。由此可知：①亲代和子代之间有50%HLA基因相同；②在同胞兄弟姐妹之间：50%的概率1/2的HLA相同，25%的概率HLA基因完全相同，还有25%概率HLA基因完全不同。\n（3）连锁不平衡：即HLA不同基因座位上的等位基因各种组合，在一条染色体的出现频率并非符合随机组合出现的频率。","options":[],"chapter":"主要组织相容性复合体","source":"医学免疫学-人卫版题库 (1).doc · 主要组织相容性复合体 · 简答 1"},{"id":"af8ee6dce090d9f3","type":"问答题","number":16,"question":"简述HLA与临床医学的关系。","answer":"（1）HLA与器官移植：供、受者间HLA等位基因的匹配程度在器官移植中有关键作用。（2）HLA分子异常表达与疾病：如肿瘤细胞Ⅰ类分子表达减弱将导致肿瘤逃避免疫监视，原先不表达Ⅱ类分子的上皮细胞（如胰岛β细胞等）被诱导表达Ⅱ类分子，可能导致自身免疫病。\n（3）HLA和疾病关联：带有某些特定HLA型别的个体易患某一疾病（阳性关联）或对该疾病有较强的抵抗力（阴性关联），如HLA-B27与强直性脊柱炎（AS）有强阳性关联。\n（4）HLA与亲子鉴定和法医学：不同个体的HLA显示个体性的遗传标志，同时根据HLA单体型遗传的规律， HLA基因分型被广泛用于亲子鉴定、身份鉴定等。","options":[],"chapter":"主要组织相容性复合体","source":"医学免疫学-人卫版题库 (1).doc · 主要组织相容性复合体 · 简答 3"},{"id":"936a431171d3efa9","type":"问答题","number":17,"question":"简述B-1细胞表面标志、抗原识别和免疫应答等特点。","answer":"（1）表面标志：mIgM＋CD5＋\n（2），抗原识别的特点：BCR缺乏多样性，主要针对碳水化合物产生较强的应答。\n（3）免疫应答的特点：应答过程无需Th的辅助，无免疫记忆，且不发生Ig类别转换；产生免疫应答快，48小时内即可产生以IgM为主的低亲和力抗体，且产生的抗体具有多反应性；主要在腹膜腔、胸膜腔及肠道黏膜等部位发挥抗感染免疫作用。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 简答 1"},{"id":"07ca7840aada0000","type":"问答题","number":18,"question":"简述B细胞中枢耐受形成的机制。","answer":"（1）克隆清除：B细胞在骨髓中的分化过程中，自身反应性的未成熟B细胞（表达mIgM）与自身抗原结合，导致该细胞凋亡，形成克隆清除。\n（2）失能：某些情况下，未成熟B细胞与自身抗原结合引起mIgM表达下调，这类细胞虽然可进入外周免疫器官，但对相应抗原刺激不产生应答，称为失能。\n（3）受体编辑：指在BCR基因重排的过程中，一些基因重排并成功表达BCR（mIgM）识别自身抗原后未被克隆清除，而是发生RAG基因重新活化，导致BCR轻链VJ的再次重排，合成新的轻链，替代自身反应性轻链，使BCR获得新的特异性，即不识别对自身物质。","options":[],"chapter":"B淋巴细胞","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞 · 简答 2"},{"id":"84b70a5b6520f193","type":"问答题","number":19,"question":"试述未成熟DC与成熟DC的特点。","answer":"（1）未成熟DC的特点为：①表达模式识别受体，有效识别和摄取外源性抗原。②具有很强的抗原加工能力。③低水平表达MHCⅡ类分子、共刺激分子和黏附分子，提呈抗原和激发免疫应答能力较弱。\n（2）成熟DC的特点为：①表面有许多树突样突起。②低表达模式识别受体，识别和摄取外源性抗原能力弱。③抗原加工能力弱。④高水平表达MHCⅡ类分子、共刺激分子和黏附分子，能有效提呈抗原和激活T细胞。","options":[],"chapter":"抗原提呈细胞与抗原的加工及提呈","source":"医学免疫学-人卫版题库 (1).doc · 抗原提呈细胞与抗原的加工及提呈 · 简答 1"},{"id":"8f56ff81ef2d44ea","type":"问答题","number":20,"question":"简述B细胞作为抗原提呈细胞的特点。","answer":"（1）主要以BCR特异性结合抗原，摄取抗原后，以抗原肽-MHCⅡ类分子复合物，提呈给CD4＋T细胞（效应T细胞或记忆T细胞）。\n（2）具有浓集抗原作用。\n（3）活化的B细胞表达CD80、CD86等共刺激分子，为Th活化提供第二信号。\n（4）在激活Th的同时，B细胞自身受到Th的辅助而活化，并对TD抗原产生免疫应答。","options":[],"chapter":"抗原提呈细胞与抗原的加工及提呈","source":"医学免疫学-人卫版题库 (1).doc · 抗原提呈细胞与抗原的加工及提呈 · 简答 3"},{"id":"8301342d403b13f4","type":"问答题","number":21,"question":"简述TD抗原诱导B细胞活化的双信号及其作用。","answer":"第一信号（抗原识别信号）：BCR复合物识别抗原的B细胞表位→→BCR交联，Igα/Igβ胞浆区ITAM磷酸化，传导抗原信号。\n第二信号（协同刺激信号）：  B细胞的CD40结合Th的CD40L（CD154）→→细胞充分活化。","options":[],"chapter":"B淋巴细胞介导的特异性免疫应答","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞介导的特异性免疫应答 · 简答 1"},{"id":"92ad817e093d0984","type":"问答题","number":22,"question":"简述BCR对抗原识别与TCR识别抗原的不同点。","answer":"（1）BCR不仅能识别蛋白质抗原，还能识别多肽、核酸、多糖类、脂类和小分子化合物类抗原；\n（2）BCR能特异性识别完整抗原的天然构象、或识别抗原降解所暴露表们的空间构象；\n（3）BCR对抗原的识别不需APC加工和提呈，亦无MHC限制性。","options":[],"chapter":"B淋巴细胞介导的特异性免疫应答","source":"医学免疫学-人卫版题库 (1).doc · B淋巴细胞介导的特异性免疫应答 · 简答 2"},{"id":"7e9d1782fbeaeef3","type":"问答题","number":23,"question":"以T细胞活化为例简述低带耐受与高带耐受形成机制。","answer":"低带耐受形成原因：抗原剂量过低，TCR结合APC提呈的抗原肽-MHC分子复合物数量太少，不足以激活特异性T细胞。\n高带耐受形成原因：抗原剂量过高，易诱导调节性T细胞等负调节机制活化，抑制免疫应答，或诱导应答性T细胞凋亡。","options":[],"chapter":"免疫耐受","source":"医学免疫学-人卫版题库 (1).doc · 免疫耐受 · 简答 1"},{"id":"14e493de5882e4fc","type":"问答题","number":24,"question":"简述T、B细胞形成耐受各有何特点。","answer":"T细胞耐受：易于诱导，所需抗原剂量低，耐受持续时间较长（数月~数年）。\nB细胞耐受：需较大剂量抗原，耐受持续时间较短（数周）。","options":[],"chapter":"免疫耐受","source":"医学免疫学-人卫版题库 (1).doc · 免疫耐受 · 简答 2"},{"id":"8b40b6c041959375","type":"问答题","number":25,"question":"简述后天接触抗原导致免疫耐受形成的抗原因素和机体因素。","answer":"后天接触抗原导致免疫耐受形成的抗原因素包括：抗原剂量，抗原类型及剂型，抗原持续存在，抗原免疫的途径，抗原表位特点；导致免疫耐受形成的机体因素包括：机体发育程度或年龄，机体生理状态（即处于免疫抑制状态），遗传背景（动即物的种属和品系等）。","options":[],"chapter":"免疫耐受","source":"医学免疫学-人卫版题库 (1).doc · 免疫耐受 · 简答 3"}]</script>
<script>
'use strict';
const bank = JSON.parse(document.querySelector('#bank').textContent);
const byId = new Map(bank.map(q => [q.id, q]));
const storageKey = 'immunology-study-v1';
let saved;
try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; } catch { saved = {}; }
const results = saved.results || {};
let filter = '全部题目';
let mistakeList = false;
let assessment;
let order = bank.map(q => q.id);
let current = byId.has(saved.current) ? saved.current : order[0];
let revealed = false;
let selected = '';
let storageFailed = false;
const panel = document.querySelector('#panel');
const types = ["全部题目", "单选题", "填空题", "名词解释", "问答题"];
const reviews = ['错题集', '收藏'];
const inType = q => filter === '全部题目' || (filter === '错题集' ? results[q.id]?.wrong : filter === '收藏' ? results[q.id]?.star : q.type === filter);
const chapterSelect = document.querySelector('#chapter');
for (const chapter of ['全部章节', ...new Set(bank.map(q => q.chapter))]) {
  const option = node('option', chapter);
  option.value = chapter;
  chapterSelect.append(option);
}
const collection = q => (filter === '错题集' || chapterSelect.value === '全部章节' || q.chapter === chapterSelect.value) && inType(q);
chapterSelect.addEventListener('change', () => setFilter('全部题目'));
let queue = order.filter(id => collection(byId.get(id)));
document.querySelector('#total').textContent = '共 ' + bank.length + ' 题';

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text != null) element.textContent = text;
  if (className) element.className = className;
  return element;
}
function button(label, action, className) {
  const element = node('button', label, className);
  element.type = 'button';
  element.addEventListener('click', action);
  return element;
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({results, current})); }
  catch { storageFailed = true; }
}
function go(id, focus = false) {
  current = id;
  revealed = false;
  selected = '';
  assessment = undefined;
  save();
  render();
  if (focus) panel.querySelector('h1')?.focus();
}
function setFilter(value) {
  if (value === '错题集') {
    openMistakes();
    return;
  }
  mistakeList = false;
  filter = value;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue.includes(current) ? current : queue[0], true);
}
function renderNav() {
  for (const [selector, labels] of [['#types', types], ['#review', reviews]]) {
    const nav = document.querySelector(selector);
    nav.replaceChildren();
    for (const label of labels) {
      const count = bank.filter(q => (label === '错题集' || chapterSelect.value === '全部章节' || q.chapter === chapterSelect.value) && (label === '全部题目' || q.type === label || (label === '错题集' && results[q.id]?.wrong) || (label === '收藏' && results[q.id]?.star))).length;
      const control = button(label, () => setFilter(label));
      control.append(node('span', count));
      control.setAttribute('aria-current', String(label === filter));
      nav.append(control);
    }
  }
}
function record(q, changes) {
  results[q.id] = {...results[q.id], ...changes};
  save();
}
function update(focusId) {
  render();
  if (focusId) document.getElementById(focusId)?.focus();
}
function shuffle() {
  const shuffled = [...order];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  order = shuffled;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue[0], true);
}
function openMistakes() {
  filter = '错题集';
  mistakeList = true;
  render();
  panel.querySelector('h1')?.focus();
}

function renderMistakes() {
  const ids = order.filter(id => results[id]?.wrong);
  const header = node('div', null, 'review-head');
  const title = node('h1', '错题集');
  title.tabIndex = -1;
  header.append(title, node('div', '待重练 ' + ids.length + ' 题', 'quiet'));
  panel.append(header);
  if (!ids.length) {
    panel.append(node('p', '选择题答错或主观题标记为错题后，会显示在这里。', 'quiet'));
    return;
  }

  function retry(id) {
    mistakeList = false;
    queue = ids;
    go(id, true);
  }
  panel.append(button('开始重练', () => retry(ids[0]), 'primary'));
  const list = node('ul', null, 'review-list');
  for (const id of ids) {
    const q = byId.get(id);
    const entry = node('li');
    const open = button(null, () => retry(id));
    const wrongCount = results[id].wrongCount || 1;
    open.append(node('span', q.chapter + ' · ' + q.type + ' · 错 ' + wrongCount + ' 次', 'quiet'),
                node('span', q.question));
    entry.append(open);
    list.append(entry);
  }
  panel.append(list);
}

function recordAttempt(q, wrong) {
  const previous = results[q.id];
  const count = previous?.wrongCount || Number(Boolean(previous?.wrong));
  record(q, {done: true, wrong, wrongCount: count + Number(wrong)});
}

function render() {
  renderNav();
  panel.replaceChildren();
  if (mistakeList) {
    renderMistakes();
    return;
  }
  const q = byId.get(current);
  const index = queue.indexOf(current);
  if (!q || index < 0) {
    panel.append(node('h1', filter === '错题集' ? '暂无错题' : filter === '收藏' ? '暂无收藏' : '本章暂无该题型'));
    panel.append(button('返回全部题目', () => setFilter('全部题目'), 'primary'));
    return;
  }
  const meta = node('div', null, 'meta');
  const completed = queue.filter(id => results[id]?.done).length;
  meta.append(node('strong', q.chapter + ' · ' + q.type), node('span', '当前 ' + (index + 1) + ' / ' + queue.length + ' · 已练 ' + completed));
  const progress = node('progress');
  progress.max = queue.length;
  progress.value = completed;
  progress.setAttribute('aria-label', '已练习题数');
  const title = node('h1', q.question);
  title.tabIndex = -1;
  panel.append(meta, progress, title);
  if (q.options.length) {
    const choices = node('div', null, 'choices');
    for (const [key, label] of q.options) {
      const control = button(label, () => {
        if (selected) return;
        selected = key;
        revealed = true;
        if (q.answer) recordAttempt(q, key !== q.answer);
        update('choice-' + key);
      });
      control.id = 'choice-' + key;
      if (selected) control.setAttribute('aria-disabled', 'true');
      if (revealed && key === q.answer) control.className = 'good';
      else if (revealed && key === selected && q.answer) control.className = 'bad';
      choices.append(control);
    }
    panel.append(choices);
  }
  const actions = node('div', null, 'actions');
  const toggle = button(revealed ? '收起答案' : '查看答案', () => {
    revealed = !revealed;
    update('answer-toggle');
  }, 'primary');
  toggle.id = 'answer-toggle';
  toggle.setAttribute('aria-expanded', String(revealed));
  toggle.setAttribute('aria-controls', 'answer');
  const star = button(results[q.id]?.star ? '取消收藏' : '收藏本题', () => {
    record(q, {star:!results[q.id]?.star});
    update('star');
  });
  star.id = 'star';
  actions.append(toggle, star);
  panel.append(actions);
  const answer = node('div', null, 'answer');
  answer.id = 'answer';
  answer.hidden = !revealed;
  answer.setAttribute('aria-live', 'polite');
  if (revealed) {
    const heading = selected && q.answer ? (selected === q.answer ? '答对了' : '答错了') : '参考答案';
    const answerText = q.options.find(([key]) => key === q.answer)?.[1] || q.answer || '原表未提供答案';
    answer.append(node('strong', heading), node('div', answerText));
    if (q.note) answer.append(node('div', q.note));
    answer.append(node('div', '来源 · ' + q.source, 'quiet'));
  }
  panel.append(answer);
  if (revealed && !q.options.length && q.answer) {
    const assess = node('div', null, 'actions');
    for (const [label, wrong, id] of [['已掌握',false,'known'],['记为错题',true,'unknown']]) {
      const control = button(label, () => {
        if (assessment === wrong) return;
        assessment = wrong;
        recordAttempt(q, wrong);
        update(id);
      });
      control.id = id;
      control.setAttribute('aria-pressed', String(results[q.id]?.done && results[q.id]?.wrong === wrong || false));
      assess.append(control);
    }
    if (results[q.id]?.done) assess.append(node('span', results[q.id].wrong ? '已加入错题' : '已标为掌握', 'quiet'));
    panel.append(assess);
  }
  const foot = node('div', null, 'foot');
  const previous = button('上一题', () => go(queue[index - 1], true));
  previous.disabled = index === 0;
  const next = button('下一题', () => go(queue[index + 1], true));
  next.disabled = index === queue.length - 1;
  const jump = node('select', null, 'jump');
  jump.setAttribute('aria-label', '跳到指定题目');
  queue.forEach((id, i) => {
    const item = byId.get(id);
    const option = node('option', '第 ' + (i + 1) + ' 题 · ' + item.type);
    option.value = id;
    jump.append(option);
  });
  jump.value = current;
  jump.addEventListener('change', () => go(jump.value, true));
  const paging = node('div', null, 'actions');
  paging.append(previous, jump, next);
  const secondary = filter === '错题集'
    ? button('返回错题集', openMistakes)
    : button('随机排序', shuffle);
  foot.append(paging, secondary);
  panel.append(foot);
  if (filter === '错题集' && results[q.id]?.done && !results[q.id].wrong) {
    panel.append(node('p', '本题已掌握，已从待重练列表移除。', 'quiet'));
  }
  if (storageFailed) panel.append(node('p', '浏览器未允许本地存储，本次记录会在关闭后清除。', 'quiet'));
}
render();
</script>
</html>
