<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中药学刷题</title>
<style>
:root{color-scheme:light;--paper:#f6f4ee;--white:#fffdf8;--ink:#252b28;--muted:#5b6159;--line:#deded3;--accent:#244f40;--soft:#e8eee5;--red:#8f332b}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.65 "Source Sans 3","PingFang SC","Microsoft YaHei",sans-serif}
[hidden]{display:none!important}
header{border-bottom:1px solid var(--line);background:var(--white)}
.head{max-width:1120px;margin:auto;padding:19px 30px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand strong{font:700 23px/1.3 "Songti SC","Noto Serif CJK SC","SimSun",serif;letter-spacing:.055em}
.total,.quiet{color:var(--muted);font-size:14px}
main{max-width:1120px;margin:36px auto;padding:0 30px;display:grid;grid-template-columns:218px minmax(0,1fr);gap:38px}
aside h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}
nav{display:grid;gap:2px}
button,.jump{font:inherit;color:inherit;background:var(--white);border:1px solid var(--line);border-radius:4px;padding:8px 13px;min-height:42px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,.jump:focus-visible,h1:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
nav button{display:flex;justify-content:space-between;align-items:center;border-color:transparent;background:transparent;text-align:left;gap:9px}
nav button[aria-current=true]{background:var(--soft);color:var(--accent);font-weight:700;border-left-color:var(--accent)}
nav span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.chapter{width:100%;margin-bottom:10px}
.panel{background:var(--white);border:1px solid var(--line);padding:27px 30px;min-width:0}
.meta,.foot,.actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.meta{color:var(--muted);font-size:14px}
.meta strong{font-weight:600;color:var(--accent)}
progress{width:100%;height:4px;display:block;margin:13px 0 24px;accent-color:var(--accent)}
h1{font:700 clamp(22px,3vw,30px)/1.5 "Songti SC","Noto Serif CJK SC","SimSun",serif;margin:0 0 19px;overflow-wrap:anywhere}
.choices{display:grid;gap:7px;margin-bottom:18px}
.choices button{text-align:left;min-height:46px;padding:9px 13px}
.choices button.good{background:var(--soft);border-color:var(--accent)}
.choices button.bad{background:#f7e8e1;color:var(--red);border-color:var(--red)}
.choices button[aria-disabled=true]{cursor:default}
.answer{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:13px 15px;border-left:2px solid var(--accent);margin:14px 0}
.answer strong{display:block;margin-bottom:4px}
.answer .quiet{margin-top:8px}
.foot{border-top:1px solid var(--line);margin-top:23px;padding-top:14px}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.actions{justify-content:flex-start}
.jump{max-width:100%;padding:6px 8px}
.review-head{margin-bottom:13px}
.review-head h1{margin-bottom:2px}
.review-list{list-style:none;padding:0;margin:18px 0 0;border-top:1px solid var(--line)}
.review-list li{border-bottom:1px solid var(--line)}
.review-list button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:13px 5px;overflow-wrap:anywhere}
.review-list button:hover{background:var(--soft)}
.review-list .quiet{display:block;margin-bottom:3px}
@media(max-width:680px){
  .head{padding:14px 16px}
  .brand strong{font-size:20px}
  main{margin:15px auto;padding:0 12px;display:block}
  aside h2{display:none}
  nav,.tools{display:flex;flex-wrap:wrap;gap:3px}
  nav button{font-size:14px;padding:5px 9px;gap:5px;min-height:38px}
  .tools{margin:6px 0 12px;padding-top:4px}
  .panel{padding:16px 14px}
  .foot,.actions{gap:6px}
}
.explanation{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.exam-form{max-width:440px}
.exam-setting{display:grid;grid-template-columns:minmax(0,1fr) 65px 83px;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.exam-setting input,.exam-question textarea{width:100%;font:inherit;color:inherit;background:var(--white);border:1px solid var(--line);border-radius:4px;padding:8px}
.exam-setting input:focus-visible,.exam-question textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.exam-total{font-size:17px;font-weight:650;margin:0}
.exam-form .exam-total{margin:16px 0}
.exam-header{border-bottom:1px solid var(--line);padding-bottom:12px}
.exam-header .quiet{margin:3px 0 0}
.exam-section h2{font-size:17px;margin:24px 0 14px;color:var(--accent)}
.exam-question{min-inline-size:0;margin:0 0 20px;padding:0 0 17px;border:0;border-bottom:1px solid var(--line)}
.exam-question legend{font-weight:600;overflow-wrap:anywhere;padding:0 0 8px;width:100%}
.exam-question textarea{resize:vertical;display:block}
.exam-options{display:grid;gap:4px}
.exam-option{display:flex;align-items:baseline;gap:7px;padding:5px 8px;overflow-wrap:anywhere}
.exam-option input{accent-color:var(--accent);flex-shrink:0}
.exam-option.correct{background:var(--soft)}
.exam-option.incorrect{background:#f7e8e1;color:var(--red)}
.exam-question .actions{margin:9px 0 0}
@media(max-width:380px){.exam-setting{grid-template-columns:minmax(0,1fr) 56px 72px;gap:5px}}
#study-sync{max-width:1120px;margin:12px auto 0;padding:0 30px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#study-sync input{font:inherit;max-width:100%;padding:5px;border:1px solid var(--line);border-radius:4px}
.subject-nav{max-width:1120px;margin:auto;padding:6px 30px;display:flex;gap:6px;flex-wrap:wrap}.subject-nav a{color:var(--accent,#244f40);padding:8px 12px;text-decoration:none;border-radius:8px;line-height:1.3}.subject-nav a[aria-current=page]{font-weight:700;background:var(--soft,#e8eee5)}.subject-nav a:focus-visible{outline:2px solid var(--accent,#244f40)}@media(max-width:680px){.subject-nav{padding-inline:12px}}
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.head{padding-block:16px}
main{column-gap:26px;margin-top:18px}
button,.jump{border-radius:8px;min-height:44px}
button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:650}
button.primary{background:var(--accent);color:white}
button.primary:hover:not(:disabled){filter:brightness(1.12)}
.panel{border-radius:14px;box-shadow:0 4px 18px #25372d0b}
.choices button{min-height:50px}
#study-overview{max-width:1060px;margin:18px auto 0;padding:12px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--white);display:flex;gap:12px;align-items:center;justify-content:space-between}
#study-overview strong,#study-overview .quiet{display:block}
.study-draft{display:block;color:var(--muted);font-size:14px;margin-bottom:16px}
.study-draft textarea{display:block;width:100%;resize:vertical;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);font:inherit}
.study-draft textarea:focus-visible,.study-checklist input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.study-checklist{margin:12px 0;border:1px solid var(--line);padding:8px 12px;border-radius:8px}
.study-checklist label{display:flex;gap:8px;align-items:baseline;padding:5px 0}
.study-checklist input{accent-color:var(--accent);flex:none}
.confidence{margin-top:12px}
.shortcuts{margin:10px 0 0}
@media(max-width:1119px){#study-overview{margin-inline:30px}}
@media(max-width:680px){
  #study-overview{margin:10px 12px 0}
  main{margin-top:10px}
  nav button{min-height:44px}
  .foot .actions:first-child{display:grid;grid-template-columns:auto minmax(0,1fr) auto;width:100%}
  .shortcuts{display:none}
}
.ig-diagram{position:relative;width:min(100%,340px);height:232px;border:1px solid var(--line);border-radius:12px;background:var(--soft);margin:14px 0;color:var(--ink)}
.ig-chain{position:absolute;display:block;border-radius:10px;background:var(--accent);height:9px;transform-origin:left center}
.ig-chain.heavy-left{width:105px;left:50%;top:108px;transform:rotate(228deg)}
.ig-chain.heavy-right{width:105px;left:50%;top:108px;transform:rotate(-48deg)}
.ig-chain.light-left,.ig-chain.light-right{width:69px;background:#975820}
.ig-chain.light-left{left:calc(50% - 24px);top:104px;transform:rotate(228deg)}
.ig-chain.light-right{left:calc(50% + 24px);top:104px;transform:rotate(-48deg)}
.ig-chain.stem{height:79px;width:14px;top:108px;left:calc(50% - 6px)}
button.ig-marker{position:absolute;min-width:44px;padding:0;border-color:var(--accent);border-radius:50%;font-weight:700}
button.ig-marker[aria-pressed=true]{background:var(--accent);color:white}
.marker-1{left:calc(50% + 68px);top:63px}.marker-2{left:calc(50% + 22px);top:104px}
.marker-3{left:calc(50% - 22px);top:177px}.marker-4{left:calc(50% - 96px);top:15px}
.subject-nav .sync-nav-link{margin-left:auto;border:1px solid var(--accent,#244f40);font-weight:650}#study-sync:target{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;scroll-margin-top:12px}@media(max-width:680px){.subject-nav .sync-nav-link{margin-left:0}}
</style>

<script type="application/json" id="bank">[{"id":"3bad409b758b9c31","type":"单选题","number":1,"question":"“药以治病，因毒为能”，此毒是指","answer":"B","options":[["A","A．药物对机体的伤害性"],["B","B．药物的偏性"],["C","C．疮疡肿毒"],["D","D．药物统称"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 1 题（据《中药学小结》核对）","explanation":"这里的“毒”指药物有寒热等偏性，可用这种偏性纠正病证的偏盛偏衰。题干中的“毒”含义比毒副作用更广。"},{"id":"91dfc04650b6cd09","type":"单选题","number":2,"question":"下列哪种方法可以增强药物的升浮之性？","answer":"C","options":[["A","A．醋炙"],["B","B．盐水炙"],["C","C．酒炙"],["D","D．炒炭"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 2 题（据《中药学小结》核对）","explanation":"酒性升散，酒炙可引药上行，增强升浮之性。盐炙常用于引药下行。"},{"id":"d47b08b0531c4710","type":"单选题","number":3,"question":"被称为“16世纪的百科全书”的本草著作是：","answer":"D","options":[["A","A．《本草经集注》"],["B","B．《新修本草》"],["C","C．《证类本草》"],["D","D．《本草纲目》"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 3 题（据《中药学小结》核对）","explanation":"《本草纲目》由李时珍编著，系统总结了明代以前的本草成就。"},{"id":"08f297efbbddf9e9","type":"单选题","number":4,"question":"下列哪项不是甘味药的作用","answer":"C","options":[["A","A．缓急止痛"],["B","B．补虚"],["C","C．收涩"],["D","D．调和药性"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 4 题（据《中药学小结》核对）","explanation":"甘味的作用是能补、能和、能缓。收涩是酸味、涩味的共同特点。"},{"id":"84cd8493aacb33d4","type":"单选题","number":5,"question":"淡味的利湿作用是指","answer":"C","options":[["A","A．泄下通便以祛水湿痰饮"],["B","B．补脾以运化水湿"],["C","C．利小便以祛水湿痰饮"],["D","D．燥化水湿"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 5 题（据《中药学小结》核对）","explanation":"淡味“能渗、能利”，这里的利湿指通过利小便排出水湿。"},{"id":"44626f843ff6a0a4","type":"单选题","number":6,"question":"将药物炒焦的目的是","answer":"C","options":[["A","A．增强活血作用"],["B","B．降低毒性"],["C","C．增强止血作用"],["D","D．增强消食作用"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 6 题（据《中药学小结》核对）","explanation":"教材把炒炭和某些药物炒焦后的止血作用作为常见考点。第 6 题的“炒焦”措辞较宽，炮制目的还要结合具体药物判断。"},{"id":"6497105916115737","type":"单选题","number":7,"question":"为了加强药物的止血作用，可以选用的炮制方法是：","answer":"D","options":[["A","A．蜜炙"],["B","B．酒炒"],["C","C．醋炙"],["D","D．炒炭"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 8 题（据《中药学小结》核对）","explanation":"教材把炒炭和某些药物炒焦后的止血作用作为常见考点。第 6 题的“炒焦”措辞较宽，炮制目的还要结合具体药物判断。"},{"id":"82d6999e24d30610","type":"单选题","number":8,"question":"苦味坚阴的含义是指","answer":"C","options":[["A","A．苦味可以养阴"],["B","B．苦味可以收敛阴津"],["C","C．苦味可以泻火以保存阴津"],["D","D．苦味可以燥湿健脾以生津"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 9 题（据《中药学小结》核对）","explanation":"苦味“能泄、能燥、能坚”。坚阴指通过清泄火热保存阴津。"},{"id":"656ed4397fb1c7aa","type":"单选题","number":9,"question":"为了提取朱砂的细末，可采用何种炮制方法","answer":"B","options":[["A","A．火煅"],["B","B．水飞"],["C","C．淬法"],["D","D．机械粉碎"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 11 题（据《中药学小结》核对）","explanation":"水飞利用研磨及颗粒在水中沉降速度不同来分离极细粉，常用于朱砂等矿物药。"},{"id":"0e9cbeb9da2f8bb6","type":"单选题","number":10,"question":"苦味药与咸味药的共同作用是","answer":"B","options":[["A","A．清热"],["B","B．泻下"],["C","C．燥湿"],["D","D．行气"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 13 题（据《中药学小结》核对）","explanation":"苦味能通泄，咸味能软坚泻下，两者在泻下这一点上有交集。"},{"id":"c296702ba078dab5","type":"单选题","number":11,"question":"最早采用图文对照编写方法的本草著作是：（）","answer":"B","options":[["A","A．《神农本草经》"],["B","B．《新修本草》"],["C","C．《本草经集注》"],["D","D．《本草纲目》"],["E","E．《证类本草》"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 14 题（据《中药学小结》核对）","explanation":"《新修本草》也称《唐本草》，是唐代官修本草，采用药图与文字相配合的编写方式。"},{"id":"d6ad5f3e10e4774a","type":"单选题","number":12,"question":"酸味与涩味的共同功效是","answer":"B","options":[["A","A．生津"],["B","B．收敛"],["C","C．补虚"],["D","D．清泄"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 15 题（据《中药学小结》核对）","explanation":"酸和涩均可收敛固涩。酸味还可见生津作用，题目问的是共同功效。"},{"id":"cc0bc2fcf37a1cd4","type":"单选题","number":13,"question":"治疗筋脉拘急疼痛的药物多具有（）","answer":"B","options":[["A","A．辛味"],["B","B．甘味"],["C","C．酸味"],["D","D．苦味"],["E","E．咸味"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 16 题（据《中药学小结》核对）","explanation":"甘能缓，缓急止痛与题干的筋脉拘急相对应。"},{"id":"630ea34eb6427c54","type":"单选题","number":14,"question":"酸味药的作用包括","answer":"B","options":[["A","A．养阴生津"],["B","B．收敛固涩"],["C","C．补虚"],["D","D．行气活血"],["E","E．发散表邪"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 17 题（据《中药学小结》核对）","explanation":"酸味“能收、能涩”，常用这一作用记忆敛汗、敛肺和涩肠等功效。"},{"id":"d031c45fbb5d7d81","type":"单选题","number":15,"question":"现存最早的本草著作是：","answer":"B","options":[["A","A．《本草经集注》"],["B","B．《神农本草经》"],["C","C．《新修本草》"],["D","D．《证类本草》"]],"chapter":"中药总论与配伍","source":"2020级中药学习通选择题汇总 (1).pdf · 总论第 19 题（据《中药学小结》核对）","explanation":"《神农本草经》早于《本草经集注》《新修本草》和《证类本草》。"},{"id":"12bcd318579fdfc9","type":"单选题","number":16,"question":"解表药多属（ ）味","answer":"A","options":[["A","A．辛"],["B","B．甘"],["C","C．苦"],["D","D．淡"]],"chapter":"解表药","source":"2020级中药学习通选择题汇总 (1).pdf · 解表药第 1 题","explanation":"辛能散。解表药以发散表邪为主，所以多具辛味。"},{"id":"8ddbabe553e876b5","type":"单选题","number":17,"question":"既能化湿行气，又能止泻及安胎的药物是（）","answer":"C","options":[["A","A．广藿香"],["B","B．佩兰"],["C","C．砂仁"],["D","D．豆蔻"],["E","E．草果"]],"chapter":"化湿药","source":"2020级中药学习通选择题汇总 (1).pdf · 化湿药第 1 题","explanation":"“化湿＋止泻＋安胎”三个线索同时指向砂仁，其中止泻与温脾相关。"},{"id":"47a7eb7e055be55c","type":"单选题","number":18,"question":"脾虚之水肿痰饮，最宜选用的药物是","answer":"B","options":[["A","A．麻黄"],["B","B．茯苓"],["C","C．车前子"],["D","D．木通"]],"chapter":"利水渗湿药","source":"2020级中药学习通选择题汇总 (1).pdf · 利水渗湿药第 1 题","explanation":"茯苓兼有利水渗湿和健脾两方面作用，对应题干的水湿与脾虚。"},{"id":"067dc2b98bb83f65","type":"单选题","number":19,"question":"具有回乳消胀功效的药物是","answer":"B","options":[["A","A．山楂"],["B","B．麦芽"],["C","C．神曲"],["D","D．木通"]],"chapter":"消食药","source":"2020级中药学习通选择题汇总 (1).pdf · 消食药第 1 题","explanation":"麦芽既能消食健胃，又有回乳消胀作用；“回乳”是本题的区分点。"},{"id":"8d484f5c2bc0b3f3","type":"单选题","number":20,"question":"既能收敛止血,又兼能补虚的药物是.","answer":"B","options":[["A","A．三七"],["B","B．仙鹤草"],["C","C．白及"],["D","D．炮姜"]],"chapter":"止血药","source":"2020级中药学习通选择题汇总 (1).pdf · 止血药第 1 题","explanation":"仙鹤草有收敛止血和补虚作用。三七偏于散瘀止血，白及偏于收敛止血、消肿生肌。"},{"id":"14100e863538aada","type":"单选题","number":21,"question":"功能行气活血止痛，善治“一身上下诸痛”的药物是","answer":"B","options":[["A","A．五灵脂"],["B","B．玄胡"],["C","C．姜黄"],["D","D．红花"]],"chapter":"活血药","source":"2020级中药学习通选择题汇总 (1).pdf · 活血药第 1 题","explanation":"玄胡是延胡索的别名。延胡索兼能活血和行气，所以常用来考气滞血瘀所致的疼痛。"},{"id":"ae5b35018941df45","type":"单选题","number":22,"question":"功能燥湿化痰，散结消痞，尤善治痞满的药物是","answer":"D","options":[["A","A．佛手"],["B","B．天南星"],["C","C．陈皮"],["D","D．半夏"]],"chapter":"化痰药","source":"2020级中药学习通选择题汇总 (1).pdf · 化痰药第 1 题","explanation":"半夏既能燥湿化痰，也能消痞散结；陈皮偏于理气健脾、燥湿化痰。"},{"id":"78a675eb4c1c68e6","type":"单选题","number":23,"question":"紫菀的功效为:","answer":"D","options":[["A","A．清肺化痰止咳"],["B","B．温肺化饮平喘"],["C","C．敛肺止咳平喘"],["D","D．润肺化痰止咳"]],"chapter":"止咳平喘药","source":"2020级中药学习通选择题汇总 (1).pdf · 止咳平喘药第 1 题","explanation":"紫菀的考点是润肺下气、化痰止咳，选项 D 最符合。"},{"id":"af5eb5d71853836a","type":"单选题","number":24,"question":"牡蛎与龙骨的共同功效是","answer":"D","options":[["A","A．平肝潜阳,祛风明目"],["B","B．平肝潜阳,清热利水"],["C","C．平肝潜阳,软坚散结"],["D","D．平肝潜阳,收敛固涩"]],"chapter":"平肝潜阳药","source":"2020级中药学习通选择题汇总 (1).pdf · 平肝潜阳药第 1 题","explanation":"龙骨和牡蛎均能平肝潜阳、收敛固涩。软坚散结是牡蛎的特点。"},{"id":"288e5b4d162b68c1","type":"单选题","number":25,"question":"治疗惊风,痉挛抽搐，常与蜈蚣同用的药物是：","answer":"D","options":[["A","A．天麻"],["B","B．钩藤"],["C","C．地龙"],["D","D．全蝎"]],"chapter":"息风止痉药","source":"2020级中药学习通选择题汇总 (1).pdf · 息风止痉药第 1 题","explanation":"全蝎与蜈蚣均有息风止痉、通络止痛作用，是资料中常见的配伍。"},{"id":"a91d3e3f9495a4ec","type":"单选题","number":26,"question":"既有芳香开窍，又具芳香化湿之效的药物是:","answer":"B","options":[["A","A．广藿香"],["B","B．石菖蒲"],["C","C．麝香"],["D","D．砂仁"]],"chapter":"开窍药","source":"2020级中药学习通选择题汇总 (1).pdf · 开窍药第 1 题","explanation":"石菖蒲兼有开窍豁痰和化湿开胃之功；麝香擅长开窍醒神。"},{"id":"c9ddcf90d4d0d38b","type":"单选题","number":27,"question":"功能收敛止汗，用于自汗、盗汗的药物是","answer":"B","options":[["A","A．麻黄"],["B","B．麻黄根"],["C","C．莲子"],["D","D．肉豆蔻"]],"chapter":"收涩药","source":"2020级中药学习通选择题汇总 (1).pdf · 收涩药第 1 题","explanation":"麻黄根能收敛止汗；药用茎麻黄的代表功效是发汗解表。"},{"id":"c7e7f819409d5cdf","type":"名词解释","number":1,"question":"中药","answer":"是指在中医药理论指导下，用以预防、诊断和治疗疾病及康复保健的部分天然物质。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"2075c1fbdea63651","type":"名词解释","number":2,"question":"中药学","answer":"是研究中药的基本理论和中药来源、产地、采集、炮制、性能、功效及临床应用等一切与中药有关知识的一门学科。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"a15bc14c380d4332","type":"名词解释","number":3,"question":"相须","answer":"两种性能功效相类似的药物配合应用，能增强或提高原有药物的治疗作用。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"7a8ebce886c35612","type":"名词解释","number":4,"question":"相使","answer":"一药为主，另一药为辅，辅药能增强或提高主药的治疗作用。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"cd9b5ce273dbcb8f","type":"名词解释","number":5,"question":"相畏","answer":"一种药物的毒性或副作用能被另一种药物减轻或消除。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"bbe49cfc6e75deb4","type":"名词解释","number":6,"question":"相杀","answer":"一种药物能够减轻或消除另一种药物的毒性或副作用。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"c83f21057dc85f74","type":"名词解释","number":7,"question":"道地药材","answer":"产地适宜，品种优良，疗效突出，带有地域特点","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"acfcf0a4c5da5c61","type":"名词解释","number":8,"question":"炮制","answer":"指药物在应用或制剂前必要的加工过程","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"84a63aa6d9b93edf","type":"名词解释","number":9,"question":"水 飞","answer":"将不溶于水的矿物或贝壳类药物置于水中，反复研磨，而分离制备极细粉末的方法","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"7c22f1852c082c4b","type":"名词解释","number":10,"question":"炙","answer":"将药物与液体辅料共同拌抄，使辅料逐渐渗入药物内部的方法。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"a78c04d9e574a910","type":"名词解释","number":11,"question":"归经","answer":"是指对机体某部分的选择性作用，即对某些脏腑经络有特殊的亲和作用，对这些部位的病变起着主要或特殊的治疗作用","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"1953c692b05110c0","type":"名词解释","number":12,"question":"解表药","answer":"发散表邪，治疗表证为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"00306dc50f7a7f4e","type":"名词解释","number":13,"question":"清热药","answer":"清解里热，治疗里热证为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"02ef0dac2cda1a7f","type":"名词解释","number":14,"question":"泻下药","answer":"泻下通便，治疗里实积滞证的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"aecdbb9789794c1f","type":"名词解释","number":15,"question":"祛风湿药","answer":"祛除风湿，治疗痹症为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"219013099a878503","type":"名词解释","number":16,"question":"化湿药","answer":"凡气味芳香，性偏温燥，以化湿运脾为主，治疗湿阻中焦证的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"51b4091757c9bda1","type":"名词解释","number":17,"question":"利水渗湿药","answer":"通利水道，渗泄水湿，治疗水湿内停为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"8a486d5fd1328907","type":"名词解释","number":18,"question":"温里药","answer":"温里祛寒，治疗里寒证为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"40b978ea7d0f5cc0","type":"名词解释","number":19,"question":"行气药","answer":"梳理气机，治疗气滞或气逆证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"e7c49eaf537ec3b3","type":"名词解释","number":20,"question":"消食药","answer":"消化食积，治疗饮食积滞证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"f779a6ebadc0de69","type":"名词解释","number":21,"question":"驱虫药","answer":"凡以驱除或杀灭人体寄生虫为主要作用，治疗虫证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"5ad7c09536e8f08e","type":"名词解释","number":22,"question":"止血药","answer":"凡以制止体内外出血为主要作用，治疗各种出血的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"d7b8c22f87fef3bb","type":"名词解释","number":23,"question":"活血化瘀药","answer":"凡以通畅血行，消散瘀血为主要作用，治疗瘀血证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"6380fc5d38b620ad","type":"名词解释","number":24,"question":"化痰药","answer":"凡能祛痰或消痰，治疗痰证为主的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"ee51419737a47346","type":"名词解释","number":25,"question":"止咳平喘药","answer":"凡能止咳平喘，治疗咳嗽，气喘的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"f775eb20561c43e7","type":"名词解释","number":26,"question":"安神药","answer":"凡能安神定志，治疗心神不宁证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"0e97629d10f8a0a8","type":"名词解释","number":27,"question":"平抑肝阳药","answer":"平肝潜阳或息风止痉，治疗肝阳上亢或肝风内动病症的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"7ef5e45f4a3e495f","type":"名词解释","number":28,"question":"息风止痉药","answer":"息风止痉，治疗肝风内动证","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"6ba02f9cfc209b10","type":"名词解释","number":29,"question":"开窍药","answer":"开窍醒神，治疗闭证神昏的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"7d3bf484615bb362","type":"名词解释","number":30,"question":"补虚药","answer":"补虚扶弱，纠正人体的气血阴阳不足，治疗各种虚证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"7b4011674114833f","type":"名词解释","number":31,"question":"收涩药","answer":"收敛固涩，用以治疗各种滑脱症为主的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"43d43821ed4026a1","type":"名词解释","number":32,"question":"涌吐药","answer":"促使呕吐，治疗毒物，宿食，痰涎等停滞在胃脘或胸膈以上所致病症为主的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"a644ff87ba3fe5c9","type":"名词解释","number":33,"question":"攻毒杀虫止痒药","answer":"攻毒疗疮，杀虫止痒，治疗痈肿疮毒，疥癣瘙痒为主的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"0441cbde1de19be8","type":"名词解释","number":34,"question":"拔毒化腐生肌药","answer":"拔毒化腐，生肌敛疮，治疗疮疡脓出不畅，或久溃不敛等病症的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"78bc438c85026904","type":"问答题","number":1,"question":"中药治病的基本作用是什么?","answer":"①祛除病邪，消除病因。②扶正固本。③协调脏腑经络机能。④纠正阴阳偏盛偏衰,达到阴平阳秘的正常状态。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 1"},{"id":"e10758cffac58ba7","type":"问答题","number":2,"question":"简述中药炮制的目的。","answer":"①减毒:即降低或消除药物的毒副作用,保证用药安全。\n  ②增效:即增强药物的作用,提高临床疗效。\n  ③改变性能:即改变药物的性能和功效，使之更能适应病情的需要。\n  ④改变性状:即改变药物的某些性状，便于贮存和制剂。\n  ⑤纯净药材:保证药材品质和用量准确。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 2"},{"id":"7fa3cc6dd5a20707","type":"问答题","number":3,"question":"药物的性能主要包括哪些内容?","answer":"即四气(寒、热、温、凉、平);五味(辛、甘、酸、苦、咸、涩、淡) ;升降浮沉、归经毒性。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 3"},{"id":"bc2a5aad87b1ab83","type":"问答题","number":4,"question":"举例说明中药苦味的作用。","answer":"中药的苦味是能泄能燥能坚阴。 \n  具体指的是清泄(热邪)，如栀子清热泻火;通泄(大便)，如大黄通导大便;降泄(肺、胃，肝之气上逆)，如杏仁止咳平喘。苦寒燥湿,如黄连清热燥湿;苦温燥湿，如苍术燥湿健脾，而\n坚阴指的是泻肾火存阴，如黄柏。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 4"},{"id":"faf1a1821844a7f2","type":"问答题","number":5,"question":"酸味药的作用有哪些，举例说明。","answer":"酸味具有\"能收能涩”的特点,即具有收敛、固涩的作用。\n酸味药多用治体虚多汗、肺虚久咳、久泻肠滑、遗精滑精、遗尿尿频、崩带不止等证。\n如五味子固表止汗,乌梅敛肺止咳、五倍子涩肠止泻、山菜萸涩精止遗等。\n  一般固表止汗、敛肺止咳涩肠止泻、固精缩尿、固崩止带的药物多具有酸味。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 5"},{"id":"c2975a1ec3ba3732","type":"问答题","number":6,"question":"淡味药有何作用，举例说明。","answer":"淡味药具有“能渗能利\"的特点，即具有渗湿、利小便的作用，谈味药多用治水肿、脚气小便不利之证，如薏苡仁、茯苓、猪苓等。\n  利水渗湿的药物多具有淡味。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 6"},{"id":"e23926becff087e8","type":"问答题","number":7,"question":"分别说明甘味药的作用,并举例说明。","answer":"甘味药具有“能补能和能缓”的作用，补即补益气血阴阳，如人参补气、熟地补血、麦冬补阴、杜仲补阳。和有和中，调和之意，如甘草调和药性并解药食中毒等，缓有缓急止痛\n之意,如饴糖缓急止痛。\n一般来讲，滋阳补虚，调和药性及制止疼痛的药物多具有甘味。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 7"},{"id":"ce7edc1a1e84dcdc","type":"问答题","number":8,"question":"咸味药能够治疗何种病证,举例说明。","answer":"咸味药具有“能下、能软”的作用，下:即泻下通便，如芒硝泻热通便;软即软坚散结,用治痰核、瘿瘤等证，如海藻、牡蛎、鳖甲软坚消癥等。\n  一般来讲,软化坚硬、消散结块的药物多具有咸味。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 8"},{"id":"8cc48a18da93dd82","type":"问答题","number":9,"question":"临床应如何区别性、味的关系?","answer":"中药的性指的四性,也称四气，即寒热温凉平，是说明药物性质的标识，任何一种药物的性都是单一的，或寒性，或温性。味指的是五味，即辛甘酸苦咸涩淡,一种药物的味道可以有多种,在应用性味理论时,性是主要的，味处于从属的地位。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 9"},{"id":"36c18c86728fff67","type":"问答题","number":10,"question":"药物的味道是如何判定的?","answer":"药物的味道来源有2种，一是通过人的味觉器官感知，如乌梅味酸;二是通过临床治疗的效果总结出来的,如石膏味辛甘,其实以口尝,石膏根本就不辛,但因为石膏善于清肺热，以辛入肺之说,故云石膏味辛。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 10"},{"id":"2835b33ed7cb1352","type":"问答题","number":11,"question":"辛味药具有哪些作用?分别举例说明。","answer":"辛味有能散、能行的作用。能发散风寒，如麻黄;发散风热，如薄荷;行气如木香\n行血如红花等作用。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 11"},{"id":"804112b5a9ca189b","type":"问答题","number":12,"question":"影响药物升降浮沉的因素有哪些?","answer":"①气味:性温热、味辛甘者，多升浮;性寒凉，味酸苦咸涩者多沉降。\n②质地:质轻者,如植物的花、叶、皮、枝，多升浮;质重者，如果实，矿物、贝壳等，多沉\n降。特殊情况，如旋覆花、番泻叶质轻主沉降;蔓荆子、苍耳子虽为果实主升浮。\n③炮制:酒炒则升,姜汁炒则散，醋炒则收敛，盐水炒则下行。\n④配伍:在复方中，性质升浮的药物，与较多的沉降性药物配伍时，其升浮之性可受到一定的制约。反之，性属沉降的药物与较多的升浮性质药物同用，则其沉降之性亦能受到一定程序的制约。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 12"},{"id":"657ea12f8d7faf2d","type":"问答题","number":13,"question":"何谓中药的“七情”?","answer":"前人将相须、相使、相畏、相杀、相恶、相反六种配伍关系以及单行，合称中药的七情。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 14"},{"id":"1516f0d2664b99a2","type":"问答题","number":14,"question":"中药配伍中的“相畏”与“十九畏”应如何区别?","answer":"相畏:是指应用毒药的配伍方法，一种药物的毒性、副作用能被另一种药物减轻或消除，如半夏畏生姜，也就说半夏的毒性被生姜减轻或消除。\n  十九畏:属于相反的配伍若同用后会加重药物对人体的伤害,属于配伍禁忌,如硫黄忌与朴硝配伍应用。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 15"},{"id":"e693a66daefdf3ad","type":"问答题","number":15,"question":"应用活血祛瘀药时常配伍何类药同用?为什么?","answer":"应用活血祛瘀药常配行气药同用，因为气行则血行，气滞则血瘀，行气药可加强活血药的作用。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 17"},{"id":"7dece93c363db1a4","type":"问答题","number":16,"question":"大量应用凉血止血药时常须配伍何类药同用?为什么?","answer":"大量应用凉血止血药时，常须配伍活血药同用，以防止血留瘀。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 18"},{"id":"1de9d02120a54d95","type":"问答题","number":17,"question":"根据“阴阳互根”之理,在应用补阳，补阴药时应分别辅以何类药?为什么?","answer":"应用补阳药时，宜配伍益精血的药;以相互配合，使“阳得阴助”,才能”生化无穷”。应用补阴药时，宜适当辅以补阳药，(使阴有所化;并可借阳药之通运，以制阴药之凝滞)。使“阴得阳生而源泉不竭”。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 19"},{"id":"df7deb4d006bc5cc","type":"问答题","number":18,"question":"应用化痰药时常配伍哪些药同用?为什么?","answer":"应用化痰药时常配健脾药同用，因为脾为生痰之源，健脾则能减少痰的生成，为治痰之本亦配行气药同用，因为气行则痰易化;故常配此两类药同用。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 20"},{"id":"f0024906d0359bf5","type":"问答题","number":19,"question":"应用收涩药时常配伍何类药同用?为什么?","answer":"应用收涩药常配补虚药同用，因为收涩药为滑脱证而设，偏治标，补虚药能治本，滑脱病证宜标本兼治,故配补虚药后能标本兼顾。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 21"},{"id":"da6e69cadc30bc7c","type":"问答题","number":20,"question":"应用退虚热药时常配何类药同用,为什么?","answer":"常配养阴药及清热凉血药同用。因引起虚热的原因主要为肝肾阴虚，虚火内扰所致,配养阴药同用，可以标本兼顾;另外温热病后期,邪热未尽，阴液已伤也可致虚热,此时单纯退虚热则邪热尚未尽，故配清热凉血药同用，既退虚热，又消实热。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 22"},{"id":"1ae60546a45e49cc","type":"问答题","number":21,"question":"应用补血药时，常配何类药同用,为什么?","answer":"常配补气药同用，因气能生血，配补气药同用，可加强补血之功。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 23"},{"id":"9092cbed5cc53c61","type":"功效速记","number":1,"question":"麻黄的主要功效是什么？","answer":"发汗解表，宣肺平喘，利水消肿。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 麻黄"},{"id":"31390dfe2d9a5baf","type":"功效速记","number":2,"question":"桂枝的主要功效是什么？","answer":"发汗解肌，温通经脉，助阳化气。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 桂枝"},{"id":"98af7f0b429c0ae6","type":"功效速记","number":3,"question":"紫苏的主要功效是什么？","answer":"解表散寒，行气宽中，解鱼蟹毒。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 紫苏"},{"id":"913fe6143b50d4f4","type":"功效速记","number":4,"question":"生姜的主要功效是什么？","answer":"解表散寒，温中止呕，温肺止咳。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 生姜"},{"id":"b537985d77ebb3e9","type":"功效速记","number":5,"question":"香薷的主要功效是什么？","answer":"发汗解表，化湿和中，利水消肿。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 香薷"},{"id":"71952bf8b2ae6de7","type":"功效速记","number":6,"question":"荆芥的主要功效是什么？","answer":"祛风解表，透疹，炒炭止血。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 荆芥"},{"id":"8bd7af21a86d9836","type":"功效速记","number":7,"question":"防风的主要功效是什么？","answer":"祛风解表，胜湿止痛，止痉。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 防风"},{"id":"52423c3a5551c560","type":"功效速记","number":8,"question":"羌活的主要功效是什么？","answer":"解表散寒，祛风胜湿，止痛。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 羌活"},{"id":"f519a08c9fcdbf02","type":"功效速记","number":9,"question":"白芷的主要功效是什么？","answer":"解表散寒，祛风止痛，宣通鼻窍，燥湿止带，消肿排脓。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 白芷"},{"id":"e4fcb5aade6148f1","type":"功效速记","number":10,"question":"细辛的主要功效是什么？","answer":"解表散寒，祛风止痛，通窍，温肺化饮。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 细辛"},{"id":"b56eb8c88d9541af","type":"功效速记","number":11,"question":"薄荷的主要功效是什么？","answer":"疏散风热，清利头目，利咽，透疹，疏肝行气。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 薄荷"},{"id":"7fe7e69ff32ae2fd","type":"功效速记","number":12,"question":"桑叶的主要功效是什么？","answer":"疏散风热，清肺润燥，平抑肝阳，清肝明目。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 桑叶"},{"id":"08065de1d3b39bd4","type":"功效速记","number":13,"question":"菊花的主要功效是什么？","answer":"疏散风热，平抑肝阳，清肝明目，清热解毒。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 菊花"},{"id":"a781db472da3157c","type":"功效速记","number":14,"question":"柴胡的主要功效是什么？","answer":"疏散退热，疏肝解郁，升举阳气。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 柴胡"},{"id":"1199897e33f43205","type":"功效速记","number":15,"question":"葛根的主要功效是什么？","answer":"解肌退热，透疹，生津止渴，升阳止泻。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 葛根"},{"id":"eaf68e2f8ec57da6","type":"功效速记","number":16,"question":"石膏的主要功效是什么？","answer":"生用清热泻火，除烦止渴；煅用收湿、生肌、敛疮、止血。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 石膏"},{"id":"eb30cfb453a87934","type":"功效速记","number":17,"question":"知母的主要功效是什么？","answer":"清热泻火，滋阴润燥。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 知母"},{"id":"e9b54d1a47f74f00","type":"功效速记","number":18,"question":"栀子的主要功效是什么？","answer":"泻火除烦，清热利湿，凉血解毒。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 栀子"},{"id":"6b4144f6abcd957e","type":"功效速记","number":19,"question":"黄芩的主要功效是什么？","answer":"清热燥湿，泻火解毒，止血，安胎。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 黄芩"},{"id":"68641ab7a60c7918","type":"功效速记","number":20,"question":"黄连的主要功效是什么？","answer":"清热燥湿，泻火解毒。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 黄连"},{"id":"db895b77e4ddbced","type":"功效速记","number":21,"question":"黄柏的主要功效是什么？","answer":"清热燥湿，泻火解毒，退虚热。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 黄柏"},{"id":"28175f7ca6058495","type":"功效速记","number":22,"question":"金银花的主要功效是什么？","answer":"清热解毒，疏散风热。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 金银花"},{"id":"23f1abca721c1cb0","type":"功效速记","number":23,"question":"连翘的主要功效是什么？","answer":"清热解毒，消肿散结，疏散风热。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 连翘"},{"id":"098dfa19b149f846","type":"功效速记","number":24,"question":"板蓝根的主要功效是什么？","answer":"清热解毒，凉血，利咽。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 板蓝根"},{"id":"8d31d3da02bdab44","type":"功效速记","number":25,"question":"生地黄的主要功效是什么？","answer":"清热凉血，养阴生津。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 生地黄"},{"id":"61188f40c01aaae4","type":"功效速记","number":26,"question":"牡丹皮的主要功效是什么？","answer":"清热凉血，活血祛瘀。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 牡丹皮"},{"id":"83064a465718a179","type":"功效速记","number":27,"question":"赤芍的主要功效是什么？","answer":"清热凉血，散瘀止痛。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 赤芍"},{"id":"215093b39f1ee7ed","type":"功效速记","number":28,"question":"青蒿的主要功效是什么？","answer":"清虚热，除骨蒸，解暑热，截疟。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 青蒿"},{"id":"f430ae6a5075c1a7","type":"功效速记","number":29,"question":"大黄的主要功效是什么？","answer":"泻下攻积，清热泻火，凉血解毒，逐瘀通经，利湿退黄。","options":[],"chapter":"泻下药","source":"最全中药学笔记20页BD (1).doc · 大黄"},{"id":"32515fd489e35e13","type":"功效速记","number":30,"question":"芒硝的主要功效是什么？","answer":"泻下通便，润燥软坚，清火消肿。","options":[],"chapter":"泻下药","source":"最全中药学笔记20页BD (1).doc · 芒硝"},{"id":"6057cb16303ce20a","type":"功效速记","number":31,"question":"火麻仁的主要功效是什么？","answer":"润肠通便。","options":[],"chapter":"泻下药","source":"最全中药学笔记20页BD (1).doc · 火麻仁"},{"id":"30c0ada2fc64b2d7","type":"功效速记","number":32,"question":"独活的主要功效是什么？","answer":"祛风湿，止痛，解表。","options":[],"chapter":"祛风湿药","source":"最全中药学笔记20页BD (1).doc · 独活"},{"id":"ce0e116a9b59040a","type":"功效速记","number":33,"question":"秦艽的主要功效是什么？","answer":"祛风湿，通络止痛，退虚热，清湿热。","options":[],"chapter":"祛风湿药","source":"最全中药学笔记20页BD (1).doc · 秦艽"},{"id":"f95040686559137e","type":"功效速记","number":34,"question":"桑寄生的主要功效是什么？","answer":"祛风湿，补肝肾，强筋骨，安胎。","options":[],"chapter":"祛风湿药","source":"最全中药学笔记20页BD (1).doc · 桑寄生"},{"id":"ec4336f1dfde80e6","type":"功效速记","number":35,"question":"藿香的主要功效是什么？","answer":"化湿，止呕，解暑。","options":[],"chapter":"化湿药","source":"最全中药学笔记20页BD (1).doc · 藿香"},{"id":"71970f203732caf0","type":"功效速记","number":36,"question":"苍术的主要功效是什么？","answer":"燥湿健脾，祛风散寒，明目。","options":[],"chapter":"化湿药","source":"最全中药学笔记20页BD (1).doc · 苍术"},{"id":"5153045d74353f0a","type":"功效速记","number":37,"question":"厚朴的主要功效是什么？","answer":"燥湿消痰，下气除满。","options":[],"chapter":"化湿药","source":"最全中药学笔记20页BD (1).doc · 厚朴"},{"id":"f88b0a636d7ab2bb","type":"功效速记","number":38,"question":"砂仁的主要功效是什么？","answer":"化湿开胃，温脾止泻，理气安胎。","options":[],"chapter":"化湿药","source":"最全中药学笔记20页BD (1).doc · 砂仁"},{"id":"03ffb3cf6c62cc03","type":"功效速记","number":39,"question":"茯苓的主要功效是什么？","answer":"利水渗湿，健脾，宁心。","options":[],"chapter":"利水渗湿药","source":"最全中药学笔记20页BD (1).doc · 茯苓"},{"id":"a8f66114ea8a21c3","type":"功效速记","number":40,"question":"泽泻的主要功效是什么？","answer":"利水渗湿，泄热。","options":[],"chapter":"利水渗湿药","source":"最全中药学笔记20页BD (1).doc · 泽泻"},{"id":"02ff80506f66fbcc","type":"功效速记","number":41,"question":"薏苡仁的主要功效是什么？","answer":"利水渗湿，健脾止泻，除痹，排脓。","options":[],"chapter":"利水渗湿药","source":"最全中药学笔记20页BD (1).doc · 薏苡仁"},{"id":"8afe6675345f3b87","type":"功效速记","number":42,"question":"车前子的主要功效是什么？","answer":"利尿通淋，渗湿止泻，明目，祛痰。","options":[],"chapter":"利水渗湿药","source":"最全中药学笔记20页BD (1).doc · 车前子"},{"id":"3eb34661b15d08bc","type":"功效速记","number":43,"question":"附子的主要功效是什么？","answer":"回阳救逆，补火助阳，散寒止痛。","options":[],"chapter":"温里药","source":"最全中药学笔记20页BD (1).doc · 附子"},{"id":"54f700c1ed8a7005","type":"功效速记","numb 涩肠，生津，安蛔。","options":[],"chapter":"收涩药","source":"最全中药学笔记20页BD (1).doc · 乌梅"},{"id":"tcm-final-review-001","number":162,"chapter":"中药总论与配伍","question":"哪部本草由陶弘景编撰，并按药物自然属性分类？","source":"《中药学期末复习讲义》PDF 第 2 页","type":"单选题","answer":"B","options":[["A","A．《证类本草》"],["B","B．《本草经集注》"],["C","C．《雷公炮炙论》"],["D","D．《本草纲目拾遗》"]],"explanation":"《本草经集注》为南朝陶弘景所编，讲义记载收药730种。"},{"id":"tcm-final-review-002","number":163,"chapter":"中药总论与配伍","question":"哪部著作是宋代唐慎微编撰、方药兼收的本草？","source":"《中药学期末复习讲义》PDF 第 2 页","type":"单选题","answer":"C","options":[["A","A．《新修本草》"],["B","B．《本草纲目》"],["C","C．《证类本草》"],["D","D．《神农本草经》"]],"explanation":"唐慎微的《证类本草》成于宋代。"},{"id":"tcm-final-review-003","number":164,"chapter":"中药总论与配伍","question":"按讲义举例，下列哪组均为四川道地药材？","source":"《中药学期末复习讲义》PDF 第 3 页","type":"单选题","answer":"A","options":[["A","A．附子、川芎"],["B","B．桑叶、枳实"],["C","C．黄连、五味子"],["D","D．人参、车前子"]],"explanation":"讲义以四川附子和川芎作为产区配对示例。"},{"id":"tcm-final-review-004","number":165,"chapter":"中药总论与配伍","question":"下列哪味药的采收考点是霜后采叶？","source":"《中药学期末复习讲义》PDF 第 3 页","type":"单选题","answer":"D","options":[["A","A．薄荷"],["B","B．紫苏叶"],["C","C．藿香"],["D","D．桑叶"]],"explanation":"桑叶是讲义列出的叶类药材特殊采收时机之一。"},{"id":"tcm-final-review-005","number":166,"chapter":"中药总论与配伍","question":"蜜炙百部增强润肺止咳，主要体现炮制的什么目的？","source":"《中药学期末复习讲义》PDF 第 3 页","type":"单选题","answer":"B","options":[["A","A．改变药材的自然产地"],["B","B．增强原有功效"],["C","C．降低贮藏温度"],["D","D．分取极细粉末"]],"explanation":"蜜炙百部是炮制增效的例子。分取极细粉末对应水飞。"},{"id":"tcm-final-review-006","number":167,"chapter":"中药总论与配伍","question":"旋覆花虽为花类而作用趋降，哪项功效最能说明这一点？","source":"《中药学期末复习讲义》PDF 第 4 页","type":"单选题","answer":"C","options":[["A","A．升阳举陷"],["B","B．发散解表"],["C","C．降气止呕"],["D","D．透疹止痒"]],"explanation":"旋覆花能降气止呕，是按质地推断升降浮沉时常考的例外。"},{"id":"tcm-final-review-007","number":168,"chapter":"中药总论与配伍","question":"下列哪组药物与特殊煎服用法配对正确？","source":"《中药学期末复习讲义》PDF 第 6 页","type":"单选题","answer":"A","options":[["A","A．车前子—包煎"],["B","B．阿胶—后下"],["C","C．人参—包煎"],["D","D．砂仁—另煎"]],"explanation":"车前子包煎，阿胶烊化，人参另煎，砂仁后下。"},{"id":"tcm-final-review-008","number":169,"chapter":"中药总论与配伍","question":"下列哪味是讲义列出的矿物类先煎例子？","source":"《中药学期末复习讲义》PDF 第 6 页","type":"单选题","answer":"D","options":[["A","A．薄荷"],["B","B．钩藤"],["C","C．砂仁"],["D","D．磁石"]],"explanation":"磁石常考先煎。薄荷、钩藤、砂仁常考后下。"},{"id":"tcm-final-review-009","number":170,"chapter":"解表药","question":"题干为风寒表虚、有汗，麻黄和桂枝中应优先辨认哪味？","source":"《中药学期末复习讲义》PDF 第 22 页","type":"单选题","answer":"B","options":[["A","A．麻黄"],["B","B．桂枝"],["C","C．柴胡"],["D","D．桑叶"]],"explanation":"桂枝对应风寒表虚有汗，麻黄对应风寒表实无汗。"},{"id":"tcm-final-review-010","number":171,"chapter":"清热药","question":"既能清肝明目，又能润肠通便的是哪味药？","source":"《中药学期末复习讲义》PDF 第 8 页","type":"单选题","answer":"C","options":[["A","A．夏枯草"],["B","B．淡竹叶"],["C","C．决明子"],["D","D．栀子"]],"explanation":"决明子兼润肠。夏枯草的鉴别点是散结消肿。"},{"id":"tcm-final-review-011","number":172,"chapter":"清热药","question":"兼见肺热咳嗽与胎热不安，哪味药最符合讲义的辨药线索？","source":"《中药学期末复习讲义》PDF 第 8 页","type":"单选题","answer":"A","options":[["A","A．黄芩"],["B","B．黄连"],["C","C．黄柏"],["D","D．龙胆"]],"explanation":"黄芩兼能止血和安胎，肺热与胎热是它的常考线索。"},{"id":"tcm-final-review-012","number":173,"chapter":"清热药","question":"同属清热燥湿药，哪味偏下焦湿热并能泻火除蒸？","source":"《中药学期末复习讲义》PDF 第 8 页","type":"单选题","answer":"D","options":[["A","A．黄芩"],["B","B．黄连"],["C","C．苦参"],["D","D．黄柏"]],"explanation":"黄柏的辨识点是下焦湿热与阴虚火旺所致骨蒸。"},{"id":"tcm-final-review-013","number":174,"chapter":"清热药","question":"清热泻火之外，哪味药兼滋阴润燥？","source":"《中药学期末复习讲义》PDF 第 8 页","type":"单选题","answer":"B","options":[["A","A．石膏"],["B","B．知母"],["C","C．淡竹叶"],["D","D．栀子"]],"explanation":"知母兼滋阴润燥。生石膏偏于清气分及肺胃实热。"},{"id":"tcm-final-review-014","number":175,"chapter":"泻下药","question":"哪味药兼有润燥软坚作用，常以实热燥屎内结作为辨认线索？","source":"《中药学期末复习讲义》PDF 第 10 页","type":"单选题","answer":"C","options":[["A","A．火麻仁"],["B","B．郁李仁"],["C","C．芒硝"],["D","D．番泻叶"]],"explanation":"芒硝既泻下又润燥软坚。火麻仁和郁李仁属润下药。"},{"id":"tcm-final-review-015","number":176,"chapter":"泻下药","question":"下列哪味润下药兼有利水消肿的功效？","source":"《中药学期末复习讲义》PDF 第 10 页","type":"单选题","answer":"A","options":[["A","A．郁李仁"],["B","B．火麻仁"],["C","C．番泻叶"],["D","D．芒硝"]],"explanation":"郁李仁润肠通便兼利水消肿，火麻仁常联系津血亏虚的肠燥。"},{"id":"tcm-final-review-016","number":177,"chapter":"祛风湿药","question":"比较羌活和独活，哪味偏用于下半身风寒湿痹？","source":"《中药学期末复习讲义》PDF 第 10 页","type":"单选题","answer":"D","options":[["A","A．羌活"],["B","B．秦艽"],["C","C．防己"],["D","D．独活"]],"explanation":"讲义以羌活偏上、独活偏下作为辨析线索。"},{"id":"tcm-final-review-017","number":178,"chapter":"祛风湿药","question":"湿痹拘挛或吐泻转筋，哪味药的鉴别功效是舒筋活络、和胃化湿？","source":"《中药学期末复习讲义》PDF 第 10 页","type":"单选题","answer":"B","options":[["A","A．防己"],["B","B．木瓜"],["C","C．桑寄生"],["D","D．威灵仙"]],"explanation":"木瓜以舒筋活络与和胃化湿两项功效相联系。"},{"id":"tcm-final-review-018","number":179,"chapter":"温里药","question":"哪味药兼能温中散寒、温肺化饮？","source":"《中药学期末复习讲义》PDF 第 12 页","type":"单选题","answer":"C","options":[["A","A．生姜"],["B","B．炮姜"],["C","C．干姜"],["D","D．桂枝"]],"explanation":"干姜兼温肺化饮，生姜偏解表和温中止呕，炮姜偏温经止血。"},{"id":"tcm-final-review-019","number":180,"chapter":"温里药","question":"哪味药以补火助阳、引火归元为辨认线索？","source":"《中药学期末复习讲义》PDF 第 12 页","type":"单选题","answer":"A","options":[["A","A．肉桂"],["B","B．桂枝"],["C","C．小茴香"],["D","D．干姜"]],"explanation":"肉桂偏温里补火。桂枝偏解表与通阳化气。"},{"id":"tcm-final-review-020","number":181,"chapter":"理气药","question":"理气药中，哪味以通阳散结、行气导滞为特点，常联系胸痹？","source":"《中药学期末复习讲义》PDF 第 12 页","type":"单选题","answer":"D","options":[["A","A．香附"],["B","B．木香"],["C","C．枳实"],["D","D．薤白"]],"explanation":"薤白的标志性功效是通阳散结。"},{"id":"tcm-final-review-021","number":182,"chapter":"理气药","question":"陈皮偏理气健脾，哪味药与之相比更偏疏肝破气、消积化滞？","source":"《中药学期末复习讲义》PDF 第 12 页","type":"单选题","answer":"B","options":[["A","A．沉香"],["B","B．青皮"],["C","C．佛手"],["D","D．薤白"]],"explanation":"青皮作用偏强，辨认线索是肝郁气滞与食积。"},{"id":"tcm-final-review-022","number":183,"chapter":"止血药","question":"讲义用哪味药作为血热尿血的代表药？","source":"《中药学期末复习讲义》PDF 第 22 页","type":"单选题","answer":"C","options":[["A","A．白及"],["B","B．艾叶"],["C","C．小蓟"],["D","D．三七"]],"explanation":"小蓟偏血热尿血，白及、艾叶、三七分别联系肺胃出血、虚寒崩漏、出血兼瘀。"},{"id":"tcm-final-review-023","number":184,"chapter":"化痰止咳平喘药","question":"在两味均可燥湿化痰的药中，哪味兼祛风止痉？","source":"《中药学期末复习讲义》PDF 第 15 页","type":"单选题","answer":"A","options":[["A","A．天南星"],["B","B．半夏"],["C","C．竹茹"],["D","D．川贝母"]],"explanation":"天南星兼祛风止痉。半夏兼降逆止呕、消痞散结。"},{"id":"tcm-final-review-024","number":185,"chapter":"化痰止咳平喘药","question":"与浙贝母相比，哪味贝母更偏肺热燥咳或虚劳咳嗽？","source":"《中药学期末复习讲义》PDF 第 15 页","type":"单选题","answer":"D","options":[["A","A．浙贝母"],["B","B．桔梗"],["C","C．瓜蒌"],["D","D．川贝母"]],"explanation":"川贝母偏润肺。浙贝母偏痰热及痰火郁结。"},{"id":"tcm-final-review-025","number":186,"chapter":"化痰止咳平喘药","question":"痰热兼烦闷、呕吐，哪味药有清热化痰、除烦止呕之功？","source":"《中药学期末复习讲义》PDF 第 15 页","type":"单选题","answer":"B","options":[["A","A．旋覆花"],["B","B．竹茹"],["C","C．桔梗"],["D","D．白芥子"]],"explanation":"竹茹的辨识点是痰热或胃热所致的呕吐。"},{"id":"tcm-final-review-026","number":187,"chapter":"化痰止咳平喘药","question":"相较桑白皮，哪味更偏痰涎壅盛、喘不得卧并见水肿？","source":"《中药学期末复习讲义》PDF 第 15 页","type":"单选题","answer":"C","options":[["A","A．桑白皮"],["B","B．紫菀"],["C","C．葶苈子"],["D","D．百部"]],"explanation":"两者均泻肺平喘、利水消肿。桑白皮偏肺热，葶苈子偏痰涎壅盛。"},{"id":"tcm-final-review-027","number":188,"chapter":"补虚药","question":"气阴两伤兼热，哪味参类药以补气养阴、清热生津为辨识点？","source":"《中药学期末复习讲义》PDF 第 17 页","type":"单选题","answer":"A","options":[["A","A．西洋参"],["B","B．人参"],["C","C．党参"],["D","D．沙参"]],"explanation":"西洋参兼气阴双补和清热。人参常考大补元气，党参常考健脾益肺。"},{"id":"tcm-final-review-028","number":189,"chapter":"补虚药","question":"杜仲和续断均补肝肾、强筋骨、安胎，其中哪味另重续伤？","source":"《中药学期末复习讲义》PDF 第 17 页","type":"单选题","answer":"D","options":[["A","A．杜仲"],["B","B．补骨脂"],["C","C．山药"],["D","D．续断"]],"explanation":"续伤是续断与杜仲的辨析点。"},{"id":"tcm-final-review-029","number":190,"chapter":"补虚药","question":"哪味兼有补血滋阴、益精填髓之功？","source":"《中药学期末复习讲义》PDF 第 17 页","type":"单选题","answer":"B","options":[["A","A．白芍"],["B","B．熟地黄"],["C","C．阿胶"],["D","D．当归"]],"explanation":"熟地黄以益精填髓为鉴别点。"},{"id":"tcm-final-review-030","number":191,"chapter":"收涩药","question":"久泻兼咽哑，哪味药在涩肠之外还兼降火利咽？","source":"《中药学期末复习讲义》PDF 第 18 页","type":"单选题","answer":"C","options":[["A","A．乌梅"],["B","B．五味子"],["C","C．诃子"],["D","D．芡实"]],"explanation":"诃子兼降火利咽，乌梅的鉴别点是生津和安蛔。"},{"id":"tcm-final-review-031","number":192,"chapter":"收涩药","question":"下列哪味收涩药既补脾止泻、益肾固精，又能除湿止带？","source":"《中药学期末复习讲义》PDF 第 18 页","type":"单选题","answer":"A","options":[["A","A．芡实"],["B","B．莲子"],["C","C．山茱萸"],["D","D．浮小麦"]],"explanation":"芡实兼除湿止带。莲子兼养心安神。"},{"id":"tcm-final-review-032","number":193,"chapter":"涌吐药","question":"在传统功效分类中，哪味兼有涌吐痰涎和截疟的考点？","source":"《中药学期末复习讲义》PDF 第 18 页","type":"单选题","answer":"D","options":[["A","A．瓜蒂"],["B","B．炉甘石"],["C","C．蛇床子"],["D","D．常山"]],"explanation":"常山记涌吐痰涎、截疟。瓜蒂记涌吐痰食。"},{"id":"tcm-final-review-033","number":194,"chapter":"攻毒杀虫止痒药","question":"哪味药的辨析点是杀虫止痒之外兼温肾壮阳？","source":"《中药学期末复习讲义》PDF 第 18 页","type":"单选题","answer":"B","options":[["A","A．雄黄"],["B","B．蛇床子"],["C","C．红粉"],["D","D．炉甘石"]],"explanation":"蛇床子具燥湿祛风、杀虫止痒之功，兼温肾壮阳。"},{"id":"tcm-final-review-034","number":195,"chapter":"拔毒化腐生肌药","question":"讲义中哪味药兼具明目退翳和收湿敛疮两个考点？","source":"《中药学期末复习讲义》PDF 第 18 页","type":"单选题","answer":"C","options":[["A","A．红粉"],["B","B．硫黄"],["C","C．炉甘石"],["D","D．雄黄"]],"explanation":"炉甘石的辨析点为解毒明目退翳、收湿止痒敛疮。"},{"id":"tcm-final-review-035","number":196,"chapter":"化痰止咳平喘药","question":"按讲义的重点药性味归经表，半夏归哪组经？","source":"《中药学期末复习讲义》PDF 第 23 页","type":"单选题","answer":"A","options":[["A","A．脾、胃、肺"],["B","B．肺、胃、肾"],["C","C．肺、膀胱"],["D","D．肝、心、脾"]],"explanation":"半夏条目所列为脾、胃、肺经。"},{"id":"tcm-final-review-036","number":197,"chapter":"补虚药","question":"讲义所列人参、黄芪、当归中，哪味归肝、心、脾经？","source":"《中药学期末复习讲义》PDF 第 23 页","type":"单选题","answer":"D","options":[["A","A．人参"],["B","B．黄芪"],["C","C．三味均归这三经"],["D","D．当归"]],"explanation":"讲义记当归甘、辛，温，归肝、心、脾经。"},{"id":"tcm-final-review-037","number":198,"chapter":"中药总论与配伍","question":"简述四气的含义及其对选药的指导意义，各举一例。","source":"《中药学期末复习讲义》PDF 第 4 页","type":"问答题","answer":"四气指寒、热、温、凉。辨识证候的寒热，以药物的寒热偏性纠正其偏盛。例：石膏用来说明寒凉清热，干姜用来说明温热散寒。"},{"id":"tcm-final-review-038","number":199,"chapter":"期末综合辨析","question":"桂枝、延胡索、冰片、白芍、威灵仙都可用于止痛辨析。逐味写出止痛途径和一个代表性证候。","source":"《中药学期末复习讲义》PDF 第 19 页","type":"问答题","answer":"桂枝温通经脉，联系寒凝痹痛。延胡索活血行气，联系气滞血瘀痛。冰片清热止痛，联系热毒或火热咽痛。白芍养血柔肝、缓急，联系血虚或肝脾不和的挛急疼痛。威灵仙祛风湿、通络，联系风湿痹痛。"},{"id":"tcm-final-review-039","number":200,"chapter":"期末综合辨析","question":"比较木香、大黄、黄连、五味子、车前子的止泻思路。每味写出作用和对应证候。","source":"《中药学期末复习讲义》PDF 第 19 页","type":"问答题","answer":"木香行气调中，对应气滞泻痢兼里急后重。大黄泻下攻积，对应湿热泻痢初起兼积滞，体现通因通用。黄连清热燥湿，对应肠腑湿热泻痢。五味子收敛固涩，对应久泻滑脱。车前子利水渗湿，对应湿盛水样泄泻。"},{"id":"tcm-final-review-040","number":201,"chapter":"期末综合辨析","question":"比较葶苈子、麻黄、黄芪、泽泻、桂枝在水肿论述中的作用与对应证候。","source":"《中药学期末复习讲义》PDF 第 20 页","type":"问答题","answer":"葶苈子泻肺利水，对应痰涎壅盛、喘满兼水肿。麻黄宣肺利水，对应外邪束表的风水。黄芪补气利水，对应气虚水湿不运。泽泻利水渗湿，对应水湿内停、小便不利。桂枝温阳化气，对应阳气不化的水肿痰饮。"},{"id":"tcm-final-review-041","number":202,"chapter":"期末综合辨析","question":"用病机和功效区分香附、艾叶、益母草、白芍、当归在痛经论述中的考点。","source":"《中药学期末复习讲义》PDF 第 20 页","type":"问答题","answer":"香附疏肝理气，联系肝郁气滞。艾叶温经散寒，联系寒凝或虚寒。益母草活血调经，联系瘀血阻滞。白芍养血柔肝、缓急，联系血虚失养。 当归补血活血，联系血虚或血虚兼瘀。"},{"id":"tcm-final-review-042","number":203,"chapter":"期末综合辨析","question":"分别写出紫苏叶、黄芩、白术、杜仲、桑寄生的安胎辨析线索。","source":"《中药学期末复习讲义》PDF 第 20 页","type":"问答题","answer":"紫苏叶理气，对应气滞。黄芩清热，对应胎热。白术益气健脾，对应脾虚。杜仲补肝肾，对应肝肾亏虚。桑寄生补肝肾、养血，对应肝肾亏虚兼血虚。"},{"id":"tcm-final-review-043","number":204,"chapter":"期末综合辨析","question":"按讲义处方点评的考试口径，题干出现「附子、半夏、芍药、砂仁」且无特殊用法注记，应核对哪些考点？","source":"《中药学期末复习讲义》PDF 第 21 页","type":"问答题","answer":"核对附子是否写明炮制品名和先煎；半夏是否写明炮制品名；附子与半夏是否涉及课内配伍禁忌；芍药是否按题意明确白芍或赤芍；砂仁是否注明后下。按题目口径分点，实际卷面可能合并计分。"},{"id":"tcm-final-review-044","number":205,"chapter":"解表药","question":"麻黄的使用注意常考哪三类证候？请结合药性说明。","source":"《中药学期末复习讲义》PDF 第 21 页","type":"问答题","answer":"麻黄辛温，善发汗、宣肺。表虚自汗、阴虚盗汗及肺肾虚喘者慎用。"}]</script>

let storageFailed = false;
const panel = document.querySelector('#panel');
const types = ["全部题目", "单选题", "名词解释", "问答题", "功效速记"];
const reviews = ['模拟试卷', '错题集', '收藏'];
const inType = q => filter === '全部题目' || (filter === '错题集' ? results[q.id]?.wrong : filter === '收藏' ? results[q.id]?.star : q.type === filter);
const chapterSelect = document.querySelector('#chapter');
for (const chapter of ['全部章节', ...new Set(bank.map(q => q.chapter))]) {
  const option = node('option', chapter);
  option.value = chapter;
  chapterSelect.append(option);
}
const collection = q => (filter === '错题集' || chapterSelect.value === '全部章节' || q.chapter === chapterSelect.value) && inType(q);
chapterSelect.addEventListener('change', () => setFilter('全部题目'));
let queue = order.filter(id => collection(byId.get(id)));
document.querySelector('#total').textContent = '共 ' + bank.length + ' 题';

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text != null) element.textContent = text;
  if (className) element.className = className;
  return element;
}
function button(label, action, className) {
  const element = node('button', label, className);
  element.type = 'button';
  element.addEventListener('click', action);
  return element;
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({results, current})); }
  catch { storageFailed = true; }
}
function go(id, focus = false) {
  current = id;
  revealed = false;
  selected = '';
  assessment = undefined;
  save();
  if (id) window.queueStudyEvent?.({id, cursor: true});
  render();
  if (focus) panel.querySelector('h1')?.focus();
}
function setFilter(value) {
  if (value === '模拟试卷') {
    openExam();
    return;
  }
  if (value === '错题集') {
    openMistakes();
    return;
  }
  mistakeList = false;
  filter = value;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue.includes(current) ? current : queue[0], true);
}
function renderNav() {
  for (const [selector, labels] of [['#types', types], ['#review', reviews]]) {
    const nav = document.querySelector(selector);
    nav.replaceChildren();
    for (const label of labels) {
      const count = bank.filter(q => (label === '错题集' || chapterSelect.value === '全部章节' || q.chapter === chapterSelect.value) && (label === '全部题目' || q.type === label || (label === '错题集' && results[q.id]?.wrong) || (label === '收藏' && results[q.id]?.star))).length;
      const control = button(label, () => setFilter(label));
      if (label !== '模拟试卷') control.append(node('span', count));
      control.setAttribute('aria-current', String(label === filter));
      nav.append(control);
    }
  }
}
function record(q, changes) {
  results[q.id] = {...results[q.id], ...changes};
  save();
  window.queueStudyEvent?.({id: q.id, changes});
}
function update(focusId) {
  render();
  if (focusId) document.getElementById(focusId)?.focus();
}
function shuffle() {
  const shuffled = [...order];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  order = shuffled;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue[0], true);
}
function openMistakes() {
  filter = '错题集';
  mistakeList = true;
  render();
  panel.querySelector('h1')?.focus();
}

function renderMistakes() {
  const ids = order.filter(id => results[id]?.wrong);
  const header = node('div', null, 'review-head');
  const title = node('h1', '错题集');
  title.tabIndex = -1;
  header.append(title, node('div', '待重练 ' + ids.length + ' 题', 'quiet'));
  panel.append(header);
  if (!ids.length) {
    panel.append(node('p', '选择题答错或主观题标记为错题后，会显示在这里。', 'quiet'));
    return;
  }

  function retry(id) {
    mistakeList = false;
    queue = ids;
    go(id, true);
  }
  panel.append(button('开始重练', () => retry(ids[0]), 'primary'));
  const list = node('ul', null, 'review-list');
  for (const id of ids) {
    const q = byId.get(id);
    const entry = node('li');
    const open = button(null, () => retry(id));
    const wrongCount = results[id].wrongCount || 1;
    open.append(node('span', q.chapter + ' · ' + q.type + ' · 错 ' + wrongCount + ' 次', 'quiet'),
                node('span', q.question));
    entry.append(open);
    list.append(entry);
  }
  panel.append(list);
}

function recordAttempt(q, wrong) {
  const previous = results[q.id];
  const count = previous?.wrongCount || Number(Boolean(previous?.wrong));
  record(q, {done: true, wrong, wrongCount: count + Number(wrong), ...reviewPatch(q, wrong ? 'retry' : 'known')});
}

const examKey = storageKey + '-exam';
let exam = null;
try {
  const draft = JSON.parse(localStorage.getItem(examKey) || 'null');
  if (draft?.items?.length && draft.items.every(item => byId.has(item.id))) exam = draft;
} catch {}

const examDefaults = {
  '单选题': [20, 2],
  '填空题': [5, 2],
  '名词解释': [5, 4],
  '问答题': [types.includes('填空题') ? 3 : 4, 10],
  '功效速记': [0, 4],
};
const examPools = Object.fromEntries(types.slice(1).map(kind => [
  kind, bank.filter(q => q.type === kind && q.answer),
]));
let configuringExam = false;

function saveExam() {
  try { localStorage.setItem(examKey, JSON.stringify(exam)); }
  catch { storageFailed = true; }
}

function openExam() {
  filter = '模拟试卷';
  mistakeList = false;
  configuringExam = !exam;
  render();
  panel.querySelector('h1')?.focus();
}

function renderExam() {
  const title = node('h1', '模拟试卷');
  title.tabIndex = -1;
  panel.append(title);
  if (configuringExam) {
    renderExamSetup();
    return;
  }
  renderExamPaper();
  if (storageFailed) panel.append(node('p', '浏览器未允许保存试卷，本次作答仅在当前页面保留。', 'quiet'));
}

function renderExamSetup() {
  const form = node('form', null, 'exam-form');
  const countInputs = [];
  for (const kind of types.slice(1)) {
    const pool = examPools[kind];
    const [defaultCount, points] = examDefaults[kind];
    const label = node('label', null, 'exam-setting');
    label.append(node('span', kind + ' · 每题 ' + points + ' 分', 'exam-setting-name'));
    const input = node('input');
    input.type = 'number';
    input.min = '0';
    input.max = String(pool.length);
    input.step = '1';
    input.required = true;
    input.value = String(Math.min(defaultCount, pool.length));
    label.append(input, node('small', '可选 ' + pool.length + ' 题', 'quiet'));
    form.append(label);
    countInputs.push({kind, input, points});
  }
  const targeted = node('input');
  targeted.type = 'checkbox';
  const targetedLabel = node('label');
  targetedLabel.append(targeted, node('span', ' 优先练错题、模糊题和到期题'));
  form.append(targetedLabel);
  const total = node('p', null, 'exam-total');
  total.setAttribute('aria-live', 'polite');
  const submit = node('button', '生成试卷', 'primary');
  submit.type = 'submit';
  function summarize() {
    const count = countInputs.reduce((sum, row) => sum + Number(row.input.value), 0);
    const score = countInputs.reduce((sum, row) => sum + Number(row.input.value) * row.points, 0);
    total.textContent = '共 ' + count + ' 题，满分 ' + score + ' 分';
    submit.disabled = !count;
  }
  form.addEventListener('input', summarize);
  form.addEventListener('submit', event => {
    event.preventDefault();
    const items = [];
    for (const {kind, input, points} of countInputs) {
      const pool = chooseExamPool(kind, targeted.checked);
      const count = Number(input.value);
      if (!Number.isInteger(count) || count < 0 || count > pool.length) return;
      for (let i = 0; i < count; i++) {
        items.push({id:pool[i].id, points, response:'', score:null});
      }
    }
    if (!items.length) return;
    exam = {items, submitted:false};
    configuringExam = false;
    saveExam();
    render();
    panel.querySelector('h1')?.focus();
  });
  summarize();
  const actions = node('div', null, 'actions');
  actions.append(submit);
  if (exam) actions.append(button('返回当前试卷', () => {configuringExam = false; render();}));
  form.append(total, actions);
  panel.append(form);
}

function renderExamPaper() {
  const maximum = exam.items.reduce((sum, item) => sum + item.points, 0);
  const scoreStatus = node('p', null, 'exam-total');
  scoreStatus.setAttribute('aria-live', 'polite');
  const outstanding = node('p', null, 'quiet');
  function refreshScore() {
    if (exam.submitted) {
      const score = exam.items.reduce((sum, item) => sum + (item.score ?? 0), 0);
      const pending = exam.items.filter(item => item.score === null).length;
      scoreStatus.textContent = '已得 ' + score + ' / ' + maximum + ' 分';
      outstanding.textContent = pending ? '还有 ' + pending + ' 道主观题待自评。' : '评分完成。';
    } else {
      const answered = exam.items.filter(item => item.response.trim()).length;
      scoreStatus.textContent = '已作答 ' + answered + ' / ' + exam.items.length + ' 题 · 满分 ' + maximum + ' 分';
      outstanding.textContent = '交卷后显示答案和解析。';
    }
  }
  const header = node('div', null, 'exam-header');
  header.append(scoreStatus, outstanding);
  panel.append(header);
  refreshScore();

  let lastType;
  let section;
  for (const [index, item] of exam.items.entries()) {
    const q = byId.get(item.id);
    if (q.type !== lastType) {
      lastType = q.type;
      section = node('section', null, 'exam-section');
      section.append(node('h2', q.type + ' · 每题 ' + item.points + ' 分'));
      panel.append(section);
    }
    const card = node('fieldset', null, 'exam-question');
    card.append(node('legend', (index + 1) + '．' + q.question));
    if (q.options.length) {
      const options = node('div', null, 'exam-options');
      for (const [key, value] of q.options) {
        const label = node('label', null, 'exam-option');
        const input = node('input');
        input.type = 'radio';
        input.name = 'exam-q-' + index;
        input.value = key;
        input.checked = item.response === key;
        input.disabled = exam.submitted;
        input.addEventListener('change', () => {
          item.response = key;
          saveExam();
          refreshScore();
        });
        if (exam.submitted && key === q.answer) label.classList.add('correct');
        if (exam.submitted && key === item.response && key !== q.answer) label.classList.add('incorrect');
        label.append(input, node('span', value));
        options.append(label);
      }
      card.append(options);
    } else {
      const response = node('textarea');
      response.rows = q.type === '填空题' ? 2 : 4;
      response.value = item.response;
      response.readOnly = exam.submitted;
      response.placeholder = '输入你的答案';
      response.setAttribute('aria-label', '第 ' + (index + 1) + ' 题作答');
      response.addEventListener('input', () => {
        item.response = response.value;
        saveExam();
        refreshScore();
      });
      card.append(response);
    }
    if (exam.submitted) renderExamAnswer(card, item, q, index, refreshScore);
    section.append(card);
  }
  const foot = node('div', null, 'foot');
  if (exam.submitted) {
    foot.append(button('重新组卷', () => {
      configuringExam = true;
      render();
      panel.querySelector('h1')?.focus();
    }, 'primary'));
  } else {
    foot.append(button('交卷', () => {
      const unanswered = exam.items.filter(item => !item.response.trim()).length;
      if (unanswered && !window.confirm('还有 ' + unanswered + ' 题未作答。现在交卷吗？')) return;
      for (const item of exam.items) {
        const q = byId.get(item.id);
        if (q.options.length) {
          const correct = item.response === q.answer;
          item.score = correct ? item.points : 0;
          if (item.response) recordAttempt(q, !correct);
        } else if (!item.response.trim()) {
          item.score = 0;
        }
      }
      exam.submitted = true;
      saveExam();
      render();
      panel.querySelector('h1')?.focus();
    }, 'primary'));
    foot.append(button('重新组卷', () => {
      configuringExam = true;
      render();
      panel.querySelector('h1')?.focus();
    }));
  }
  panel.append(foot);
  panel.append(node('p', '键盘：← → 切题 · 空格看答案 · 数字键选答案', 'quiet shortcuts'));
}

function renderExamAnswer(card, item, q, index, refreshScore) {
  const answer = node('div', null, 'answer');
  const text = q.options.find(([key]) => key === q.answer)?.[1] || q.answer;
  answer.append(node('strong', '参考答案'), node('div', text));
  if (q.explanation) answer.append(node('div', q.explanation, 'explanation'));
  if (q.source) answer.append(node('div', '来源 · ' + q.source, 'quiet'));
  card.append(answer);
  if (q.options.length || !item.response.trim()) {
    card.append(node('p', '得分 ' + item.score + ' / ' + item.points, 'quiet'));
    return;
  }
  const label = node('label', null, 'actions');
  const select = node('select', null, 'jump');
  select.setAttribute('aria-label', '第 ' + (index + 1) + ' 题自评得分');
  const pending = node('option', '请选择得分');
  pending.value = '';
  pending.disabled = true;
  select.append(pending);
  for (let n = 0; n <= item.points; n++) {
    const option = node('option', n + ' 分');
    option.value = String(n);
    select.append(option);
  }
  select.value = item.score === null ? '' : String(item.score);
  select.addEventListener('change', () => {
    const firstScore = item.score === null;
    item.score = Number(select.value);
    const wrong = item.score < item.points;
    if (firstScore) recordAttempt(q, wrong);
    else record(q, {done:true, wrong});
    saveExam();
    refreshScore();
  });
  label.append(node('span', '自评（满分 ' + item.points + ' 分）'), select);
  card.append(label);
}

function render() {
  renderNav();
  showReviewSummary();
  panel.replaceChildren();
  if (filter === '模拟试卷') {
    renderExam();
    return;
  }
  if (mistakeList) {
    renderMistakes();
    return;
  }
  const q = byId.get(current);
  const index = queue.indexOf(current);
  if (!q || index < 0) {
    panel.append(node('h1', filter === '错题集' ? '暂无错题' : filter === '收藏' ? '暂无收藏' : '本章暂无该题型'));
    panel.append(button('返回全部题目', () => setFilter('全部题目'), 'primary'));
    return;
  }
  const meta = node('div', null, 'meta');
  const completed = queue.filter(id => results[id]?.done).length;
  meta.append(node('strong', q.chapter + ' · ' + q.type), node('span', '当前 ' + (index + 1) + ' / ' + queue.length + ' · 已练 ' + completed));
  const progress = node('progress');
  progress.max = queue.length;
  progress.value = completed;
  progress.setAttribute('aria-label', '已练习题数');
  const title = node('h1', q.question);
  title.tabIndex = -1;
  panel.append(meta, progress, title);
  if (!q.options.length && q.answer) panel.append(answerDraft(q));
  if (q.options.length) {
    const choices = node('div', null, 'choices');
    for (const [key, label] of q.options) {
      const control = button(label, () => {
        if (selected) return;
        selected = key;
        revealed = true;
        if (q.answer) assessment = key === q.answer ? 'known' : 'retry';
        if (q.answer) recordAttempt(q, key !== q.answer);
        update('choice-' + key);
      });
      control.id = 'choice-' + key;
      if (selected) control.setAttribute('aria-disabled', 'true');
      if (revealed && key === q.answer) control.className = 'good';
      else if (revealed && key === selected && q.answer) control.className = 'bad';
      choices.append(control);
    }
    panel.append(choices);
  }
  const actions = node('div', null, 'actions');
  const toggle = button(revealed ? '收起答案' : '查看答案', () => {
    revealed = !revealed;
    update('answer-toggle');
  }, 'primary');
  toggle.id = 'answer-toggle';
  toggle.setAttribute('aria-expanded', String(revealed));
  toggle.setAttribute('aria-controls', 'answer');
  const star = button(results[q.id]?.star ? '取消收藏' : '收藏本题', () => {
    record(q, {star:!results[q.id]?.star});
    update('star');
  });
  star.id = 'star';
  actions.append(toggle, star);
  panel.append(actions);
  const answer = node('div', null, 'answer');
  answer.id = 'answer';
  answer.hidden = !revealed;
  answer.setAttribute('aria-live', 'polite');
  if (revealed) {
    const heading = selected && q.answer ? (selected === q.answer ? '答对了' : '答错了') : q.reference ? '题目辨析' : q.options.length ? '参考答案' : '参考答案与要点';
    const answerText = q.options.find(([key]) => key === q.answer)?.[1] || q.reference || q.answer || '原表未提供答案';
    answer.append(node('strong', heading), node('div', answerText));
    if (q.note) answer.append(node('div', q.note));
    if (q.explanation) {
      const explanation = node('div', null, 'explanation');
      explanation.append(node('strong', '解析'), node('div', q.explanation));
      answer.append(explanation);
    }
    answer.append(node('div', '来源 · ' + q.source, 'quiet'));
  }
  panel.append(answer);
  if (revealed && (q.answer || q.reference)) {
    if (!q.options.length) {
      const checklist = answerChecklist(q, q.answer || q.reference);
      if (checklist) panel.append(checklist);
    }
    panel.append(confidenceControls(q));
  }
  const foot = node('div', null, 'foot');
  const previous = button('上一题', () => go(queue[index - 1], true));
  previous.id = "previous-question";
  previous.disabled = index === 0;
  const next = button('下一题', () => go(queue[index + 1], true));
  next.id = "next-question";
  next.disabled = index === queue.length - 1;
  const jump = node('select', null, 'jump');
  jump.setAttribute('aria-label', '跳到指定题目');
  queue.forEach((id, i) => {
    const item = byId.get(id);
    const option = node('option', '第 ' + (i + 1) + ' 题 · ' + item.type);
    option.value = id;
    jump.append(option);
  });
  jump.value = current;
  jump.addEventListener('change', () => go(jump.value, true));
  const paging = node('div', null, 'actions');
  paging.append(previous, jump, next);
  const secondary = filter === '错题集'
    ? button('返回错题集', openMistakes)
    : filter === reviewMode
      ? button('结束复习', () => setFilter('全部题目'))
      : button('随机排序', shuffle);
  foot.append(paging, secondary);
  panel.append(foot);
  if (filter === '错题集' && results[q.id]?.done && !results[q.id].wrong) {
    panel.append(node('p', '本题已掌握，已从待重练列表移除。', 'quiet'));
  }
  if (storageFailed) panel.append(node('p', '浏览器未允许本地存储，本次记录会在关闭后清除。', 'quiet'));
}
const day = 86400000;
const reviewMode = '今日复习';
const reviewDrafts = new Map();
const reviewChecks = new Map();
const relatedTopics = [
  /黄芩|黄连|黄柏/, /煎服|先煎|后下|包煎|另煎|烊化/, /止痛|痛经/, /止泻|泄泻/,
  /补体|C3转化酶/, /MHC|HLA|抗原提呈/, /超敏反应/, /ELISA/, /Ig[GAMED]|免疫球蛋白/
];
const confidenceLevels = [['不会', 'retry'], ['模糊／蒙对', 'unsure'], ['熟练', 'known']];

function dueDate(question) {
  const entry = results[question.id];
  return entry?.reviewDue || (entry?.wrong ? 1 : Infinity);
}

function reviewPlan(now = Date.now()) {
  const due = bank.filter(q => dueDate(q) <= now).sort((a,b) => dueDate(a) - dueDate(b));
  const chosen = due.slice(0, 8);
  const chapters = new Set(chosen.map(q => q.chapter));
  const fresh = bank.filter(q => !results[q.id]?.done && !chosen.includes(q) && (q.answer || q.reference));
  const topics = relatedTopics.filter(topic => chosen.some(q => topic.test(q.question)));
  const variants = fresh.filter(q => topics.some(topic => topic.test(q.question)));
  const nearby = fresh.filter(q => q.chapter && chapters.has(q.chapter));
  const extras = [...new Set([...variants, ...nearby, ...fresh])];
  const written = extras.find(q => q.type === '问答题');
  return [...new Set([...chosen, ...extras.slice(0, chosen.length ? 2 : 5), ...(written ? [written] : [])])];
}

function reviewPatch(q, level) {
  const streak = level === 'known' ? Math.min((results[q.id]?.reviewStreak || 0) + 1, 5) : 0;
  const interval = level === 'known' ? [1, 3, 7, 14, 30][streak - 1] : 1;
  return {confidence: level, reviewStreak: streak, reviewDue: Date.now() + interval * day};
}

function openToday() {
  filter = reviewMode;
  mistakeList = false;
  queue = reviewPlan().map(q => q.id);
  go(queue[0], true);
}

function showReviewSummary() {
  const due = bank.filter(q => dueDate(q) <= Date.now());
  const row = document.querySelector('#study-overview');
  row.replaceChildren();
  const info = node('div');
  info.append(node('strong', '今日复习'), node('span',
    due.length ? due.length + ' 道待复习' : '暂无到期题', 'quiet'));
  const start = button(filter === reviewMode ? '重新安排' : '开始复习', openToday, 'primary');
  row.append(info, start);
}

function confidenceControls(q) {
  const group = node('div', null, 'actions confidence');
  group.setAttribute('role', 'group');
  group.setAttribute('aria-label', '自评掌握程度');
  for (const [label, level] of confidenceLevels) {
    const control = button(label, () => {
      if (assessment === level) return;
      const wrong = level === 'retry';
      const count = results[q.id]?.wrongCount || Number(Boolean(results[q.id]?.wrong));
      assessment = level;
      record(q, {
        ...reviewPatch(q, level),
        ...(q.options.length ? {} : {done:true, wrong, wrongCount:count + Number(wrong)})
      });
      update(control.id);
    });
    control.id = 'confidence-' + level;
    control.setAttribute('aria-pressed', String(results[q.id]?.confidence === level));
    group.append(control);
  }
  return group;
}

function answerDraft(q) {
  const label = node('label', '先写要点，再对照答案', 'study-draft');
  const input = node('textarea');
  input.rows = 3;
  input.value = reviewDrafts.get(q.id) || '';
  input.addEventListener('input', () => reviewDrafts.set(q.id, input.value));
  label.append(input);
  return label;
}

function answerChecklist(q, text) {
  const points = text.split(/[。；;\n]+/).map(part => part.trim()).filter(Boolean);
  if (points.length < 2 || points.length > 12) return null;
  const fieldset = node('fieldset', null, 'study-checklist');
  fieldset.append(node('legend', '勾选你写到的要点'));
  if (!reviewChecks.has(q.id)) reviewChecks.set(q.id, new Set());
  const checked = reviewChecks.get(q.id);
  const status = node('div', null, 'quiet');
  status.setAttribute('role', 'status');
  const showCount = () => { status.textContent = '已写到 ' + checked.size + ' / ' + points.length + ' 点'; };
  points.forEach((point, index) => {
    const label = node('label');
    const box = node('input');
    box.type = 'checkbox';
    box.checked = checked.has(index);
    box.addEventListener('change', () => {
      if (box.checked) checked.add(index);
      else checked.delete(index);
      showCount();
    });
    label.append(box, node('span', point));
    fieldset.append(label);
  });
  showCount();
  fieldset.append(status);
  return fieldset;
}

function chooseExamPool(kind, targeted) {
  const pool = examPools[kind].map(question => ({question, tie:Math.random()}));
  if (!targeted) return pool.sort((a,b) => a.tie - b.tie).map(row => row.question);
  const priority = q => {
    const entry = results[q.id];
    return (entry?.wrong ? 4 : 0) + (entry?.confidence === 'unsure' ? 2 : 0) +
      (dueDate(q) <= Date.now() ? 1 : 0);
  };
  return pool.sort((a,b) => priority(b.question) - priority(a.question) || a.tie - b.tie).map(row => row.question);
}

document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.repeat || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest('input, textarea, select, a, summary, [contenteditable]') ||
      (event.key === ' ' && event.target.closest('button')) ||
      filter === '模拟试卷' || mistakeList || !panel.querySelector('#answer-toggle')) return;
  const shortcuts = {
    ArrowLeft: '#previous-question', ArrowRight: '#next-question', ' ': '#answer-toggle',
    '1': '#choice-A', '2': '#choice-B', '3': '#choice-C', '4': '#choice-D', '5': '#choice-E'
  };
  const target = shortcuts[event.key] && panel.querySelector(shortcuts[event.key]);
  if (!target || target.disabled || target.getAttribute('aria-disabled') === 'true') return;
  event.preventDefault();
  target.click();
});

render();
</script>
