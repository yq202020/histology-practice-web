:"既能化湿行气，又能止泻及安胎的药物是（）","answer":"C","options":[["A","A．广藿香"],["B","B．佩兰"],["C","C．砂仁"],["D","D．豆蔻"],["E","E．草果"]],"chapter":"化湿药","source":"2020级中药学习通选择题汇总 (1).pdf · 化湿药第 1 题"},{"id":"47a7eb7e055be55c","type":"单选题","number":18,"question":"脾虚之水肿痰饮，最宜选用的药物是","answer":"B","options":[["A","A．麻黄"],["B","B．茯苓"],["C","C．车前子"],["D","D．木通"]],"chapter":"利水渗湿药","source":"2020级中药学习通选择题汇总 (1).pdf · 利水渗湿药第 1 题"},{"id":"067dc2b98bb83f65","type":"单选题","number":19,"question":"具有回乳消胀功效的药物是","answer":"B","options":[["A","A．山楂"],["B","B．麦芽"],["C","C．神曲"],["D","D．木通"]],"chapter":"消食药","source":"2020级中药学习通选择题汇总 (1).pdf · 消食药第 1 题"},{"id":"8d484f5c2bc0b3f3","type":"单选题","number":20,"question":"既能收敛止血,又兼能补虚的药物是.","answer":"B","options":[["A","A．三七"],["B","B．仙鹤草"],["C","C．白及"],["D","D．炮姜"]],"chapter":"止血药","source":"2020级中药学习通选择题汇总 (1).pdf · 止血药第 1 题"},{"id":"14100e863538aada","type":"单选题","number":21,"question":"功能行气活血止痛，善治“一身上下诸痛”的药物是","answer":"B","options":[["A","A．五灵脂"],["B","B．玄胡"],["C","C．姜黄"],["D","D．红花"]],"chapter":"活血药","source":"2020级中药学习通选择题汇总 (1).pdf · 活血药第 1 题"},{"id":"ae5b35018941df45","type":"单选题","number":22,"question":"功能燥湿化痰，散结消痞，尤善治痞满的药物是","answer":"D","options":[["A","A．佛手"],["B","B．天南星"],["C","C．陈皮"],["D","D．半夏"]],"chapter":"化痰药","source":"2020级中药学习通选择题汇总 (1).pdf · 化痰药第 1 题"},{"id":"78a675eb4c1c68e6","type":"单选题","number":23,"question":"紫菀的功效为:","answer":"D","options":[["A","A．清肺化痰止咳"],["B","B．温肺化饮平喘"],["C","C．敛肺止咳平喘"],["D","D．润肺化痰止咳"]],"chapter":"止咳平喘药","source":"2020级中药学习通选择题汇总 (1).pdf · 止咳平喘药第 1 题"},{"id":"af5eb5d71853836a","type":"单选题","number":24,"question":"牡蛎与龙骨的共同功效是","answer":"D","options":[["A","A．平肝潜阳,祛风明目"],["B","B．平肝潜阳,清热利水"],["C","C．平肝潜阳,软坚散结"],["D","D．平肝潜阳,收敛固涩"]],"chapter":"平肝潜阳药","source":"2020级中药学习通选择题汇总 (1).pdf · 平肝潜阳药第 1 题"},{"id":"288e5b4d162b68c1","type":"单选题","number":25,"question":"治疗惊风,痉挛抽搐，常与蜈蚣同用的药物是：","answer":"D","options":[["A","A．天麻"],["B","B．钩藤"],["C","C．地龙"],["D","D．全蝎"]],"chapter":"息风止痉药","source":"2020级中药学习通选择题汇总 (1).pdf · 息风止痉药第 1 题"},{"id":"a91d3e3f9495a4ec","type":"单选题","number":26,"question":"既有芳香开窍，又具芳香化湿之效的药物是:","answer":"B","options":[["A","A．广藿香"],["B","B．石菖蒲"],["C","C．麝香"],["D","D．砂仁"]],"chapter":"开窍药","source":"2020级中药学习通选择题汇总 (1).pdf · 开窍药第 1 题"},{"id":"c9ddcf90d4d0d38b","type":"单选题","number":27,"question":"功能收敛止汗，用于自汗、盗汗的药物是","answer":"B","options":[["A","A．麻黄"],["B","B．麻黄根"],["C","C．莲子"],["D","D．肉豆蔻"]],"chapter":"收涩药","source":"2020级中药学习通选择题汇总 (1).pdf · 收涩药第 1 题"},{"id":"c7e7f819409d5cdf","type":"名词解释","number":1,"question":"中药","answer":"是指在中医药理论指导下，用以预防、诊断和治疗疾病及康复保健的部分天然物质。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"2075c1fbdea63651","type":"名词解释","number":2,"question":"中药学","answer":"是研究中药的基本理论和中药来源、产地、采集、炮制、性能、功效及临床应用等一切与中药有关知识的一门学科。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"a15bc14c380d4332","type":"名词解释","number":3,"question":"相须","answer":"两种性能功效相类似的药物配合应用，能增强或提高原有药物的治疗作用。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"7a8ebce886c35612","type":"名词解释","number":4,"question":"相使","answer":"一药为主，另一药为辅，辅药能增强或提高主药的治疗作用。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"cd9b5ce273dbcb8f","type":"名词解释","number":5,"question":"相畏","answer":"一种药物的毒性或副作用能被另一种药物减轻或消除。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"bbe49cfc6e75deb4","type":"名词解释","number":6,"question":"相杀","answer":"一种药物能够减轻或消除另一种药物的毒性或副作用。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"c83f21057dc85f74","type":"名词解释","number":7,"question":"道地药材","answer":"产地适宜，品种优良，疗效突出，带有地域特点","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"acfcf0a4c5da5c61","type":"名词解释","number":8,"question":"炮制","answer":"指药物在应用或制剂前必要的加工过程","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"84a63aa6d9b93edf","type":"名词解释","number":9,"question":"水 飞","answer":"将不溶于水的矿物或贝壳类药物置于水中，反复研磨，而分离制备极细粉末的方法","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"7c22f1852c082c4b","type":"名词解释","number":10,"question":"炙","answer":"将药物与液体辅料共同拌抄，使辅料逐渐渗入药物内部的方法。","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"a78c04d9e574a910","type":"名词解释","number":11,"question":"归经","answer":"是指对机体某部分的选择性作用，即对某些脏腑经络有特殊的亲和作用，对这些部位的病变起着主要或特殊的治疗作用","options":[],"chapter":"中药总论与配伍","source":"中药学重点归纳6页 (1).pdf"},{"id":"1953c692b05110c0","type":"名词解释","number":12,"question":"解表药","answer":"发散表邪，治疗表证为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"00306dc50f7a7f4e","type":"名词解释","number":13,"question":"清热药","answer":"清解里热，治疗里热证为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"02ef0dac2cda1a7f","type":"名词解释","number":14,"question":"泻下药","answer":"泻下通便，治疗里实积滞证的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"aecdbb9789794c1f","type":"名词解释","number":15,"question":"祛风湿药","answer":"祛除风湿，治疗痹症为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"219013099a878503","type":"名词解释","number":16,"question":"化湿药","answer":"凡气味芳香，性偏温燥，以化湿运脾为主，治疗湿阻中焦证的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"51b4091757c9bda1","type":"名词解释","number":17,"question":"利水渗湿药","answer":"通利水道，渗泄水湿，治疗水湿内停为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"8a486d5fd1328907","type":"名词解释","number":18,"question":"温里药","answer":"温里祛寒，治疗里寒证为主的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"40b978ea7d0f5cc0","type":"名词解释","number":19,"question":"行气药","answer":"梳理气机，治疗气滞或气逆证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"e7c49eaf537ec3b3","type":"名词解释","number":20,"question":"消食药","answer":"消化食积，治疗饮食积滞证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"f779a6ebadc0de69","type":"名词解释","number":21,"question":"驱虫药","answer":"凡以驱除或杀灭人体寄生虫为主要作用，治疗虫证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"5ad7c09536e8f08e","type":"名词解释","number":22,"question":"止血药","answer":"凡以制止体内外出血为主要作用，治疗各种出血的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"d7b8c22f87fef3bb","type":"名词解释","number":23,"question":"活血化瘀药","answer":"凡以通畅血行，消散瘀血为主要作用，治疗瘀血证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"6380fc5d38b620ad","type":"名词解释","number":24,"question":"化痰药","answer":"凡能祛痰或消痰，治疗痰证为主的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"ee51419737a47346","type":"名词解释","number":25,"question":"止咳平喘药","answer":"凡能止咳平喘，治疗咳嗽，气喘的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"f775eb20561c43e7","type":"名词解释","number":26,"question":"安神药","answer":"凡能安神定志，治疗心神不宁证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"0e97629d10f8a0a8","type":"名词解释","number":27,"question":"平抑肝阳药","answer":"平肝潜阳或息风止痉，治疗肝阳上亢或肝风内动病症的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"7ef5e45f4a3e495f","type":"名词解释","number":28,"question":"息风止痉药","answer":"息风止痉，治疗肝风内动证","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"6ba02f9cfc209b10","type":"名词解释","number":29,"question":"开窍药","answer":"开窍醒神，治疗闭证神昏的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"7d3bf484615bb362","type":"名词解释","number":30,"question":"补虚药","answer":"补虚扶弱，纠正人体的气血阴阳不足，治疗各种虚证的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"7b4011674114833f","type":"名词解释","number":31,"question":"收涩药","answer":"收敛固涩，用以治疗各种滑脱症为主的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"43d43821ed4026a1","type":"名词解释","number":32,"question":"涌吐药","answer":"促使呕吐，治疗毒物，宿食，痰涎等停滞在胃脘或胸膈以上所致病症为主的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"a644ff87ba3fe5c9","type":"名词解释","number":33,"question":"攻毒杀虫止痒药","answer":"攻毒疗疮，杀虫止痒，治疗痈肿疮毒，疥癣瘙痒为主的药物","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"0441cbde1de19be8","type":"名词解释","number":34,"question":"拔毒化腐生肌药","answer":"拔毒化腐，生肌敛疮，治疗疮疡脓出不畅，或久溃不敛等病症的药物。","options":[],"chapter":"各论 · 药物分类","source":"中药学重点归纳6页 (1).pdf"},{"id":"78bc438c85026904","type":"问答题","number":1,"question":"中药治病的基本作用是什么?","answer":"①祛除病邪，消除病因。②扶正固本。③协调脏腑经络机能。④纠正阴阳偏盛偏衰,达到阴平阳秘的正常状态。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 1"},{"id":"e10758cffac58ba7","type":"问答题","number":2,"question":"简述中药炮制的目的。","answer":"①减毒:即降低或消除药物的毒副作用,保证用药安全。\n  ②增效:即增强药物的作用,提高临床疗效。\n  ③改变性能:即改变药物的性能和功效，使之更能适应病情的需要。\n  ④改变性状:即改变药物的某些性状，便于贮存和制剂。\n  ⑤纯净药材:保证药材品质和用量准确。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 2"},{"id":"7fa3cc6dd5a20707","type":"问答题","number":3,"question":"药物的性能主要包括哪些内容?","answer":"即四气(寒、热、温、凉、平);五味(辛、甘、酸、苦、咸、涩、淡) ;升降浮沉、归经毒性。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 3"},{"id":"bc2a5aad87b1ab83","type":"问答题","number":4,"question":"举例说明中药苦味的作用。","answer":"中药的苦味是能泄能燥能坚阴。 \n  具体指的是清泄(热邪)，如栀子清热泻火;通泄(大便)，如大黄通导大便;降泄(肺、胃，肝之气上逆)，如杏仁止咳平喘。苦寒燥湿,如黄连清热燥湿;苦温燥湿，如苍术燥湿健脾，而\n坚阴指的是泻肾火存阴，如黄柏。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 4"},{"id":"faf1a1821844a7f2","type":"问答题","number":5,"question":"酸味药的作用有哪些，举例说明。","answer":"酸味具有\"能收能涩”的特点,即具有收敛、固涩的作用。\n酸味药多用治体虚多汗、肺虚久咳、久泻肠滑、遗精滑精、遗尿尿频、崩带不止等证。\n如五味子固表止汗,乌梅敛肺止咳、五倍子涩肠止泻、山菜萸涩精止遗等。\n  一般固表止汗、敛肺止咳涩肠止泻、固精缩尿、固崩止带的药物多具有酸味。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 5"},{"id":"c2975a1ec3ba3732","type":"问答题","number":6,"question":"淡味药有何作用，举例说明。","answer":"淡味药具有“能渗能利\"的特点，即具有渗湿、利小便的作用，谈味药多用治水肿、脚气小便不利之证，如薏苡仁、茯苓、猪苓等。\n  利水渗湿的药物多具有淡味。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 6"},{"id":"e23926becff087e8","type":"问答题","number":7,"question":"分别说明甘味药的作用,并举例说明。","answer":"甘味药具有“能补能和能缓”的作用，补即补益气血阴阳，如人参补气、熟地补血、麦冬补阴、杜仲补阳。和有和中，调和之意，如甘草调和药性并解药食中毒等，缓有缓急止痛\n之意,如饴糖缓急止痛。\n一般来讲，滋阳补虚，调和药性及制止疼痛的药物多具有甘味。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 7"},{"id":"ce7edc1a1e84dcdc","type":"问答题","number":8,"question":"咸味药能够治疗何种病证,举例说明。","answer":"咸味药具有“能下、能软”的作用，下:即泻下通便，如芒硝泻热通便;软即软坚散结,用治痰核、瘿瘤等证，如海藻、牡蛎、鳖甲软坚消癥等。\n  一般来讲,软化坚硬、消散结块的药物多具有咸味。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 8"},{"id":"8cc48a18da93dd82","type":"问答题","number":9,"question":"临床应如何区别性、味的关系?","answer":"中药的性指的四性,也称四气，即寒热温凉平，是说明药物性质的标识，任何一种药物的性都是单一的，或寒性，或温性。味指的是五味，即辛甘酸苦咸涩淡,一种药物的味道可以有多种,在应用性味理论时,性是主要的，味处于从属的地位。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 9"},{"id":"36c18c86728fff67","type":"问答题","number":10,"question":"药物的味道是如何判定的?","answer":"药物的味道来源有2种，一是通过人的味觉器官感知，如乌梅味酸;二是通过临床治疗的效果总结出来的,如石膏味辛甘,其实以口尝,石膏根本就不辛,但因为石膏善于清肺热，以辛入肺之说,故云石膏味辛。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 10"},{"id":"2835b33ed7cb1352","type":"问答题","number":11,"question":"辛味药具有哪些作用?分别举例说明。","answer":"辛味有能散、能行的作用。能发散风寒，如麻黄;发散风热，如薄荷;行气如木香\n行血如红花等作用。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 11"},{"id":"804112b5a9ca189b","type":"问答题","number":12,"question":"影响药物升降浮沉的因素有哪些?","answer":"①气味:性温热、味辛甘者，多升浮;性寒凉，味酸苦咸涩者多沉降。\n②质地:质轻者,如植物的花、叶、皮、枝，多升浮;质重者，如果实，矿物、贝壳等，多沉\n降。特殊情况，如旋覆花、番泻叶质轻主沉降;蔓荆子、苍耳子虽为果实主升浮。\n③炮制:酒炒则升,姜汁炒则散，醋炒则收敛，盐水炒则下行。\n④配伍:在复方中，性质升浮的药物，与较多的沉降性药物配伍时，其升浮之性可受到一定的制约。反之，性属沉降的药物与较多的升浮性质药物同用，则其沉降之性亦能受到一定程序的制约。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 12"},{"id":"657ea12f8d7faf2d","type":"问答题","number":13,"question":"何谓中药的“七情”?","answer":"前人将相须、相使、相畏、相杀、相恶、相反六种配伍关系以及单行，合称中药的七情。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 14"},{"id":"1516f0d2664b99a2","type":"问答题","number":14,"question":"中药配伍中的“相畏”与“十九畏”应如何区别?","answer":"相畏:是指应用毒药的配伍方法，一种药物的毒性、副作用能被另一种药物减轻或消除，如半夏畏生姜，也就说半夏的毒性被生姜减轻或消除。\n  十九畏:属于相反的配伍若同用后会加重药物对人体的伤害,属于配伍禁忌,如硫黄忌与朴硝配伍应用。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 15"},{"id":"e693a66daefdf3ad","type":"问答题","number":15,"question":"应用活血祛瘀药时常配伍何类药同用?为什么?","answer":"应用活血祛瘀药常配行气药同用，因为气行则血行，气滞则血瘀，行气药可加强活血药的作用。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 17"},{"id":"7dece93c363db1a4","type":"问答题","number":16,"question":"大量应用凉血止血药时常须配伍何类药同用?为什么?","answer":"大量应用凉血止血药时，常须配伍活血药同用，以防止血留瘀。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 18"},{"id":"1de9d02120a54d95","type":"问答题","number":17,"question":"根据“阴阳互根”之理,在应用补阳，补阴药时应分别辅以何类药?为什么?","answer":"应用补阳药时，宜配伍益精血的药;以相互配合，使“阳得阴助”,才能”生化无穷”。应用补阴药时，宜适当辅以补阳药，(使阴有所化;并可借阳药之通运，以制阴药之凝滞)。使“阴得阳生而源泉不竭”。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 19"},{"id":"df7deb4d006bc5cc","type":"问答题","number":18,"question":"应用化痰药时常配伍哪些药同用?为什么?","answer":"应用化痰药时常配健脾药同用，因为脾为生痰之源，健脾则能减少痰的生成，为治痰之本亦配行气药同用，因为气行则痰易化;故常配此两类药同用。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 20"},{"id":"f0024906d0359bf5","type":"问答题","number":19,"question":"应用收涩药时常配伍何类药同用?为什么?","answer":"应用收涩药常配补虚药同用，因为收涩药为滑脱证而设，偏治标，补虚药能治本，滑脱病证宜标本兼治,故配补虚药后能标本兼顾。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 21"},{"id":"da6e69cadc30bc7c","type":"问答题","number":20,"question":"应用退虚热药时常配何类药同用,为什么?","answer":"常配养阴药及清热凉血药同用。因引起虚热的原因主要为肝肾阴虚，虚火内扰所致,配养阴药同用，可以标本兼顾;另外温热病后期,邪热未尽，阴液已伤也可致虚热,此时单纯退虚热则邪热尚未尽，故配清热凉血药同用，既退虚热，又消实热。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 22"},{"id":"1ae60546a45e49cc","type":"问答题","number":21,"question":"应用补血药时，常配何类药同用,为什么?","answer":"常配补气药同用，因气能生血，配补气药同用，可加强补血之功。","options":[],"chapter":"中药总论与配伍","source":"中药大题 (1).doc · 简答 23"},{"id":"9092cbed5cc53c61","type":"功效速记","number":1,"question":"麻黄的主要功效是什么？","answer":"发汗解表，宣肺平喘，利水消肿。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 麻黄"},{"id":"31390dfe2d9a5baf","type":"功效速记","number":2,"question":"桂枝的主要功效是什么？","answer":"发汗解肌，温通经脉，助阳化气。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 桂枝"},{"id":"98af7f0b429c0ae6","type":"功效速记","number":3,"question":"紫苏的主要功效是什么？","answer":"解表散寒，行气宽中，解鱼蟹毒。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 紫苏"},{"id":"913fe6143b50d4f4","type":"功效速记","number":4,"question":"生姜的主要功效是什么？","answer":"解表散寒，温中止呕，温肺止咳。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 生姜"},{"id":"b537985d77ebb3e9","type":"功效速记","number":5,"question":"香薷的主要功效是什么？","answer":"发汗解表，化湿和中，利水消肿。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 香薷"},{"id":"71952bf8b2ae6de7","type":"功效速记","number":6,"question":"荆芥的主要功效是什么？","answer":"祛风解表，透疹，炒炭止血。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 荆芥"},{"id":"8bd7af21a86d9836","type":"功效速记","number":7,"question":"防风的主要功效是什么？","answer":"祛风解表，胜湿止痛，止痉。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 防风"},{"id":"52423c3a5551c560","type":"功效速记","number":8,"question":"羌活的主要功效是什么？","answer":"解表散寒，祛风胜湿，止痛。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 羌活"},{"id":"f519a08c9fcdbf02","type":"功效速记","number":9,"question":"白芷的主要功效是什么？","answer":"解表散寒，祛风止痛，宣通鼻窍，燥湿止带，消肿排脓。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 白芷"},{"id":"e4fcb5aade6148f1","type":"功效速记","number":10,"question":"细辛的主要功效是什么？","answer":"解表散寒，祛风止痛，通窍，温肺化饮。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 细辛"},{"id":"b56eb8c88d9541af","type":"功效速记","number":11,"question":"薄荷的主要功效是什么？","answer":"疏散风热，清利头目，利咽，透疹，疏肝行气。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 薄荷"},{"id":"7fe7e69ff32ae2fd","type":"功效速记","number":12,"question":"桑叶的主要功效是什么？","answer":"疏散风热，清肺润燥，平抑肝阳，清肝明目。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 桑叶"},{"id":"08065de1d3b39bd4","type":"功效速记","number":13,"question":"菊花的主要功效是什么？","answer":"疏散风热，平抑肝阳，清肝明目，清热解毒。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 菊花"},{"id":"a781db472da3157c","type":"功效速记","number":14,"question":"柴胡的主要功效是什么？","answer":"疏散退热，疏肝解郁，升举阳气。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 柴胡"},{"id":"1199897e33f43205","type":"功效速记","number":15,"question":"葛根的主要功效是什么？","answer":"解肌退热，透疹，生津止渴，升阳止泻。","options":[],"chapter":"解表药","source":"最全中药学笔记20页BD (1).doc · 葛根"},{"id":"eaf68e2f8ec57da6","type":"功效速记","number":16,"question":"石膏的主要功效是什么？","answer":"生用清热泻火，除烦止渴；煅用收湿、生肌、敛疮、止血。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 石膏"},{"id":"eb30cfb453a87934","type":"功效速记","number":17,"question":"知母的主要功效是什么？","answer":"清热泻火，滋阴润燥。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 知母"},{"id":"e9b54d1a47f74f00","type":"功效速记","number":18,"question":"栀子的主要功效是什么？","answer":"泻火除烦，清热利湿，凉血解毒。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 栀子"},{"id":"6b4144f6abcd957e","type":"功效速记","number":19,"question":"黄芩的主要功效是什么？","answer":"清热燥湿，泻火解毒，止血，安胎。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 黄芩"},{"id":"68641ab7a60c7918","type":"功效速记","number":20,"question":"黄连的主要功效是什么？","answer":"清热燥湿，泻火解毒。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 黄连"},{"id":"db895b77e4ddbced","type":"功效速记","number":21,"question":"黄柏的主要功效是什么？","answer":"清热燥湿，泻火解毒，退虚热。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 黄柏"},{"id":"28175f7ca6058495","type":"功效速记","number":22,"question":"金银花的主要功效是什么？","answer":"清热解毒，疏散风热。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 金银花"},{"id":"23f1abca721c1cb0","type":"功效速记","number":23,"question":"连翘的主要功效是什么？","answer":"清热解毒，消肿散结，疏散风热。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 连翘"},{"id":"098dfa19b149f846","type":"功效速记","number":24,"question":"板蓝根的主要功效是什么？","answer":"清热解毒，凉血，利咽。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 板蓝根"},{"id":"8d31d3da02bdab44","type":"功效速记","number":25,"question":"生地黄的主要功效是什么？","answer":"清热凉血，养阴生津。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 生地黄"},{"id":"61188f40c01aaae4","type":"功效速记","number":26,"question":"牡丹皮的主要功效是什么？","answer":"清热凉血，活血祛瘀。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 牡丹皮"},{"id":"83064a465718a179","type":"功效速记","number":27,"question":"赤芍的主要功效是什么？","answer":"清热凉血，散瘀止痛。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 赤芍"},{"id":"215093b39f1ee7ed","type":"功效速记","number":28,"question":"青蒿的主要功效是什么？","answer":"清虚热，除骨蒸，解暑热，截疟。","options":[],"chapter":"清热药","source":"最全中药学笔记20页BD (1).doc · 青蒿"},{"id":"f430ae6a5075c1a7","type":"功效速记","number":29,"question":"大黄的主要功效是什么？","answer":"泻下攻积，清热泻火，凉血解毒，逐瘀通经，利湿退黄。","options":[],"chapter":"泻下药","source":"最全中药学笔记20页BD (1).doc · 大黄"},{"id":"32515fd489e35e13","type":"功效速记","number":30,"question":"芒硝的主要功效是什么？","answer":"泻下通便，润燥软坚，清火消肿。","options":[],"chapter":"泻下药","source":"最全中药学笔记20页BD (1).doc · 芒硝"},{"id":"6057cb16303ce20a","type":"功效速记","number":31,"question":"火麻仁的主要功效是什么？","answer":"润肠通便。","options":[],"chapter":"泻下药","source":"最全中药学笔记20页BD (1).doc · 火麻仁"},{"id":"30c0ada2fc64b2d7","type":"功效速记","number":32,"question":"独活的主要功效是什么？","answer":"祛风湿，止痛，解表。","options":[],"chapter":"祛风湿药","source":"最全中药学笔记20页BD (1).doc · 独活"},{"id":"ce0e116a9b59040a","type":"功效速记","number":33,"question":"秦艽的主要功效是什么？","answer":"祛风湿，通络止痛，退虚热，清湿热。","options":[],"chapter":"祛风湿药","source":"最全中药学笔记20页BD (1).doc · 秦艽"},{"id":"f95040686559137e","type":"功效速记","number":34,"question":"桑寄生的主要功效是什么？","answer":"祛风湿，补肝肾，强筋骨，安胎。","options":[],"chapter":"祛风湿药","source":"最全中药学笔记20页BD (1).doc · 桑寄生"},{"id":"ec4336f1dfde80e6","type":"功效速记","number":35,"question":"藿香的主要功效是什么？","answer":"化湿，止呕，解暑。","options":[],"chapter":"化湿药","source":"最全中药学笔记20页BD (1).doc · 藿香"},{"id":"71970f203732caf0","type":"功效速记","number":36,"question":"苍术的主要功效是什么？","answer":"燥湿健脾，祛风散寒，明目。","options":[],"chapter":"化湿药","source":"最全中药学笔记20页BD (1).doc · 苍术"},{"id":"5153045d74353f0a","type":"功效速记","number":37,"question":"厚朴的主要功效是什么？","answer":"燥湿消痰，下气除满。","options":[],"chapter":"化湿药","source":"最全中药学笔记20页BD (1).doc · 厚朴"},{"id":"f88b0a636d7ab2bb","type":"功效速记","number":38,"question":"砂仁的主要功效是什么？","answer":"化湿开胃，温脾止泻，理气安胎。","options":[],"chapter":"化湿药","source":"最全中药学笔记20页BD (1).doc · 砂仁"},{"id":"03ffb3cf6c62cc03","type":"功效速记","number":39,"question":"茯苓的主要功效是什么？","answer":"利水渗湿，健脾，宁心。","options":[],"chapter":"利水渗湿药","source":"最全中药学笔记20页BD (1).doc · 茯苓"},{"id":"a8f66114ea8a21c3","type":"功效速记","numbe <script>
'use strict';
const bank = JSON.parse(document.querySelector('#bank').textContent);
const byId = new Map(bank.map(q => [q.id, q]));
const storageKey = 'tcm-study-v1';
let saved;
try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; } catch { saved = {}; }
const results = saved.results || {};
let filter = '全部题目';
let order = bank.map(q => q.id);
let current = byId.has(saved.current) ? saved.current : order[0];
let revealed = false;
let selected = '';
let storageFailed = false;
const panel = document.querySelector('#panel');
const types = ["全部题目", "单选题", "名词解释", "问答题", "功效速记"];
const reviews = ['错题', '收藏'];
const inType = q => filter === '全部题目' || (filter === '错题' ? results[q.id]?.wrong : filter === '收藏' ? results[q.id]?.star : q.type === filter);
const chapterSelect = document.querySelector('#chapter');
for (const chapter of ['全部章节', ...new Set(bank.map(q => q.chapter))]) {
  const option = node('option', chapter);
  option.value = chapter;
  chapterSelect.append(option);
}
const collection = q => (chapterSelect.value === '全部章节' || q.chapter === chapterSelect.value) && inType(q);
chapterSelect.addEventListener('change', () => setFilter('全部题目'));
let queue = order.filter(id => collection(byId.get(id)));
document.querySelector('#total').textContent = '共 ' + bank.length + ' 题';

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text != null) element.textContent = text;
  if (className) element.className = className;
  return element;
}
function button(label, action, className) {
  const element = node('button', label, className);
  element.type = 'button';
  element.addEventListener('click', action);
  return element;
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({results, current})); }
  catch { storageFailed = true; }
}
function go(id, focus = false) {
  current = id;
  revealed = false;
  selected = '';
  save();
  render();
  if (focus) panel.querySelector('h1')?.focus();
}
function setFilter(value) {
  filter = value;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue.includes(current) ? current : queue[0], true);
}
function renderNav() {
  for (const [selector, labels] of [['#types', types], ['#review', reviews]]) {
    const nav = document.querySelector(selector);
    nav.replaceChildren();
    for (const label of labels) {
      const count = bank.filter(q => (chapterSelect.value === '全部章节' || q.chapter === chapterSelect.value) && (label === '全部题目' || q.type === label || (label === '错题' && results[q.id]?.wrong) || (label === '收藏' && results[q.id]?.star))).length;
      const control = button(label, () => setFilter(label));
      control.append(node('span', count));
      control.setAttribute('aria-current', String(label === filter));
      nav.append(control);
    }
  }
}
function record(q, changes) {
  results[q.id] = {...results[q.id], ...changes};
  save();
}
function update(focusId) {
  render();
  if (focusId) document.getElementById(focusId)?.focus();
}
function shuffle() {
  const shuffled = [...order];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  order = shuffled;
  queue = order.filter(id => collection(byId.get(id)));
  go(queue[0], true);
}
function render() {
  renderNav();
  panel.replaceChildren();
  const q = byId.get(current);
  const index = queue.indexOf(current);
  if (!q || index < 0) {
    panel.append(node('h1', filter === '错题' ? '暂无错题' : filter === '收藏' ? '暂无收藏' : '本章暂无该题型'));
    panel.append(button('返回全部题目', () => setFilter('全部题目'), 'primary'));
    return;
  }
  const meta = node('div', null, 'meta');
  const completed = queue.filter(id => results[id]?.done).length;
  meta.append(node('strong', q.chapter + ' · ' + q.type), node('span', '当前 ' + (index + 1) + ' / ' + queue.length + ' · 已练 ' + completed));
  const progress = node('progress');
  progress.max = queue.length;
  progress.value = completed;
  progress.setAttribute('aria-label', '已练习题数');
  const title = node('h1', q.question);
  title.tabIndex = -1;
  panel.append(meta, progress, title);
  if (q.options.length) {
    const choices = node('div', null, 'choices');
    for (const [key, label] of q.options) {
      const control = button(label, () => {
        if (selected) return;
        selected = key;
        revealed = true;
        if (q.answer) record(q, {done:true, wrong:key !== q.answer});
        update('choice-' + key);
      });
      control.id = 'choice-' + key;
      if (selected) control.setAttribute('aria-disabled', 'true');
      if (revealed && key === q.answer) control.className = 'good';
      else if (revealed && key === selected && q.answer) control.className = 'bad';
      choices.append(control);
    }
    panel.append(choices);
  }
  const actions = node('div', null, 'actions');
  const toggle = button(revealed ? '收起答案' : '查看答案', () => {
    revealed = !revealed;
    update('answer-toggle');
  }, 'primary');
  toggle.id = 'answer-toggle';
  toggle.setAttribute('aria-expanded', String(revealed));
  toggle.setAttribute('aria-controls', 'answer');
  const star = button(results[q.id]?.star ? '取消收藏' : '收藏本题', () => {
    record(q, {star:!results[q.id]?.star});
    update('star');
  });
  star.id = 'star';
  actions.append(toggle, star);
  panel.append(actions);
  const answer = node('div', null, 'answer');
  answer.id = 'answer';
  answer.hidden = !revealed;
  answer.setAttribute('aria-live', 'polite');
  if (revealed) {
    const heading = selected && q.answer ? (selected === q.answer ? '答对了' : '答错了') : '参考答案';
    const answerText = q.options.find(([key]) => key === q.answer)?.[1] || q.answer || '原表未提供答案';
    answer.append(node('strong', heading), node('div', answerText));
    if (q.note) answer.append(node('div', q.note));
    answer.append(node('div', '来源 · ' + q.source, 'quiet'));
  }
  panel.append(answer);
  if (revealed && !q.options.length && q.answer) {
    const assess = node('div', null, 'actions');
    for (const [label, wrong, id] of [['已掌握',false,'known'],['记为错题',true,'unknown']]) {
      const control = button(label, () => {record(q, {done:true, wrong}); update(id);});
      control.id = id;
      control.setAttribute('aria-pressed', String(results[q.id]?.done && results[q.id]?.wrong === wrong || false));
      assess.append(control);
    }
    if (results[q.id]?.done) assess.append(node('span', results[q.id].wrong ? '已加入错题' : '已标为掌握', 'quiet'));
    panel.append(assess);
  }
  const foot = node('div', null, 'foot');
  const previous = button('上一题', () => go(queue[index - 1], true));
  previous.disabled = index === 0;
  const next = button('下一题', () => go(queue[index + 1], true));
  next.disabled = index === queue.length - 1;
  const jump = node('select', null, 'jump');
  jump.setAttribute('aria-label', '跳到指定题目');
  queue.forEach((id, i) => {
    const item = byId.get(id);
    const option = node('option', '第 ' + (i + 1) + ' 题 · ' + item.type);
    option.value = id;
    jump.append(option);
  });
  jump.value = current;
  jump.addEventListener('change', () => go(jump.value, true));
  const paging = node('div', null, 'actions');
  paging.append(previous, jump, next);
  foot.append(paging, button('随机排序', shuffle));
  panel.append(foot);
  if (storageFailed) panel.append(node('p', '浏览器未允许本地存储，本次记录会在关闭后清除。', 'quiet'));
}
render();
</script>
</html>
